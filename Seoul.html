      if (index >= thumbs.length) index = 0;
      currentIndex = index;
      const targetThumb = thumbs[index], newSrc = targetThumb.dataset.src;
      if (mainImg.src !== newSrc) { mainImg.style.opacity = '0'; setTimeout(() => { mainImg.src = newSrc; mainImg.style.opacity = '1'; }, 150); }
      thumbs.forEach((t, i) => t.classList.toggle('active', i === index));
      targetThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    };
    mainImg.addEventListener('touchstart', e => { startX = e.changedTouches[0].screenX; isSwiping = true; }, { passive: true });
    mainImg.addEventListener('touchend', e => { if (!isSwiping) return; isSwiping = false; const diff = e.changedTouches[0].screenX - startX; if (diff > 40) window.updateGalleryUI(currentIndex - 1); else if (diff < -40) window.updateGalleryUI(currentIndex + 1); }, { passive: true });
    mainImg.addEventListener('mousedown', e => { startX = e.screenX; isSwiping = true; });
    mainImg.addEventListener('mouseup', e => { if (!isSwiping) return; isSwiping = false; const diff = e.screenX - startX; if (diff > 50) window.updateGalleryUI(currentIndex - 1); else if (diff < -50) window.updateGalleryUI(currentIndex + 1); });
    mainImg.addEventListener('mouseleave', () => isSwiping = false);

    if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
      mainImg.addEventListener('mousemove', function(e) {
        var rect = mainImg.getBoundingClientRect();
        var x = ((e.clientX - rect.left) / rect.width) * 100;
        var y = ((e.clientY - rect.top) / rect.height) * 100;
        x = Math.max(0, Math.min(100, x));
        y = Math.max(0, Math.min(100, y));
        mainImg.style.transformOrigin = x + '% ' + y + '%';
      });
      mainImg.addEventListener('mouseout', function() { mainImg.style.transformOrigin = 'center center'; });
    }
  }

const closeAllSelects = except => $$('.cselect.open').forEach(el => { if(el !== except) el.classList.remove('open'); });

document.addEventListener('click', e => {
  const trigger = e.target.closest('.cselect-trigger');
  if(trigger){
    e.preventDefault(); e.stopPropagation();
    const cs = trigger.closest('.cselect');
    const wasOpen = cs.classList.contains('open');
    closeAllSelects(cs);
    cs.classList.toggle('open', !wasOpen);
    trigger.setAttribute('aria-expanded', String(!wasOpen));
    return;
  }
  const copt = e.target.closest('.cselect-option');
  if(copt){
    e.preventDefault(); e.stopPropagation();
    const cs = copt.closest('.cselect');
    const value = copt.dataset.value;
    const label = copt.dataset.label || copt.textContent.trim();
    cs.dataset.value = value;
    $('.cselect-label', cs).textContent = label;
    const hidden = $('input[type="hidden"]', cs);
    if(hidden) hidden.value = value;
    $$('.cselect-option', cs).forEach(o => {
      const on = o.dataset.value === value;
      o.classList.toggle('active', on);
      o.setAttribute('aria-selected', String(on));
      const chk = $('.cselect-check', o);
      if(on && !chk){ const s = document.createElement('span'); s.className = 'cselect-check'; s.innerHTML = ICON.check; o.appendChild(s); }
      else if(!on && chk) chk.remove();
    });
    cs.classList.remove('open');
    $('.cselect-trigger', cs).setAttribute('aria-expanded', 'false');
    cs.dispatchEvent(new CustomEvent('cselect-change', { detail:{ value, label, cs } }));
    return;
  }
  if(!e.target.closest('.cselect')) closeAllSelects();

  const el = e.target.closest('[data-action],[data-filter]');
  if(!el) return;
  if(el.dataset.filter){
    const { filter:type, value } = el.dataset;
    if(type === 'cat'){ filters.cat = value; $$('[data-filter="cat"]').forEach(b => b.classList.toggle('active', b === el)); }
    else { const arr = type === 'size' ? filters.sizes : filters.colors; const i = arr.indexOf(value); i > -1 ? arr.splice(i, 1) : arr.push(value); el.classList.toggle('active'); }
    renderShopResults();
    return;
  }
  const d = el.dataset;
  const pdpTarget = () => {
    const id = Number(d.id), p = findProduct(id);
    if(!p) return null;
    if(p.stock <= 0){ toast('Sản phẩm đã hết hàng', 'error'); return null; }
    const same = pdp.productId === id;
    return { id, size: same ? pdp.size : p.sizes[0], color: same ? pdp.color : p.colors[0].name, qty: same ? pdp.qty : 1 };
  };
  switch(d.action){
    case 'set-order-tab': currentOrderStatus = d.status; render(); break;
    case 'open-search': openSearch(); break;
    case 'toggle-cart-item': { const item = state.cart.find(i => i.key === d.key); if(item) { item.selected = !item.selected; saveAll(); window.keepScroll = true; render(); } break; }
    case 'view-order': showOrderDetail(d.id); break;
    case 'close-order-detail': closeOrderDetail(); break;
    case 'open-notif': e.stopPropagation(); openNotifPanel(); break;
    case 'close-notif': closeNotifPanel(); break;
    case 'open-product': closeQV(); closeSearch(); location.hash = '#/product/' + d.id; break;
    case 'quick-view': e.stopPropagation(); openQuickView(Number(d.id)); break;
    case 'close-qv': closeQV(); break;
    case 'wishlist': e.stopPropagation(); toggleWishlist(Number(d.id)); break;
    case 'pdp-wish': toggleWishlist(Number(d.id)); break;
    case 'add-cart': e.stopPropagation(); addToCart(Number(d.id)); break;
    case 'cart-remove': removeFromCart(d.key); toast('Đã xoá sản phẩm khỏi giỏ'); break;
    case 'cart-qty': setQty(d.key, Number(d.delta)); break;
    case 'pdp-size': pdp.size = d.size; $$('[data-action="pdp-size"]').forEach(b => b.classList.toggle('active', b.dataset.size === pdp.size)); $('#sizeLabel').textContent = pdp.size; break;
    case 'pdp-color': pdp.color = d.color; $$('[data-action="pdp-color"]').forEach(b => b.classList.toggle('active', b.dataset.color === pdp.color)); $('#colorLabel').textContent = pdp.color; break;
    case 'pdp-qty': { const p = findProduct(pdp.productId); pdp.qty = Math.max(1, Math.min(pdp.qty + Number(d.delta), p ? p.stock : 99)); $('#pdpQty').textContent = pdp.qty; break; }
    case 'pdp-add': { const t = pdpTarget(); if(t) addToCart(t.id, t.size, t.color, t.qty); break; }
    case 'pdp-buy-now': { const t = pdpTarget(); if(t){ addToCart(t.id, t.size, t.color, t.qty, true); location.hash = '#/checkout'; } break; }
    case 'gallery': { const index = Number(el.dataset.index); updateGalleryUI(index); break; }
    case 'accordion': el.parentElement.classList.toggle('open'); break;
    case 'toggle-pw': { const input = $('input', el.parentElement); if(!input) break; const show = input.type === 'password'; input.type = show ? 'text' : 'password'; el.innerHTML = show ? ICON.eyeOff : ICON.eye; break; }
    case 'google-login': toast('Đăng nhập Google chưa được cấu hình — cần backend OAuth', 'error'); break;
    case 'forgot': e.preventDefault(); toast('Khôi phục mật khẩu cần backend email service', 'error'); break;
    case 'logout': showConfirm('Bạn có chắc chắn muốn đăng xuất khỏi tài khoản SEOULÉ không?', () => { state.user = null; saveAll(); toast('Đã đăng xuất'); location.hash = '#/'; }, 'Đăng xuất', 'Đăng xuất'); break;
    case 'admin-tab': adminTab = d.tab; editingProductId = null; render(); break;
    case 'admin-logout': adminAuthed = false; sessionStorage.removeItem('ss_admin_v7'); toast('Đã đăng xuất khỏi khu vực quản trị'); render(); break;
    case 'admin-edit': editingProductId = Number(d.id); adminTab = 'products'; render(); window.scrollTo({top:0, behavior:'smooth'}); break;
    case 'admin-cancel-edit': editingProductId = null; render(); break;
    case 'admin-delete': { const id = Number(el.dataset.id); const p = state.products.find(x=>x.id===id); if(!p) break; showConfirm(`Xoá sản phẩm "${p.name}"?`, () => { state.products = state.products.filter(x=>x.id!==id); saveAll(); toast('Đã xoá sản phẩm'); render(); }, 'Xoá sản phẩm', 'Xoá'); break; }
    case 'del-code': state.codes.splice(Number(d.index), 1); saveAll(); toast('Đã xoá mã giảm giá'); render(); break;
    case 'del-address': state.addresses = state.addresses.filter(a => a.id !== d.id); saveAll(); toast('Đã xoá địa chỉ'); render(); break;
    case 'cancel-order': { const ord = state.orders.find(x => x.id === d.id); if(!ord) break; showConfirm(`Bạn có chắc muốn huỷ đơn hàng <b>#${esc(ord.id).slice(-6)}</b> không?`, () => { ord.status = 'cancelled'; saveAll(); updateBadges(); toast('Đã huỷ đơn hàng'); render(); if($('#orderDetailModal') && $('#orderDetailModal').classList.contains('open')) showOrderDetail(ord.id); }, 'Huỷ đơn hàng', 'Huỷ đơn'); break; }
    case 'reset-filters': filters = defaultFilters(); setFilterPanel(false); render(); toast('Đã xoá bộ lọc'); break;
    case 'wishlist-clear': state.wishlist = []; saveAll(); updateBadges(); toast('Đã xoá toàn bộ yêu thích'); render(); break;
    case 'toggle-filter': setFilterPanel(!$('#filterDropdown').classList.contains('open')); break;
    case 'close-filter': setFilterPanel(false); break;
    case 'apply-filters': {
      const pmin = $('#filterPriceMin'), pmax = $('#filterPriceMax'), prov = $('#filterProvince');
      if(pmin){ let v = pmin.value ? Number(pmin.value.replace(/\./g, '')) : 0; filters.min = (isNaN(v) || v < 0) ? 0 : v; }
      if(pmax){ let v = pmax.value ? Number(pmax.value.replace(/\./g, '')) : PRICE_MAX; filters.max = (isNaN(v) || v < 0) ? PRICE_MAX : v; }
      if(filters.min > filters.max){ [filters.min, filters.max] = [filters.max, filters.min]; if(pmin) pmin.value = filters.min || ''; if(pmax) pmax.value = filters.max < PRICE_MAX ? filters.max : ''; }
      if(prov) filters.province = prov.dataset.value || '';
      renderShopResults(); setFilterPanel(false); toast('Đã áp dụng bộ lọc'); break;
    }
  }
});

document.addEventListener('click', function(e) {
  var isLoggedIn = window.SEOUL_STUDIO && window.SEOUL_STUDIO.state && window.SEOUL_STUDIO.state.user;
  var buyNowBtn = e.target.closest('[data-action="pdp-buy-now"]');
  if (buyNowBtn && !isLoggedIn) { e.preventDefault(); e.stopImmediatePropagation(); location.hash = '#/login'; return; }
  var checkoutBtn = e.target.closest('a[href="#/checkout"]');
  if (checkoutBtn && !isLoggedIn) { e.preventDefault(); e.stopImmediatePropagation(); location.hash = '#/login'; return; }
}, true);

window.addEventListener('hashchange', function() {
   var isLoggedIn = window.SEOUL_STUDIO && window.SEOUL_STUDIO.state && window.SEOUL_STUDIO.state.user;
   if (location.hash === '#/checkout' && !isLoggedIn) { location.hash = '#/login'; }
});

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-slider]');
  if(!btn) return;
  const slider = $(btn.dataset.slider === 'new' ? '#sliderNew' : '#sliderBest');
  if(slider) slider.scrollBy({ left: slider.clientWidth * .75 * Number(btn.dataset.dir), behavior:'smooth' });
});

document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  if((e.key === 'Enter' || e.key === ' ') && ae && ae.matches('article.pcard[data-action="open-product"]')){ e.preventDefault(); ae.click(); }
  const cs = e.target.closest && e.target.closest('.cselect');
  if(cs){
    if(e.key === 'Escape') cs.classList.remove('open');
    if((e.key === 'ArrowDown' || e.key === 'ArrowUp') && cs.classList.contains('open')){
      e.preventDefault();
      const o = $$('.cselect-option', cs);
      const cur = o.indexOf(ae);
      const next = cur === -1 ? 0 : (cur + (e.key === 'ArrowDown' ? 1 : -1) + o.length) % o.length;
      if(o[next]) o[next].focus();
    }
  }
  if(e.key === 'Escape'){ closeDrawer(); closeSearch(); closeQV(); setFilterPanel(false); closeNotifPanel(); closeAllSelects(); closeOrderDetail(); }
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(); }
});
document.addEventListener('dragstart', e => { if(e.target.tagName === 'IMG') e.preventDefault(); });

(function setupDrawEffect(){
  const ov = $('#drawOverlay');
  let drawing = false, bypass = false;
  document.addEventListener('submit', e => {
    const f = e.target;
    if(bypass || (f.id !== 'loginForm' && f.id !== 'registerForm')) return;
    e.preventDefault(); e.stopPropagation();
    if(drawing) return;
    drawing = true;
    ov.classList.add('active');
    setTimeout(() => { ov.classList.remove('active'); drawing = false; if(!f.isConnected) return; bypass = true; try{ f.requestSubmit(); } finally { bypass = false; } }, 1500);
  }, true);
})();

window.addEventListener('hashchange', render);
if(!location.hash) location.hash = '#/';
render();
window.SEOUL_STUDIO = { state, addToCart, toggleWishlist, render, updateBadges, version:'7.1.0-demo' };

})();
