<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="SEOULÉ — Thời trang Hàn Quốc hiện đại, thiết kế tối giản, chất liệu bền vững.">
<title>SEOULÉ — Thời trang Hàn Quốc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<!-- Thư viện SweetAlert2 cho thông báo -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{overscroll-behavior:none}
:root{
  --ink:#0e0e0e;--ink-soft:#2a2a2a;--muted:#7d7871;
  --bg:#ffffff;--cream:#f9f9f9;
  --line:rgba(14,14,14,.09);--line-strong:rgba(14,14,14,.16);
  --brown-soft:rgba(14,14,14,.08);
  --price-red:#c45c5c;--danger:#c8383a;
  --shadow-s:0 4px 14px rgba(20,18,15,.07);
  --shadow-m:0 14px 38px rgba(20,18,15,.11);
  --shadow-l:0 28px 70px rgba(20,18,15,.18);
  --shadow-card:0 1px 2px rgba(20,18,15,.04),0 4px 10px rgba(20,18,15,.05),0 12px 24px rgba(20,18,15,.04);
  --shadow-card-hover:0 2px 4px rgba(20,18,15,.05),0 8px 20px rgba(20,18,15,.09),0 20px 40px rgba(20,18,15,.10);
  --r:16px;--r-lg:22px;--r-xl:30px;
  --ease:cubic-bezier(.22,.61,.36,1);--ease-out:cubic-bezier(.16,1,.3,1);
  --header-h:112px;--max:1320px;--bottom-nav-h:36px;
  --sab:env(safe-area-inset-bottom,0px);
}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.55;font-size:15px}
button:focus,a:focus,select:focus,input:focus,textarea:focus,[tabindex]:focus{outline:none}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,.chip:focus-visible,.cselect-trigger:focus-visible,.cselect-option:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none}
button,.btn,a,.chip,.size-btn,.color-btn,.icon-btn,.mini-btn,.pcard,.cat-item,.cselect-trigger,.cselect-option,.quick-nav a{touch-action:manipulation}
img{-webkit-user-drag:none;user-drag:none;display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
ul{list-style:none}
[data-icon]{display:contents}
::selection{background:#111;color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(20,18,15,.16);border-radius:99px;border:2px solid var(--bg)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

.container{max-width:var(--max);margin:0 auto;padding:0 clamp(14px,3.5vw,40px);width:100%}
.row{display:flex;align-items:center}
.muted{color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:transform .35s var(--ease-out),background .3s,color .3s,box-shadow .35s,border-color .3s;border:1px solid transparent;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-primary:hover{background:#000;transform:translateY(-2px) scale(1.02);box-shadow:0 12px 30px rgba(14,14,14,.28)}
.btn-outline{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn-outline:hover{background:var(--ink);color:#fff;border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow-m)}
.btn-light{background:#fff;color:var(--ink);border-color:#fff;box-shadow:var(--shadow-s)}
.btn-light:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow-m)}
.btn-block{width:100%}
.btn-sm{padding:9px 16px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* Nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:900;padding:12px clamp(10px,2.6vw,24px) 0;pointer-events:none}
.nav-inner{pointer-events:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:54px;padding:0 8px;border-radius:999px;max-width:var(--max);margin:0 auto;background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 32px rgba(0,0,0,.1),inset 0 1px 2px rgba(255,255,255,.9);transform:translateZ(0);will-change:transform}
.nav.scrolled .nav-inner{background:rgba(255,255,255,.98);box-shadow:0 4px 20px rgba(20,18,15,.06)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--ink);transition:background .25s var(--ease),transform .25s var(--ease)}
.icon-btn svg{width:19px;height:19px}
.icon-btn:hover{background:rgba(14,14,14,.06);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.92)}
.nav-actions{justify-self:end;display:flex;align-items:center}
.badge-count{position:absolute;top:2px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--ink);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;transition:transform .3s var(--ease-out)}
.badge-count.pop{animation:popBadge .5s var(--ease-out)}
@keyframes popBadge{0%{transform:scale(1)}35%{transform:scale(1.5)}70%{transform:scale(.9)}100%{transform:scale(1)}}
.badge-count.zero{opacity:0;transform:scale(.4)}
.logo{font-weight:700;font-size:14px;letter-spacing:.32em;text-transform:uppercase;white-space:nowrap;padding:0 6px;transition:opacity .3s}
.logo:hover{opacity:.65}
.burger{display:flex;flex-direction:column;gap:4px;width:18px}
.burger i{display:block;height:1.6px;background:var(--ink);border-radius:2px;transition:all .35s var(--ease)}
.burger i:nth-child(2){width:12px}
.icon-btn:hover .burger i:nth-child(2){width:18px}

/* Quick nav */
.quick-nav-wrapper{pointer-events:auto;max-width:var(--max);margin:6px auto 0;padding:0 8px}
.quick-nav{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(2px,.6vw,12px);padding:5px 10px;background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.8);border-radius:999px;box-shadow:0 4px 15px rgba(0,0,0,.05),inset 0 1px 1px rgba(255,255,255,.9);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;transform:translateZ(0);will-change:transform}
.quick-nav::-webkit-scrollbar{display:none}
.quick-nav-pill{position:absolute;top:5px;bottom:5px;left:0;width:0;background:rgba(14,14,14,.08);border:1px solid transparent;border-radius:999px;z-index:0;pointer-events:none;opacity:0;transition:transform .38s var(--ease-out),width .38s var(--ease-out),opacity .25s var(--ease);will-change:transform,width}
.quick-nav-pill.show{opacity:1}
.quick-nav a{position:relative;z-index:1;padding:5px clamp(6px,1.2vw,14px);border-radius:999px;font-size:clamp(10px,2.2vw,12px);font-weight:500;color:var(--ink-soft);white-space:nowrap;transition:color .25s var(--ease),font-weight .25s var(--ease)}
.quick-nav a:hover,.quick-nav a.active{color:var(--ink)}
.quick-nav a.active{font-weight:600}

/* Overlay / Drawer */
.overlay{position:fixed;inset:0;background:rgba(12,12,12,.5);z-index:940;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:clamp(260px,50vw,400px);max-width:50vw;z-index:960;transform:translateX(-104%);transition:transform .55s var(--ease-out);background:rgba(255,255,255,.96);border-right:1px solid rgba(255,255,255,.7);box-shadow:24px 0 70px rgba(20,18,15,.18),inset -1px 0 0 rgba(255,255,255,.55);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 14px}
.drawer-logo{font-weight:700;letter-spacing:.3em;font-size:13px;text-transform:uppercase}
.drawer-body{flex:1;overflow-y:auto;padding:6px 10px 20px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.drawer-link{display:flex;align-items:center;justify-content:space-between;padding:11px 10px;border-radius:12px;font-size:13.5px;font-weight:500;transition:background .25s,padding-left .25s,color .2s}
.drawer-link:hover{background:rgba(14,14,14,.055);padding-left:16px}
.drawer-link.active{background:var(--brown-soft);font-weight:600}
.drawer-link.active:hover{background:rgba(201,184,150,.5)}
.drawer-link .arw{opacity:0;transform:translateX(-6px);transition:all .3s var(--ease)}
.drawer-link:hover .arw{opacity:.6;transform:none}
.drawer-link.active .arw{opacity:.7;transform:none}
.drawer-link svg{width:14px;height:14px}
.drawer-group{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:16px 10px 8px;font-weight:600}
.drawer-link.sub{font-size:12.5px;color:var(--ink-soft);padding-left:20px;font-weight:400}
.drawer-link.sub:hover{padding-left:26px}
.drawer-link.sub.active{color:var(--ink);padding-left:20px}
.drawer-foot{padding:14px 18px 22px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.drawer-foot div{display:flex;justify-content:space-between}
.drawer-foot div:first-child{margin-bottom:4px}
.drawer-foot b{color:var(--ink)}

/* Search */
.search-panel{position:fixed;inset:0;z-index:970;display:flex;align-items:flex-start;justify-content:center;padding:clamp(60px,12vh,140px) 16px 16px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);background:rgba(10,10,10,.3)}
.search-panel.open{opacity:1;pointer-events:auto}
.search-inner{width:min(720px,100%);border-radius:var(--r-lg);padding:14px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow-l);transform:translateY(-18px) scale(.98);transition:transform .4s var(--ease-out);max-height:74vh;display:flex;flex-direction:column}
.search-panel.open .search-inner{transform:none}
.search-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-bottom:1px solid var(--line)}
.search-row>svg{width:19px;height:19px;color:var(--muted);flex:none}
.search-row input{flex:1;border:none;outline:none;background:transparent;font-size:16px;padding:11px 0}
.search-results{overflow-y:auto;margin-top:10px;overscroll-behavior:contain}
.sr-item{display:flex;gap:12px;padding:9px;border-radius:12px;transition:background .2s;cursor:pointer}
.sr-item:hover{background:rgba(14,14,14,.05)}
.sr-item img{width:52px;height:66px;object-fit:cover;border-radius:8px;background:var(--cream)}
.sr-meta{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.sr-meta b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-meta span{font-size:12px;color:var(--muted)}
.sr-empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:13px}

/* Notifications */
.notif-backdrop{position:fixed;inset:0;z-index:965;background:rgba(12,12,12,.5);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.notif-backdrop.open{opacity:1;pointer-events:auto}
.notif-panel{position:fixed;top:calc(var(--header-h) + 8px);right:12px;width:min(380px,calc(100vw - 24px));z-index:968;background:rgba(255,255,255,.97);border:1px solid rgba(14,14,14,.08);border-radius:var(--r-lg);box-shadow:0 24px 60px rgba(20,18,15,.2),0 4px 12px rgba(20,18,15,.06);opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;transition:opacity .28s var(--ease),transform .28s var(--ease-out);max-height:min(72vh,520px);display:flex;flex-direction:column;overflow:hidden}
.notif-panel.open{opacity:1;transform:none;pointer-events:auto}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
.notif-head b{font-size:14px;font-weight:700;letter-spacing:-.005em}
.notif-list{overflow-y:auto;flex:1;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.notif-item{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;transition:background .2s}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:rgba(243,237,228,.4)}
.notif-icon{width:34px;height:34px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-soft)}
.notif-icon svg{width:16px;height:16px}
.notif-body{flex:1;min-width:0}
.notif-title{font-size:13px;font-weight:600;margin-bottom:3px}
.notif-text{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:4px}
.notif-time{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.notif-empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13px}
.notif-empty svg{width:38px;height:38px;opacity:.5;margin:0 auto 14px;display:block}

/* Layout */
#app{min-height:100vh;display:flex;flex-direction:column}
.page{flex:1 0 auto;display:flex;flex-direction:column;padding-bottom:0} 
.page.has-pdp-bar{padding-bottom:200px}
.page-pad{padding-top:calc(var(--header-h) + 24px)}
.section{padding:clamp(32px,4.4vw,56px) 0}
.section.flush{padding-top:0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;display:block}
.sec-title{font-size:clamp(22px,3vw,34px);font-weight:300;letter-spacing:-.02em;line-height:1.15}
.sec-title em,.hero-slide-title em,.promo-title em,.story-body h2 em,.newsletter h2 em,.auth-visual-text h3 em,.auth-card h1 em{font-family:'Playfair Display',serif;font-style:italic;font-weight:400}
.link-arrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding-bottom:3px;border-bottom:1px solid var(--line-strong);transition:gap .3s,border-color .3s}
.link-arrow:hover{gap:14px;border-color:var(--ink)}
.link-arrow svg{width:14px;height:14px}

/* Hero */
.hero-carousel{position:relative;height:75vh;min-height:400px;overflow:hidden;background:#161412;margin-top:0}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .9s var(--ease);pointer-events:none}
.hero-slide.active{opacity:1;pointer-events:auto}
.hero-slide-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;transform:scale(1.06)}
.hero-slide-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.4),rgba(10,10,10,.25) 40%,rgba(10,10,10,.68))}
.hero-slide-body{position:relative;z-index:2;height:100%;max-width:640px;margin:0 auto;padding:calc(var(--header-h) + 20px) clamp(16px,4vw,44px) 0;display:flex;flex-direction:column;justify-content:center;color:#fff}
.hero-slide-body .eyebrow{color:rgba(255,255,255,.9);font-size:14px !important;margin-bottom:12px !important;letter-spacing:.2em;font-weight:600 !important;}
.hero-slide-title{font-size:clamp(40px,8vw,70px) !important;margin-bottom:20px !important;font-weight:200;letter-spacing:-.02em;line-height:1.1 !important;text-transform:uppercase;}
.hero-slide-title em{text-transform:none;letter-spacing:-.01em}
.hero-slide-desc{font-size:clamp(16px,2vw,18px) !important;margin-bottom:28px !important;color:rgba(255,255,255,.85);font-weight:300;line-height:1.6 !important;max-width:42ch}
.hero-slide-cta{display:flex;gap:8px;flex-wrap:wrap}
.hero-slide-cta .btn{padding:16px 32px !important;font-size:13px !important;}
@media (min-width:768px){
  .hero-slide-desc{margin-bottom:20px}
}
.hero-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:8px}
.hero-dot{width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.4);transition:all .35s var(--ease);cursor:pointer;border:none;padding:0}
.hero-dot.active{background:#fff;width:32px}
.hero-dot:hover{background:rgba(255,255,255,.75)}

/* Hero search box */
.hero-search-box{position:absolute;top:145px;right:16px;z-index:99;display:flex;align-items:center;justify-content:space-between;gap:10px;width:220px;padding:10px 16px;background:rgba(255,255,255,.85);border-radius:99px;border:1px solid rgba(255,255,255,.6);box-shadow:0 4px 15px rgba(0,0,0,.1);cursor:pointer;transition:all .3s ease}
.hero-search-box:hover{background:#fff;transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.15)}
.hero-search-box span{font-size:12px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-search-box svg{width:16px;height:16px;color:var(--ink);flex:none}
@media (max-width:480px){.hero-search-box{width:160px;padding:8px 12px;top:145px;right:12px}.hero-search-box span{font-size:11px}}

/* Categories */
.cat-grid-simple{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;padding:6px 0;justify-items:center}
@media (min-width:480px){.cat-grid-simple{gap:22px 12px}}
@media (min-width:768px){.cat-grid-simple{grid-template-columns:repeat(7,1fr);gap:22px 18px;padding:8px 0}}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);touch-action:pan-x pan-y;min-width:0;max-width:100%}
.cat-item-img{width:60px;height:60px;display:flex;align-items:center;justify-content:center;flex:none;border:1.5px dashed #a0a0a0;border-radius:50%;background-color:rgba(255,255,255,.4);padding:8px;box-sizing:border-box;transition:all .3s ease}
.cat-item-img svg{width:32px;height:32px;stroke:#0e0e0e;stroke-width:.8;fill:none;display:block;transition:stroke-width .3s ease}
.cat-item-label{font-size:11px;font-weight:500;text-align:center;letter-spacing:.02em;color:var(--ink-soft);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;transition:color .2s}
@media (min-width:640px){.cat-item-label{font-size:11.5px}}
@media (min-width:1024px){.cat-item-label{font-size:12px}}
@media (hover:hover) and (pointer:fine){
  .cat-item:hover .cat-item-img{border-color:var(--ink);background-color:#fff;transform:translateY(-2px)}
  .cat-item:hover .cat-item-img svg{stroke-width:1.1}
  .cat-item:hover .cat-item-label{color:var(--ink)}
}
.cat-item:active .cat-item-img{border-color:var(--ink);background-color:#fff;transform:translateY(-2px)}

/* Product card */
.grid-products{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(10px,1.4vw,18px)}
@media (min-width:640px){.grid-products{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1024px){.grid-products{grid-template-columns:repeat(4,1fr);gap:20px}}
.pcard{position:relative;border-radius:0;background:#fff;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .45s var(--ease-out),box-shadow .45s var(--ease-out),border-color .3s;touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;will-change:auto}
.pcard-media{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--cream);border-radius:0}
.pcard-media img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease-out);pointer-events:none;border-radius:0}
.pcard-badges{position:absolute;top:10px;left:10px;z-index:3;display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none}
.badge-tag{display:inline-flex;align-items:center;font-size:9px;font-weight:700;letter-spacing:.1em;padding:4px 9px;border-radius:99px;text-transform:uppercase;background:rgba(255,255,255,.92);color:var(--ink);border:1px solid rgba(255,255,255,.7);line-height:1}
.badge-tag.new{background:rgba(14,14,14,.9);color:#fff;border-color:transparent}
.badge-tag.bestseller{background:rgba(199,161,92,.95);color:#fff;border-color:transparent}
.badge-tag.sale{background:rgba(178,58,58,.95);color:#fff;border-color:transparent}
.badge-discount{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;letter-spacing:.02em;padding:4px 8px;border-radius:7px;background:linear-gradient(135deg,#cf3a3c,#a83033);color:#fff;line-height:1;border:1px solid rgba(255,255,255,.25);box-shadow:0 2px 6px rgba(168,48,51,.28)}
.pcard-actions{position:absolute;top:8px;right:8px;z-index:3;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateX(10px);transition:opacity .3s,transform .3s var(--ease-out)}
.mini-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow-s);transition:all .25s;color:var(--ink)}
.mini-btn svg{width:15px;height:15px}
.mini-btn:hover{background:var(--ink);color:#fff;transform:scale(1.08)}
.mini-btn.active{background:var(--ink);color:#fff}
.mini-btn.active svg{fill:currentColor}
@media (hover:none){.pcard-actions{opacity:1;transform:none}}
.pcard-body{padding:10px 12px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.pcard-name{font-size:13px;font-weight:600;letter-spacing:-.005em;line-height:1.35;min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard-colors{display:flex;gap:4px}
.pcard-colors i{width:11px;height:11px;border-radius:50%;border:1px solid rgba(14,14,14,.18);display:block}
.pcard-price{display:flex;align-items:baseline;gap:6px;font-size:13.5px;margin-top:auto;padding-top:2px}
.pcard-price b{font-weight:700;color:var(--price-red)}
.pcard-price s{font-size:11px;color:var(--muted);font-weight:400}
@media (min-width:768px){.pcard-body{padding:12px 14px 16px}.pcard-name{font-size:13.5px}}
@media (hover:hover) and (pointer:fine){
  .pcard:hover{box-shadow:var(--shadow-card-hover);border-color:rgba(14,14,14,.13)}
  .pcard:hover .pcard-media img{transform:scale(1.06)}
  .pcard:hover .pcard-actions{opacity:1;transform:none}
}

/* Slider */
.slider{display:flex;gap:clamp(10px,1.4vw,16px);overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding:4px 2px 16px;scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-x pan-y}
.slider::-webkit-scrollbar{display:none}
.slider>*{scroll-snap-align:start;flex:0 0 calc(100% / 2.3);max-width:240px}
@media (min-width:768px){.slider>*{flex:0 0 clamp(220px,26vw,280px)}}
.slider-nav{display:flex;gap:8px}
.slider-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-strong);background:#fff;transition:all .25s;box-shadow:var(--shadow-card)}
.slider-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink);transform:scale(1.05);box-shadow:var(--shadow-card-hover)}
.slider-btn svg{width:16px;height:16px}
.slider-dots-container{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:-4px;margin-bottom:24px}
.slider-dot{width:6px;height:6px;border-radius:50%;background:rgba(14,14,14,.15);cursor:pointer;transition:all .3s ease}
.slider-dot.active{width:24px;border-radius:4px;background:var(--ink)}

/* Promo */
.promo{position:relative;border-radius:var(--r-xl);overflow:hidden;min-height:clamp(240px,32vw,360px);display:flex;align-items:center;box-shadow:var(--shadow-m)}
.promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.promo::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(10,10,10,.72),rgba(10,10,10,.34) 55%,rgba(10,10,10,.1))}
.promo-body{position:relative;z-index:2;padding:clamp(24px,4vw,52px);color:#fff;max-width:600px}
.promo-title{font-size:clamp(24px,3.8vw,48px);font-weight:200;letter-spacing:-.025em;line-height:1.02;text-transform:uppercase;margin-bottom:12px}
.promo-title em{text-transform:none}
.promo p{color:rgba(255,255,255,.82);margin-bottom:22px;font-size:13.5px;max-width:44ch;font-weight:300}

/* Reviews */
.review-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:768px){.review-grid{grid-template-columns:repeat(3,1fr);gap:18px}}
.review-card{padding:22px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-card);transition:transform .35s var(--ease-out),box-shadow .35s;display:flex;flex-direction:column;gap:12px}
@media (hover:hover){.review-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-card-hover)}}
.stars{display:flex;gap:2px;color:#c7a15c}
.stars svg{width:13px;height:13px}
.review-text{font-size:13.5px;color:var(--ink-soft);line-height:1.7;flex:1}
.review-author{display:flex;align-items:center;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--cream);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;border:1px solid var(--line)}
.review-author b{font-size:12.5px;display:block;font-weight:600}
.review-author span{font-size:11px;color:var(--muted)}

/* Story */
.story{display:grid;grid-template-columns:1fr;gap:24px;align-items:center}
@media (min-width:768px){.story{grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,64px)}}
.story-img{border-radius:var(--r-xl);overflow:hidden;aspect-ratio:16/10;box-shadow:var(--shadow-m);position:relative}
@media (min-width:768px){.story-img{aspect-ratio:4/5}}
.story-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease-out)}
@media (hover:hover){.story-img:hover img{transform:scale(1.04)}}
.story-body h2{font-size:clamp(22px,3vw,36px);font-weight:300;letter-spacing:-.02em;line-height:1.15;margin-bottom:14px}
.story-body p{color:var(--muted);font-size:13.5px;line-height:1.8;margin-bottom:12px}
.story-stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.story-stats b{display:block;font-size:20px;font-weight:300;letter-spacing:-.02em}
.story-stats span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Newsletter */
.newsletter{border-radius:var(--r-xl);padding:clamp(28px,4vw,52px);background:linear-gradient(135deg,var(--cream),#e9dfd1);border:1px solid rgba(255,255,255,.7);text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow-card)}
.newsletter h2{font-size:clamp(22px,2.8vw,32px);font-weight:300;letter-spacing:-.02em;margin-bottom:10px}
.newsletter p{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.news-form{display:flex;gap:8px;max-width:480px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.news-form input{flex:1;min-width:180px;padding:13px 18px;border-radius:999px;border:1px solid rgba(14,14,14,.14);background:rgba(255,255,255,.85);outline:none;font-size:13.5px;transition:border-color .25s,background .25s}
.news-form input:focus{border-color:var(--ink);background:#fff}

/* Footer */
.footer{background:#0e0e0e;color:#e8e5e0;margin-top:auto;padding:clamp(34px,5vw,64px) 0 calc(var(--bottom-nav-h) + var(--sab) + 20px)}
.footer-grid{display:grid;grid-template-columns:1fr;gap:26px;padding-bottom:36px}
@media (min-width:640px){.footer-grid{grid-template-columns:1fr 1fr}}
@media (min-width:1024px){.footer-grid{grid-template-columns:1.6fr 1fr 1fr 1.4fr;gap:40px}}
.footer h4{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:14px;font-weight:600}
.footer-link{display:block;font-size:13px;color:rgba(255,255,255,.72);padding:4px 0;transition:color .25s,transform .25s}
.footer-link:hover{color:#fff;transform:translateX(3px)}
.footer-brand{font-weight:700;letter-spacing:.3em;font-size:15px;margin-bottom:12px;text-transform:uppercase}
.footer-desc{font-size:13px;color:rgba(255,255,255,.55);line-height:1.75;max-width:34ch;margin-bottom:16px}
.socials{display:flex;gap:8px}
.social{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.75);transition:all .25s}
.social:hover{background:#fff;color:#0e0e0e;border-color:#fff;transform:translateY(-2px)}
.social svg{width:15px;height:15px}
.footer-news input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;outline:none;font-size:13px;margin-bottom:10px;transition:border-color .25s,background .25s}
.footer-news input::placeholder{color:rgba(255,255,255,.4)}
.footer-news input:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.1)}
.footer-news .btn{width:100%;background:#fff;color:#0e0e0e;border-color:#fff}
.footer-news .btn:hover{background:rgba(255,255,255,.85)}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding:18px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:11.5px;color:rgba(255,255,255,.45);letter-spacing:.04em}
.footer-bottom a:hover{color:#fff}

/* Page header */
.page-head{padding:clamp(16px,2.8vw,32px) 0 clamp(10px,1.6vw,18px);border-bottom:1px solid var(--line);margin-bottom:18px}
.page-head h1{font-size:clamp(20px,3.2vw,34px);font-weight:200;letter-spacing:-.025em;text-transform:uppercase;line-height:1.1}
.page-head p{color:var(--muted);font-size:12.5px;margin-top:6px;max-width:60ch;line-height:1.5}
.crumbs{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:.04em;flex-wrap:wrap}
.crumbs a:hover{color:var(--ink)}

/* Shop toolbar / filters */
.shop-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.toolbar-right{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin-left:auto}
.filter-wrapper{position:relative}
.filter-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .25s var(--ease)}
.filter-btn:hover{border-color:var(--ink);background:rgba(14,14,14,.04)}
.filter-btn svg{width:15px;height:15px}
.filter-btn.has-filters{background:var(--ink);color:#fff;border-color:var(--ink)}
.filter-btn.has-filters:hover{background:#000}
.filter-count{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--ink);color:#fff;font-size:9.5px;font-weight:700;line-height:1}
.filter-btn.has-filters .filter-count{background:#fff;color:var(--ink)}
.filter-backdrop{position:fixed;inset:0;z-index:995;background:rgba(12,12,12,.5);opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.filter-backdrop.open{opacity:1;pointer-events:auto}
.filter-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:min(360px,calc(100vw - 32px));z-index:1000;background:rgba(255,255,255,.97);border:1px solid rgba(14,14,14,.1);border-radius:var(--r-lg);box-shadow:0 20px 50px rgba(20,18,15,.18),0 2px 6px rgba(20,18,15,.06);opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .28s var(--ease),transform .28s var(--ease-out);overflow:hidden;max-height:calc(100vh - var(--header-h) - 60px);display:flex;flex-direction:column}
.filter-dropdown.open{opacity:1;transform:none;pointer-events:auto}
.filter-dropdown-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;flex:none}
.filter-dropdown-body{padding:16px 18px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.filter-dropdown-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex:none}
.filter-dropdown-foot .btn{flex:1;padding:10px 14px;font-size:11.5px}
@media (max-width:640px){
  .filter-dropdown{position:fixed;top:auto;bottom:calc(var(--bottom-nav-h) + var(--sab));left:0;right:0;width:100%;max-width:none;max-height:70vh;border-radius:20px 20px 0 0;transform:translateY(100%)}
  .filter-dropdown.open{transform:none}
}
.filter-group{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.filter-group:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.filter-title{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--line-strong);background:rgba(255,255,255,.7);transition:all .25s;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip:hover{border-color:var(--ink);transform:translateY(-1px)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.color-chip{width:30px;height:30px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.chip.color-chip i{width:16px;height:16px;border-radius:50%;display:block;border:1px solid rgba(14,14,14,.16)}
.chip.color-chip.active{box-shadow:0 0 0 2px #fff,0 0 0 3px var(--ink)}
.range-row{display:flex;align-items:center;gap:6px}
.range-row input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line-strong);background:#fff;font-size:12.5px;outline:none;transition:border-color .25s;min-width:0}
.range-row input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(14,14,14,.06)}

/* Icon search button in toolbar */
.icon-btn-search{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:#fff;cursor:pointer;transition:all .2s ease;color:var(--ink)}
.icon-btn-search:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.icon-btn-search svg{width:16px;height:16px}

/* Back button */
.btn-back{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--ink);transition:all .2s ease;box-shadow:var(--shadow-s);cursor:pointer;flex:none}
.btn-back:hover,.btn-back:active{background:var(--ink);color:#fff;transform:translateX(-2px)}
.btn-back svg{width:16px;height:16px}

/* Custom select */
.cselect{position:relative;display:inline-block;width:100%}
.cselect-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--line-strong);background:#fff;font-size:13px;font-weight:500;cursor:pointer;transition:border-color .25s,box-shadow .25s,background .25s;text-align:left}
.cselect-trigger:hover{border-color:var(--ink)}
.cselect-trigger.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(200,56,58,.08)}
.cselect-chev{width:14px;height:14px;flex:none;color:var(--muted);transition:transform .3s var(--ease)}
.cselect.open .cselect-chev{transform:rotate(180deg)}
.cselect-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cselect-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:500;background:rgba(255,255,255,.97);border:1px solid rgba(14,14,14,.1);border-radius:14px;box-shadow:0 20px 50px rgba(20,18,15,.18),0 2px 6px rgba(20,18,15,.06);padding:6px;max-height:280px;overflow-y:auto;opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease-out);overscroll-behavior:contain}
.cselect.open .cselect-panel{opacity:1;transform:none;pointer-events:auto}
.cselect-option{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:background .15s,color .15s;text-align:left}
.cselect-option:hover{background:rgba(14,14,14,.05);color:var(--ink)}
.cselect-option.active,.cselect-option.active:hover{background:var(--ink);color:#fff}
.cselect-check{width:13px;height:13px;flex:none}
.cselect-sort{width:auto}
.cselect-sort .cselect-trigger{padding:9px 14px;font-size:12px;border-radius:999px;height:38px}
.cselect-sort .cselect-panel{right:0;left:auto;min-width:180px;width:auto}
.cselect-compact .cselect-trigger{padding:5px 22px 5px 10px;font-size:11px;border-radius:99px}
.cselect-compact .cselect-panel{min-width:150px;right:auto;left:0;padding:4px}
.cselect-compact .cselect-option{padding:7px 10px;font-size:11.5px;border-radius:7px}
.cselect-compact .cselect-chev{width:12px;height:12px}

.empty-state{padding:50px 20px;text-align:center;border-radius:var(--r-lg);background:rgba(255,255,255,.6);border:1px dashed var(--line-strong)}
.empty-state svg{width:40px;height:40px;color:var(--muted);margin:0 auto 14px;opacity:.55}
.empty-state h3{font-size:16px;margin-bottom:6px;font-weight:600}
.empty-state p{color:var(--muted);font-size:13px;margin-bottom:18px}

/* Product detail */
.pdp{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media (min-width:900px){.pdp{grid-template-columns:1.05fr 1fr;gap:clamp(24px,3.4vw,48px)}}
.gallery-main{border-radius:0;overflow:hidden;aspect-ratio:1/1;background:var(--cream);box-shadow:var(--shadow-m);margin-bottom:12px;cursor:crosshair;}
.gallery-main img{width:100%;height:100%;object-fit:cover;transition:opacity .3s,transform .15s ease-out;}
@media (hover:hover){.gallery-main:hover img{transform:scale(2.5)}}
.gallery-thumbs{display:flex;gap:8px;margin-top:0;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.gallery-thumbs::-webkit-scrollbar{display:none}
.gthumb{width:64px;height:64px;aspect-ratio:1/1;border-radius:8px;overflow:hidden;border:1.5px solid var(--line);cursor:pointer;transition:all .25s;opacity:.6;background:var(--cream);flex:none}
.gthumb img{width:100%;height:100%;object-fit:cover}
.gthumb:hover{opacity:1}
.gthumb.active{border:2px solid var(--ink);opacity:1}
@media (min-width:900px){.pdp-info{position:sticky;top:calc(var(--header-h) + 16px)}}
.pdp-header{margin-bottom:8px}
.pdp-badges{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;min-height:18px}
.pdp-cat{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px;display:block}
.pdp-title{font-size:clamp(18px,2.4vw,26px);font-weight:500;letter-spacing:-.01em;line-height:1.2;margin-bottom:8px}
.pdp-price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pdp-price-current{font-size:clamp(20px,2.4vw,26px);font-weight:700;letter-spacing:-.02em;color:var(--price-red)}
.pdp-price-old{font-size:13.5px;color:var(--muted);text-decoration:line-through;font-weight:400}
.pdp-price-discount{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,#cf3a3c,#a83033);padding:3px 8px;border-radius:6px;letter-spacing:.02em;line-height:1}
.pdp-meta-row{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap;line-height:1.4}
.pdp-meta-row .stars{display:inline-flex;gap:1px}
.pdp-meta-row .stars svg{width:12px;height:12px}
.pdp-meta-row .dot{width:6px;height:6px;border-radius:50%;background:#3f9d5a;display:inline-block;margin-right:4px;vertical-align:middle}
.pdp-meta-row .dot.low{background:#c9863b}
.pdp-meta-row .dot.out{background:#b23a3a}
.pdp-meta-row .sep{width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.5}
.opt-block{margin-bottom:10px}
.opt-label{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:6px;gap:8px}
.opt-label span{color:var(--muted);letter-spacing:.02em;text-transform:none;font-weight:500;font-size:11px}
.size-btn{min-width:38px;padding:8px 10px;border-radius:8px;border:1px solid var(--line-strong);font-size:12px;font-weight:500;transition:all .2s;background:#fff;line-height:1}
.size-btn:hover{border-color:var(--ink)}
.size-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.color-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;transition:all .2s;background:#fff}
.color-btn i{width:20px;height:20px;border-radius:50%;display:block;border:1px solid rgba(14,14,14,.15)}
.color-btn:hover{transform:scale(1.06)}
.color-btn.active{box-shadow:0 0 0 2px #fff,0 0 0 2.5px var(--ink)}
.pdp-qty-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pdp-qty-row .opt-label{margin-bottom:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:#fff}
.qty button{width:32px;height:34px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.qty button:hover{background:rgba(14,14,14,.06)}
.qty button svg{width:13px;height:13px}
.qty span{min-width:32px;text-align:center;font-size:12.5px;font-weight:600}
.pdp-stock-mini{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pdp-actions{display:flex;gap:6px;margin-bottom:12px}
.pdp-actions .btn{flex:1;padding:11px 16px;font-size:11.5px}
.icon-action{width:42px;height:42px;border-radius:999px;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;flex:none;transition:all .2s;background:#fff}
.icon-action svg{width:17px;height:17px}
.icon-action:hover{border-color:var(--ink)}
.icon-action.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.icon-action.active svg{fill:currentColor}
.pdp-desc{font-size:13px;color:var(--ink-soft);line-height:1.7;margin:0 0 12px;padding-top:10px;border-top:1px solid var(--line)}
.pdp-meta{border-top:1px solid var(--line);padding-top:2px}
.acc-item{border-bottom:1px solid var(--line)}
.acc-head{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:11.5px;font-weight:600;letter-spacing:.05em;cursor:pointer;text-transform:uppercase}
.acc-head svg{width:13px;height:13px;transition:transform .3s;color:var(--muted)}
.acc-item.open .acc-head svg{transform:rotate(45deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .4s var(--ease-out);font-size:12.5px;color:var(--muted);line-height:1.7}
.acc-item.open .acc-body{max-height:280px;padding-bottom:10px}

/* PDP bar */
.pdp-bar{position:fixed;left:0;right:0;bottom:calc(var(--bottom-nav-h) + var(--sab));z-index:890;padding:8px 10px;background:rgba(255,255,255,.96);border-top:1px solid rgba(14,14,14,.08);box-shadow:0 -8px 28px rgba(20,18,15,.12);animation:pdpBarIn .4s var(--ease-out)}
@keyframes pdpBarIn{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.pdp-bar-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr 2fr;gap:6px}
.pdp-bar-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:transform .2s var(--ease),background .2s,box-shadow .2s;white-space:nowrap;border:1px solid transparent}
.pdp-bar-btn svg{width:16px;height:16px;flex:none}
.pdp-bar-btn:active{transform:scale(.97)}
.pdp-bar-contact{background:#fff;color:var(--ink);border-color:var(--line-strong);flex-direction:column;gap:1px;font-size:9px;letter-spacing:.06em;padding:6px 4px}
.pdp-bar-cart{background:var(--ink);color:#fff;border-color:var(--ink)}
.pdp-bar-cart:hover{background:#000;transform:translateY(-1px);box-shadow:0 6px 18px rgba(14,14,14,.28)}
.pdp-bar-buy{background:#c8383a;color:#fff;border-color:#c8383a}
.pdp-bar-buy:hover{background:#a83033;transform:translateY(-1px);box-shadow:0 6px 18px rgba(200,56,58,.28)}
.pdp-bar-btn:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:480px){.pdp-bar-btn{padding:10px 6px;font-size:10.5px}}

/* Bottom nav */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:895;height:calc(var(--bottom-nav-h) + var(--sab));padding:0 env(safe-area-inset-right,0px) var(--sab) env(safe-area-inset-left,0px);background:rgba(255,255,255,.95);border-top:1px solid rgba(255,255,255,.9);box-shadow:0 -10px 40px rgba(20,18,15,.12),inset 0 1px 2px #fff;display:grid;grid-template-columns:repeat(3,1fr);align-items:stretch;transform:translateZ(0);will-change:transform}
.bn-pill{position:absolute;top:3px;bottom:3px;left:0;width:0;background:var(--brown-soft);box-shadow:inset 0 1px 2px rgba(255,255,255,.8),0 2px 6px rgba(0,0,0,.06);border-radius:999px;z-index:0;pointer-events:none;opacity:0;transition:transform .38s var(--ease-out),width .38s var(--ease-out),opacity .25s var(--ease);will-change:transform,width}
.bn-pill.show{opacity:1}
.bn-item{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.02em;transition:color .2s var(--ease);position:relative;z-index:1}
.bn-item svg{width:16px;height:16px;transition:transform .2s var(--ease);flex:none}
.bn-item:active svg{transform:scale(.9)}
.bn-item.active{color:var(--ink)}
.bn-item.active svg{stroke-width:2.2}
.bn-badge.zero{display:none}

/* Floating buttons */
.contact-fab{position:fixed;right:14px;bottom:70px;z-index:880;width:42px;height:42px;border-radius:50%;background:rgba(14,14,14,.6);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(14,14,14,.32);transition:transform .25s var(--ease),background .25s;animation:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.contact-fab svg{width:18px;height:18px}
.contact-fab:hover{transform:scale(1.08);background:rgba(0,0,0,.8)}
.contact-fab:active{transform:scale(.94)}
body.has-pdp-bar .contact-fab{bottom:130px}
.back-top{position:fixed;right:14px;bottom:135px;z-index:880;width:36px;height:36px;border-radius:50%;background:rgba(14,14,14,.6);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(14,14,14,.28);cursor:pointer;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .3s var(--ease),transform .3s var(--ease),visibility .3s var(--ease),background .2s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.back-top svg{width:16px;height:16px}
.back-top.show{opacity:1;visibility:visible;transform:none}
.back-top:hover{background:rgba(0,0,0,.8);transform:translateY(-2px)}
.back-top:active{transform:scale(.94)}
body.has-pdp-bar .back-top{bottom:195px}

/* Cart */
.cart-layout{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media (min-width:900px){.cart-layout{grid-template-columns:1.6fr 1fr;gap:30px}}
.cart-list{display:flex;flex-direction:column;gap:10px}
.cart-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-card);transition:box-shadow .3s}
@media (hover:hover){.cart-item:hover{box-shadow:var(--shadow-card-hover)}}
.cart-item img{width:55px;height:70px;object-fit:cover;border-radius:6px;background:var(--cream);flex:none}
.cart-item .cart-checkbox{display:flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;cursor:pointer}
.cart-item .cart-checkbox input{width:18px;height:18px;border-radius:4px;accent-color:var(--ink);cursor:pointer}
.cart-item-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.cart-item-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.cart-item-meta{font-size:10.5px;color:var(--muted);margin-bottom:0;display:flex;flex-direction:column;gap:2px}
.cart-item-meta b{color:var(--ink-soft);font-weight:500}
.cart-item-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.cart-item-price{font-size:13px;color:var(--price-red);font-weight:700}
.cart-item .qty{transform:scale(.75);transform-origin:right center}
.cart-remove{font-size:10px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;padding:2px;transition:color .25s}
.cart-remove:hover{color:var(--danger)}
.cart-remove svg{width:13px;height:13px}
.summary{position:static;border-radius:var(--r-lg);padding:20px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.72);box-shadow:var(--shadow-card)}
@media (min-width:900px){.summary.sticky{position:sticky;top:calc(var(--header-h) + 18px)}}
.summary h3{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px;font-weight:700}
.sum-row{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;color:var(--ink-soft);gap:12px}
.sum-row.discount{color:#3f9d5a}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;font-weight:700;border-top:1px solid var(--line);margin-top:10px;padding-top:14px}
.discount-form{display:flex;gap:6px;margin:14px 0}
.discount-form input{flex:1;padding:10px 12px;border-radius:9px;border:1px solid var(--line-strong);background:#fff;font-size:12.5px;outline:none;transition:border-color .25s;min-width:0}
.discount-form input:focus{border-color:var(--ink)}

/* Forms */
.field{margin-bottom:10px}
.field label{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:7px;color:var(--ink-soft)}
.input,.textarea{width:100%;padding:8px 12px;border-radius:11px;border:1px solid var(--line-strong);background:rgba(255,255,255,.85);outline:none;font-size:13px;transition:border-color .25s,box-shadow .25s,background .25s}
.input:focus,.textarea:focus{border-color:var(--ink);background:#fff;box-shadow:0 0 0 4px rgba(14,14,14,.06)}
.input.err{border-color:var(--danger);box-shadow:0 0 0 4px rgba(200,56,58,.08)}
.err-msg{font-size:11.5px;color:var(--danger);margin-top:5px;display:none}
.err-msg.show{display:block}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:44px}
.pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);transition:color .2s,background .2s}
.pw-toggle:hover{color:var(--ink);background:rgba(14,14,14,.05)}
.pw-toggle svg{width:17px;height:17px}
.checkbox{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;cursor:pointer;user-select:none;color:var(--ink-soft);line-height:1.5}
.checkbox input{appearance:none;-webkit-appearance:none;width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-strong);flex:none;margin-top:1px;cursor:pointer;transition:all .2s;position:relative;background:#fff}
.checkbox input[type=radio]{border-radius:50%}
.checkbox input:checked{background:var(--ink);border-color:var(--ink)}
.checkbox input:checked::after{content:'';position:absolute;left:4.5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.btn-google{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:12px;border-radius:11px;border:1px solid var(--line-strong);background:#fff;font-size:13px;font-weight:500;transition:all .25s}
.btn-google:hover{background:rgba(14,14,14,.04);transform:translateY(-1px);box-shadow:var(--shadow-card)}
.btn-google svg{width:17px;height:17px}

/* Auth */
.auth-wrap{min-height:auto;display:grid;grid-template-columns:1fr;padding-top:calc(var(--header-h) + 20px);padding-bottom:60px}
.auth-visual{display:none}
.auth-panel{display:flex;align-items:flex-start;justify-content:center;padding:0 16px}
.auth-card{width:100%;max-width:360px;background:#fff;padding:24px;border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow-card);margin:0 auto;animation:cardIn .6s var(--ease-out)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.auth-card h1{font-size:22px;font-weight:300;letter-spacing:-.02em;margin-bottom:6px}
.auth-card>p{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.auth-card .demo-note{padding:10px 12px;font-size:11px;margin-bottom:14px}
.auth-card .field{margin-bottom:10px}
.auth-card .field label{font-size:10px;margin-bottom:4px}
.auth-card .input{padding:10px 12px;font-size:13px}
.auth-card .btn{padding:10px 14px;font-size:11.5px}
.auth-card .btn-google{padding:10px;font-size:12px}
.auth-card .divider{margin:14px 0}
.auth-card .pw-toggle{width:34px;height:34px}
.demo-note{font-size:11.5px;color:#8a6a2f;background:rgba(199,161,92,.13);border:1px solid rgba(199,161,92,.32);border-radius:10px;padding:10px 12px;margin-bottom:16px;line-height:1.6}
.demo-note b{color:#6d5220}

/* Account */
.dash{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:900px){.dash{grid-template-columns:230px 1fr;gap:30px}}
.dash-nav,.dash-body{border-radius:var(--r-lg);background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.72);box-shadow:var(--shadow-card)}
.dash-nav{padding:12px}
@media (min-width:900px){.dash-nav{position:sticky;top:calc(var(--header-h) + 16px)}}
.dash-user{display:flex;align-items:center;gap:10px;padding:10px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dash-user .avatar{width:40px;height:40px;font-size:13px;background:var(--ink);color:#fff;border-color:transparent}
.dash-user b{display:block;font-size:13px;font-weight:600}
.dash-user span{font-size:11.5px;color:var(--muted);word-break:break-all}
.dash-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:500;transition:all .25s;width:100%;text-align:left;color:var(--ink-soft)}
.dash-link svg{width:16px;height:16px;opacity:.6;flex:none}
.dash-link:hover{background:rgba(14,14,14,.055);color:var(--ink)}
.dash-link.active{background:var(--ink);color:#fff}
.dash-link.active svg{opacity:1}
.dash-link.danger{color:var(--danger)}
.dash-link.danger:hover{background:rgba(200,56,58,.09)}
.dash-body{padding:clamp(18px,2.4vw,30px);min-height:340px}
.dash-body.plain{background:transparent;border:none;box-shadow:none;padding:0;min-height:0}
.dash-body h2{font-size:18px;font-weight:600;margin-bottom:5px;letter-spacing:-.01em}
.dash-body>p.sub{color:var(--muted);font-size:13px;margin-bottom:20px}

/* Order tabs */
.order-tabs-wrapper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow:visible;margin-bottom:20px;padding-bottom:0}
.order-tab{width:100%;padding:8px 6px;border-radius:99px;font-size:11px;font-weight:600;background:#fff;border:1px solid var(--line);cursor:pointer;transition:all .2s ease;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;color:var(--ink-soft);line-height:1.2}
.order-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.order-tab-badge{background:var(--danger);color:#fff;padding:2px 6px;border-radius:99px;font-size:9px;font-weight:700;line-height:1}
.order-tab.active .order-tab-badge{background:rgba(255,255,255,.3)}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-card);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:540px}
th{text-align:left;padding:11px 14px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);background:rgba(243,237,228,.5);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(243,237,228,.4)}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:99px;text-transform:uppercase;white-space:nowrap}
.status-pill.processing{background:rgba(199,161,92,.16);color:#8a6a2f}
.status-pill.shipping{background:rgba(72,122,190,.14);color:#2f5c96}
.status-pill.delivered{background:rgba(63,157,90,.14);color:#2c7442}
.status-pill.cancelled{background:rgba(178,58,58,.12);color:#a33}
.status-pill.pending{background:rgba(14,14,14,.08);color:var(--ink-soft)}

/* Admin */
.admin-gate{max-width:420px;margin:0 auto;border-radius:var(--r-lg);padding:clamp(22px,4vw,34px);background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow-m)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
@media (min-width:768px){.stat-grid{grid-template-columns:repeat(4,1fr);gap:12px}}
.stat-card{padding:16px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-card);transition:transform .35s var(--ease-out),box-shadow .35s}
@media (hover:hover){.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-card-hover)}}
.stat-card .label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.stat-card .value{font-size:19px;font-weight:300;letter-spacing:-.02em}
.stat-card .delta{font-size:11px;margin-top:6px;color:#3f9d5a;font-weight:600}
.chart-card{border-radius:var(--r);background:#fff;border:1px solid var(--line);padding:18px;margin-bottom:18px;box-shadow:var(--shadow-card)}
.chart-card h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;font-weight:700}
.chart-bars{display:flex;align-items:flex-end;gap:clamp(4px,1.2vw,14px);height:160px;padding-top:10px}
.chart-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart-bar .bar{width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#2b2b2b,#0e0e0e);transition:height .9s var(--ease-out),opacity .25s;min-height:4px;opacity:.85}
.chart-bar:hover .bar{opacity:1}
.chart-bar .cl{font-size:9.5px;color:var(--muted);letter-spacing:.02em}
.admin-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}
.admin-tab{padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line-strong);background:#fff;transition:all .25s}
.admin-tab:hover{border-color:var(--ink)}
.admin-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.low-stock{color:var(--danger);font-weight:700}
.admin-form{display:grid;grid-template-columns:1fr;gap:10px;padding:16px;border-radius:var(--r);background:rgba(243,237,228,.6);border:1px solid var(--line);margin-bottom:18px}
@media (min-width:768px){.admin-form{grid-template-columns:repeat(2,1fr);gap:12px}}
.admin-form .field{margin:0}
.admin-form .full{grid-column:1/-1}
.tiny-btn{padding:5px 10px;border-radius:7px;font-size:11px;font-weight:600;border:1px solid var(--line-strong);background:#fff;transition:all .2s;margin-right:4px;margin-bottom:2px}
.tiny-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.tiny-btn.danger:hover{background:var(--danger);border-color:var(--danger)}

/* Toast */
#toasts{position:fixed;bottom:calc(var(--bottom-nav-h) + var(--sab) + 16px);right:16px;left:16px;z-index:1200;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end;max-width:100%}
@media (min-width:640px){#toasts{left:auto;bottom:calc(var(--bottom-nav-h) + 20px);right:20px}}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:rgba(20,20,20,.95);color:#fff;font-size:13px;font-weight:500;box-shadow:0 14px 38px rgba(0,0,0,.28);animation:toastIn .4s var(--ease-out);pointer-events:auto;max-width:360px;border:1px solid rgba(255,255,255,.1);width:100%;touch-action:pan-x pan-y;user-select:none;will-change:transform,opacity}
.toast.out{animation:toastOut .3s var(--ease) forwards}
.toast svg{width:16px;height:16px;flex:none;color:#7fd69b}
.toast.error svg{color:#ff8b8b}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(24px) scale(.96)}}

/* Modal */

<script>
let confirmCallback = null;
function showConfirm(message, onConfirm, title = 'Xác nhận', btnText = 'Đồng ý') {
  document.getElementById('confirmMessage').innerHTML = message;
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmBtn').textContent = btnText;
  confirmCallback = onConfirm;
  document.getElementById('confirmModal').classList.add('open');
}
document.getElementById('confirmBtn').addEventListener('click', () => {
  document.getElementById('confirmModal').classList.remove('open');
  if (confirmCallback) { confirmCallback(); confirmCallback = null; }
});
document.getElementById('confirmModal').addEventListener('click', (e) => {
  if (e.target.id === 'confirmModal') { e.target.classList.remove('open'); confirmCallback = null; }
});

const clone = o => JSON.parse(JSON.stringify(o));
const state = {
  products: (() => {
    const stored = LS.get('ss_products_v9', null);
    if(!stored) return clone(DEFAULT_PRODUCTS);
    return stored.map(p => {
      if(p.province === undefined){
        const def = DEFAULT_PRODUCTS.find(d => d.id === p.id);
        p.province = def ? (def.province || null) : null;
      }
      return p;
    });
  })(),
  cart:      LS.get('ss_cart_v7', []),
  wishlist:  LS.get('ss_wishlist_v7', []),
  user:      LS.get('ss_user_v7', null),
  orders:    LS.get('ss_orders_v7', []),
  codes:     LS.get('ss_codes_v7', null) || clone(DEFAULT_CODES),
  addresses: LS.get('ss_addresses_v7', []), accounts: LS.get('ss_accounts_v7', []),
  discount:  null
};
const STORE_KEYS = {cart:'ss_cart_v7',wishlist:'ss_wishlist_v7',user:'ss_user_v7',orders:'ss_orders_v7',codes:'ss_codes_v7',addresses:'ss_addresses_v7',accounts:'ss_accounts_v7',products:'ss_products_v9'};
function saveAll(){ for(const k in STORE_KEYS) LS.set(STORE_KEYS[k], state[k]); }
saveAll();

const findProduct = id => state.products.find(p => p.id === Number(id));
const removeDiacritics = (str) => {
  if (!str) return '';
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
};

const cartCount = () => state.cart.reduce((s,i) => s + i.qty, 0);
function cartSubtotal(){ return state.cart.reduce((sum, item) => { if(item.selected === false) return sum; const p = findProduct(item.id); return sum + (p ? p.price * item.qty : 0); }, 0); }
function discountAmount(sub){ const d = state.discount; if(!d) return 0; if(d.type === 'percent') return Math.round(sub * d.value / 100); if(d.type === 'fixed') return Math.min(d.value, sub); return 0; }
function shippingFee(sub){ if(sub === 0) return 0; if(state.discount && state.discount.type === 'ship') return 0; return sub >= FREE_SHIP_THRESHOLD ? 0 : SHIPPING_FEE; }
function cartTotal(extraShip = 0){ const sub = cartSubtotal(); return Math.max(0, sub - discountAmount(sub) + shippingFee(sub) + extraShip); }

function addToCart(id, size, color, qty = 1, silent = false){
  const p = findProduct(id);
  if(!p) return;
  if(p.stock <= 0){ toast('Sản phẩm đã hết hàng', 'error'); return; }
  const s = size || p.sizes[0];
  const c = color || p.colors[0].name;
  const key = `${id}|${s}|${c}`;
  const ex = state.cart.find(i => i.key === key);
  if(ex) ex.qty = Math.min(ex.qty + qty, p.stock);
  else state.cart.push({key, id, size:s, color:c, qty:Math.min(qty, p.stock)});
  saveAll(); updateBadges(true);
  if(!silent) toast(`Đã thêm "${p.name}" vào giỏ`);
  const r = getRoute().name;
  if(r === 'cart' || r === 'checkout') render();
}
function removeFromCart(key){ 
  state.cart = state.cart.filter(i => i.key !== key); 
  saveAll(); updateBadges(); 
  window.keepScroll = true;
  render(); 
}
function setQty(key, delta){ 
  const item = state.cart.find(i => i.key === key); 
  if(!item) return; 
  const p = findProduct(item.id); 
  item.qty = Math.max(1, Math.min(item.qty + delta, p ? p.stock : 99)); 
  saveAll(); updateBadges(); 
  window.keepScroll = true;
  render(); 
}
function toggleWishlist(id){
  const idx = state.wishlist.indexOf(id);
  const p = findProduct(id);
  if(idx > -1){ state.wishlist.splice(idx, 1); toast(`Đã xoá "${p.name}" khỏi yêu thích`); }
  else { state.wishlist.push(id); toast(`Đã lưu "${p.name}" vào yêu thích`); }
  saveAll(); updateBadges();
  $$('[data-action="wishlist"],[data-action="pdp-wish"]').forEach(btn => { if(Number(btn.dataset.id) === id) btn.classList.toggle('active', state.wishlist.includes(id)); });
  if(getRoute().name === 'wishlist') render();
}
function setBadge(el, n, animate){ if(!el) return; el.textContent = n; el.classList.toggle('zero', n === 0); if(animate){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } }
function updateBadges(animate){
  setBadge($('#cartCount'), cartCount(), animate);
  setBadge($('#wishCount'), state.wishlist.length, animate);
  setBadge($('#notifCount'), getUnreadCount());
  setBadge($('#bnOrderBadge'), state.orders.filter(o => ['pending','processing','shipping'].includes(o.status)).length);
}

function getNotifications(){
  const list = state.orders.map(o => ({ title:`Đơn hàng #${o.id}`, text:`Trạng thái: ${statusLabel(o.status)} · ${money(o.total)}`, time:new Date(o.date).getTime(), icon:'package' }));
  state.wishlist.forEach(id => {
    const p = findProduct(id);
    if(p && p.oldPrice && p.oldPrice > p.price){
      list.push({ title:'Ưu đãi cho sản phẩm yêu thích', text:`${p.name} đang giảm ${discountPct(p)}%`, time:new Date(p.createdAt).getTime() || 0, icon:'heart' });
    }
  });
  return list.sort((a,b) => b.time - a.time).slice(0, 12);
}
const getUnreadCount = () => { const seen = Number(LS.get('ss_notif_seen_v7', 0)); return getNotifications().filter(n => n.time > seen).length; };
function openNotifPanel(){
  const list = getNotifications();

function toast(msg, type){
  const wrap = $('#toasts');
  while(wrap.children.length >= 3) wrap.removeChild(wrap.firstChild);
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' error' : '');
  el.innerHTML = (type === 'error' ? ICON.x : ICON.checkCircle) + `<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  const timer = setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 1000);
  let startX = 0, startY = 0, curX = 0, dragging = false, pid = null;
  el.addEventListener('pointerdown', e => { if(e.pointerType === 'mouse' && e.button !== 0) return; pid = e.pointerId; startX = e.clientX; startY = e.clientY; curX = 0; dragging = false; try{ el.setPointerCapture(pid); }catch(err){} });
  el.addEventListener('pointermove', e => { if(e.pointerId !== pid) return; const dx = e.clientX - startX, dy = e.clientY - startY; if(!dragging){ if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ dragging = true; el.style.transition = 'none'; } else return; } curX = dx; el.style.transform = `translateX(${dx}px)`; el.style.opacity = String(Math.max(.2, 1 - Math.abs(dx) / 200)); });
  const endDrag = e => { if(e && e.pointerId !== pid) return; pid = null; el.style.transition = ''; if(dragging && Math.abs(curX) > 60){ clearTimeout(timer); el.style.transform = `translateX(${curX > 0 ? '150%' : '-150%'})`; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); } else { el.style.transform = ''; el.style.opacity = ''; } dragging = false; };
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
}

function getRoute(){
  const [path, query] = location.hash.replace(/^#\/?/, '').split('?');
  const seg = path.split('/').filter(Boolean);
  return { name: seg[0] || 'home', param: seg[1] || null, params: new URLSearchParams(query || '') };
}
function getQuickNavActive(){
  const r = getRoute();
  if(r.name === 'home') return 'home';
  if(r.name === 'shop' || r.name === 'product') return 'products';
  if(r.name === 'page' && ['about','news','store','contact'].includes(r.param)) return r.param;
  return null;
}
function syncNav(){
  requestAnimationFrame(() => {
    const route = getRoute();
    const qn = $('#quickNav'), qp = $('#quickNavPill');
    if(qn && qp){
      const key = getQuickNavActive();
      let active = null;
      $$('a[data-qnav]', qn).forEach(a => { const on = a.dataset.qnav === key; a.classList.toggle('active', on); if(on) active = a; });
      if(active){
        const nr = qn.getBoundingClientRect(), lr = active.getBoundingClientRect();
        const bl = parseFloat(getComputedStyle(qn).borderLeftWidth) || 0;
        qp.style.width = lr.width + 'px';
        qp.style.transform = `translateX(${lr.left - nr.left - bl + qn.scrollLeft}px)`;
        qp.classList.add('show');
      } else qp.classList.remove('show');
    }
    const bn = $('#bottomNav'), bp = $('#bnPill');
    if(bn && bp){
      let active = null;
      $$('.bn-item', bn).forEach(a => { const k = a.dataset.bn; const on = k === route.name || (k === 'account' && (route.name === 'login' || route.name === 'register')); a.classList.toggle('active', on); if(on) active = a; });
      if(active){
        const nr = bn.getBoundingClientRect(), ir = active.getBoundingClientRect();
        bp.style.width = (ir.width - 24) + 'px';
        bp.style.transform = `translateX(${ir.left - nr.left + 12}px)`;
        bp.classList.add('show');
      } else bp.classList.remove('show');
    }
  });
}
window.addEventListener('resize', syncNav, {passive:true});
window.addEventListener('load', syncNav);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncNav);

function stopCarousel(){ clearInterval(carouselTimer); carouselTimer = null; }

const defaultFilters = () => ({ q:'', cat:'Tất cả', group:null, min:0, max:PRICE_MAX, sizes:[], colors:[], sort:'new', province:'' });
let filters = defaultFilters();
const GROUPS = { ao:['T-Shirts','Shirts','Hoodies'], quan:['Pants'], khoac:['Jackets'], phukien:['Hats & Caps','Accessories'] };
function applyFilters(){
  const f = filters;
  let list = state.products.filter(p => {
    if(f.q){ const q = removeDiacritics(f.q); if(!removeDiacritics(p.name).includes(q) && !removeDiacritics(p.category).includes(q) && !removeDiacritics(catVI(p.category)).includes(q)) return false; }
    if(f.cat && f.cat !== 'Tất cả' && p.category !== f.cat) return false;
    if(f.group && GROUPS[f.group] && !GROUPS[f.group].includes(p.category)) return false;
    if(p.price < f.min || p.price > f.max) return false;
    if(f.sizes.length && !p.sizes.some(s => f.sizes.includes(s))) return false;
    if(f.colors.length && !p.colors.some(c => f.colors.includes(c.name))) return false;
    if(f.province && p.province !== f.province) return false;
    return true;
  });
  switch(f.sort){
    case 'price-asc':  list.sort((a,b) => a.price - b.price); break;
    case 'price-desc': list.sort((a,b) => b.price - a.price); break;
    case 'new':  list.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)); break;
    case 'best': list.sort((a,b) => b.sold - a.sold); break;
    case 'sale': list = list.filter(p => !!p.oldPrice); break;
  }
  return list;
}
const activeFilterCount = () => [ filters.min > 0, filters.max < PRICE_MAX, !!filters.province, filters.cat !== 'Tất cả', filters.sizes.length > 0, filters.colors.length > 0 ].filter(Boolean).length;
const shopResultsHTML = list => list.length ? `<div class="grid-products">${list.map(productCard).join('')}</div>` : emptyState(ICON.search, 'Không tìm thấy sản phẩm phù hợp', 'Thử điều chỉnh khoảng giá, chọn tỉnh thành khác hoặc xoá bộ lọc.', `<button class="btn btn-outline" data-action="reset-filters">Xóa bộ lọc</button>`);

function updateFilterBadge(){

  const counts = { all: userOrders.length, pending: userOrders.filter(o => o.status === 'pending').length, processing: userOrders.filter(o => o.status === 'processing').length, shipping: userOrders.filter(o => o.status === 'shipping').length, delivered: userOrders.filter(o => o.status === 'delivered').length, cancelled: userOrders.filter(o => o.status === 'cancelled').length };

          </div>

          <button class="btn btn-primary btn-block" type="submit" style="margin-top:16px">Đặt hàng · ${money(total)}</button>
          <p class="muted" style="font-size:11.5px;text-align:center;margin-top:10px">Bản demo: đơn hàng lưu cục bộ trên trình duyệt, không có thanh toán thật.</p>
        </form>
      </div>
    </div>`);
}

der:1px solid #ddd;border-radius:8px" name="city" placeholder="Quận/Huyện" required></div></div><button class="btn btn-primary btn-sm" type="submit" style="width:100%; padding:12px">Thêm địa chỉ</button></form>`;
  }

let adminAuthed = sessionStorage.getItem('ss_admin_v7') === '1';
let adminTab = 'overview';
let editingProductId = null;

  }
  const revenue = state.orders.reduce((s, o) => s + (o.status !== 'cancelled' ? o.total : 0), 0);
  const customers = new Set([...SAMPLE_CUSTOMERS.map(c => c.email), ...state.orders.map(o => o.email)]).size;
  const lowStock = state.products.filter(p => p.stock <= 10);
  const tabs = [['overview','Tổng quan'],['products','Sản phẩm'],['orders','Đơn hàng'],['customers','Khách hàng'],['codes','Mã giảm giá']];
  const pill = s => `<span class="status-pill ${s.toLowerCase()}">${statusLabel(s)}</span>`;
  let body = '';

    const months = ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];
    const data = [4200000,5800000,4900000,7300000,8600000,6900000,9400000,10200000,8700000,11400000,12800000,13500000];
    const max = Math.max(...data);
    body = `<h2>Tổng quan</h2><p class="sub">Dữ liệu minh hoạ — doanh thu tháng được tạo mẫu.</p><div class="stat-grid"><div class="stat-card"><div class="label">Doanh thu</div><div class="value">${money(revenue || 135000000)}</div><div class="delta">↑ 12.4% so với tháng trước</div></div><div class="stat-card"><div class="label">Đơn hàng</div><div class="value">${state.orders.length || 342}</div><div class="delta">↑ 8.1% so với tháng trước</div></div><div class="stat-card"><div class="label">Sản phẩm</div><div class="value">${state.products.length}</div><div class="delta">${lowStock.length} sản phẩm sắp hết</div></div><div class="stat-card"><div class="label">Khách hàng</div><div class="value">${customers}</div><div class="delta">↑ 4.7% so với tháng trước</div></div></div><div class="chart-card"><h3>Doanh thu theo tháng (minh hoạ)</h3><div class="chart-bars">${data.map((v, i) => `<div class="chart-bar" title="${money(v)}"><div class="bar" style="height:${Math.round(v / max * 100)}%"></div><span class="cl">${months[i]}</span></div>`).join('')}</div></div>${lowStock.length ? `<div class="chart-card" style="border-color:rgba(178,58,58,.3);background:rgba(178,58,58,.04)"><h3 style="color:var(--danger)">Cảnh báo tồn kho thấp</h3>${lowStock.map(p => `<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px"><span>${esc(p.name)}</span><b class="low-stock">còn ${p.stock}</b></div>`).join('')}</div>` : ''}<div class="chart-card"><h3>Đơn hàng gần đây</h3>${state.orders.length ? `<div class="table-wrap"><table><thead><tr><th>Mã</th><th>Khách</th><th>Ngày</th><th>Tổng</th><th>Trạng thái</th></tr></thead><tbody>${state.orders.slice(-5).reverse().map(o => `<tr><td>#${esc(o.id)}</td><td>${esc(o.name)}</td><td>${fmtDate(o.date)}</td><td>${money(o.total)}</td><td>${pill(o.status)}</td></tr>`).join('')}</tbody></table></div>` : `<p class="muted" style="font-size:13px">Chưa có đơn hàng. Đơn đặt qua checkout sẽ xuất hiện ở đây.</p>`}</div><div class="chart-card"><h3>Sản phẩm bán chạy</h3><div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Đã bán</th><th>Tồn kho</th><th>Doanh thu ước tính</th></tr></thead><tbody>${[...state.products].sort((a,b) => b.sold - a.sold).slice(0, 5).map(p => `<tr><td>${esc(p.name)}</td><td>${p.sold}</td><td>${p.stock <= 10 ? `<span class="low-stock">${p.stock}</span>` : p.stock}</td><td>${money(p.sold * p.price)}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  if(adminTab === 'products'){
    const ed = editingProductId ? state.products.find(p => p.id === editingProductId) : null;
    body = `<h2>Quản lý sản phẩm</h2><p class="sub">${state.products.length} sản phẩm trong cửa hàng.</p><form class="admin-form" id="productForm">${fieldHTML('Tên sản phẩm', 'name', `value="${ed ? esc(ed.name) : ''}" required`)}<div class="field"><label>Danh mục</label>${csHTML({ name:'category', value:ed ? ed.category : CATEGORIES[0], options:CATEGORIES.map(c => ({value:c, label:catVI(c)})) })}</div>${fieldHTML('Giá (₫)', 'price', `type="number" value="${ed ? ed.price : ''}" required`)}${fieldHTML('Giá gốc (₫, tuỳ chọn)', 'oldPrice', `type="number" value="${ed && ed.oldPrice ? ed.oldPrice : ''}"`)}${fieldHTML('Tồn kho', 'stock', `type="number" value="${ed ? ed.stock : 20}" required`)}<div class="field"><label>Nhãn</label>${csHTML({ name:'badge', value:ed ? (ed.badge || '') : '', options:[{value:'',label:'Không'},{value:'NEW',label:'MỚI'},{value:'BESTSELLER',label:'BÁN CHẠY'},{value:'SALE',label:'GIẢM GIÁ'}] })}</div><div class="field"><label>Tỉnh thành</label>${csHTML({ name:'province', value:ed ? (ed.province || '') : '', options:opts(PROVINCES_LIST, {value:'',label:'— Không có —'}) })}</div><div class="field full"><label>URL ảnh (mỗi dòng một ảnh)</label><textarea class="textarea" name="images" rows="2" placeholder="https://…">${ed ? esc(ed.images.join('\n')) : ''}</textarea></div><div class="full" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" type="submit">${ed ? 'Cập nhật sản phẩm' : 'Thêm sản phẩm'}</button>${ed ? `<button class="btn btn-outline btn-sm" type="button" data-action="admin-cancel-edit">Huỷ</button>` : ''}</div></form><div class="table-wrap"><table><thead><tr><th>Ảnh</th><th>Sản phẩm</th><th>Danh mục</th><th>Tỉnh</th><th>Giá</th><th>Tồn kho</th><th>Thao tác</th></tr></thead><tbody>${state.products.map(p => `<tr><td>${IMG(p.images[0], p.name, '', 'style="width:38px;height:48px;object-fit:cover;border-radius:6px" loading="lazy"')}</td><td><b>${esc(p.name)}</b>${p.badge ? `<div><span class="status-pill pending" st function render(){

let revealObserver = null;
function observeReveals(){
  const els = $$('.reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(el => el.classList.add('in')); return; }
  if(revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver(entries => { entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); revealObserver.unobserve(e.target); } }); }, {threshold:.08, rootMargin:'0px 0px -30px 0px'});
  els.forEach(el => revealObserver.observe(el));
}
function updateDrawerActive(){
  const route = getRoute();
  $$('.drawer-link').forEach(a => {
    let on = false;
    const d = a.dataset;
    if(d.route === route.name){
      if(route.name === 'shop'){
        const g = route.params.get('group'), s = route.params.get('sort'), c = route.params.get('cat');
        if(d.group) on = d.group === g;
        else if(d.sort) on = d.sort === s;
        else if(d.exact) on = !g && !s && !c;
      } else if(route.name === 'page') on = d.page === route.param;
      else on = true;
    }
    a.classList.toggle('active', on);
  });
}

}
