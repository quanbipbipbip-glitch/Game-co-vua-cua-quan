
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#171C28" />
<title>LENTRINH — Dịch vụ cày rank FF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#171C28;--bg-2:#1D2535;--card:#242E40;--card-hi:#2B364A;
  --border:#354258;--border-hi:#4A5872;
  --text:#F1F5F9;--muted:#A7B3C7;--muted-2:#7A8699;
  --blue:#60A5FA;--cyan:#4DD0E1;--purple:#A78BFA;--teal:#2DD4BF;
  --green:#4ADE80;--orange:#FB923C;--pink:#F472B6;--gold:#FBBF24;
  --accent:var(--blue);--accent-soft:rgba(96,165,250,.14);
  --danger:#F87171;--warn:var(--orange);--success:var(--green);
  --r:12px;--r-lg:16px;--r-xl:20px;
  --shadow:0 8px 24px -14px rgba(0,0,0,.55);
  --shadow-lg:0 16px 40px -20px rgba(0,0,0,.6);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:14px;line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(720px 500px at 6% -10%, rgba(96,165,250,.10), transparent 60%),
    radial-gradient(640px 500px at 100% 4%, rgba(167,139,250,.09), transparent 60%),
    radial-gradient(700px 480px at 50% 120%, rgba(45,212,191,.06), transparent 65%)}
body.no-scroll{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.02em;font-weight:700;color:var(--text)}
p{margin:0}
img{max-width:100%}
::selection{background:rgba(96,165,250,.35);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3A4761;border-radius:8px;border:3px solid transparent;background-clip:content-box}
button,.btn,.nav-item,.bn-item,.tab,.chip,.icon-btn,.fav-btn,.avatar,.pay-chip,.wallet-chip,
.rank-row,.faq-q,.contact-link,.orders-btn,.game-card,.order-card,.row-item,.notif-item,
.cd-select-trigger,.cd-select-option,.adm-action,.adm-item,.adm-chip,.svc-contact,
.lb-row,.coin-badge,.notif-mark-btn,.adm-announce-item,.adm-user-status,.adm-user-actions,
.carousel-dot,.carousel-slide,.adm-img-actions,.drawer-item,.drawer-close,.hamburger-btn{
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
.mono,.copyable,input,textarea,select,.selectable,.terms-section p,.terms-section li{
  -webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}
input,textarea,select{-webkit-touch-callout:default}
svg.lucide{width:17px;height:17px;flex:none;stroke-width:1.9}
i[data-lucide]{display:inline-block;width:17px;height:17px;flex:none}
i.icon-fb{display:inline-grid;place-items:center;font-style:normal;font-size:13px;line-height:1;opacity:.85}
.btn svg.lucide,.btn i[data-lucide]{width:15px;height:15px}
.icon-btn svg.lucide,.icon-btn i[data-lucide]{width:18px;height:18px}
.bottomnav svg.lucide,.bottomnav i[data-lucide]{width:20px;height:20px}
.app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:16px 14px 108px}
@media(min-width:1024px){
  .sidebar{display:flex;flex-direction:column;width:248px;flex:none;position:sticky;top:0;height:100vh;padding:20px 12px 14px;
    border-right:1px solid var(--border);background:linear-gradient(180deg,#1D2535,#171C28)}
  .bottomnav{display:none}
  .view{padding:24px 30px 56px}
}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#60A5FA,#A78BFA);color:#0F1420;overflow:hidden;padding:0;
  box-shadow:0 6px 18px -10px rgba(96,165,250,.75)}
.brand-mark.has-logo{background:#1D2535;border:1px solid var(--border);box-shadow:none}
.brand-mark.has-logo img{width:100%;height:100%;object-fit:contain;display:block;padding:3px}
.brand-mark svg.lucide,.brand-mark i[data-lucide]{width:18px;height:18px}
.brand-text{font-weight:800;font-size:15px;letter-spacing:.03em;color:var(--text)}
.brand-text em{font-style:normal;font-weight:800;
  background:linear-gradient(100deg,#60A5FA,#A78BFA 60%,#4DD0E1);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sidebar .brand{margin-bottom:20px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  color:var(--muted);font-size:13.5px;font-weight:600;transition:.16s var(--ease);position:relative}
.nav-item:hover{background:var(--card-hi);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(96,165,250,.16),rgba(96,165,250,.03));color:var(--text)}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 4px 4px 0;background:var(--blue);box-shadow:0 0 12px rgba(96,165,250,.6)}
.nav-item.active svg.lucide{color:var(--blue)}
.sidebar-foot{margin-top:auto;padding:12px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--card);font-size:11px;color:var(--muted);line-height:1.5}
.sidebar-foot strong{display:block;color:var(--text);font-size:11.5px;margin-bottom:3px}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 12px;border-bottom:1px solid var(--border);background:rgba(23,28,40,.85);backdrop-filter:blur(16px)}
@media(min-width:1024px){.topbar{padding:11px 30px;flex-wrap:nowrap}}
.hamburger-btn{display:grid}
@media(min-width:1024px){.hamburger-btn{display:none}}
.brand-mobile{display:flex;align-items:center;gap:8px}
@media(min-width:1024px){.brand-mobile{display:none}}
.brand-mobile .brand-text{font-size:14.5px}
.brand-mobile .brand-mark{width:30px;height:30px;border-radius:9px}
.search-wrap{position:relative;order:3;width:100%;display:flex;align-items:center}
@media(min-width:1024px){.search-wrap{order:0;width:auto;flex:1;max-width:400px}}
.search-wrap > svg.lucide,.search-wrap > i[data-lucide]{position:absolute;left:12px;color:var(--muted-2);width:16px;height:16px;pointer-events:none}
.search-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px 10px 36px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;transition:.16s var(--ease)}
.search-input::placeholder{color:var(--muted-2)}
.search-input:focus{border-color:var(--blue);background:var(--card-hi);box-shadow:0 0 0 3px rgba(96,165,250,.18)}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:90;background:#222B3E;
  border:1px solid var(--border-hi);border-radius:var(--r);box-shadow:var(--shadow-lg);
  padding:6px;display:none;max-height:60vh;overflow:auto}
.suggest.open{display:block;animation:pop .16s var(--ease)}
.sug-group{padding:6px 8px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);font-weight:700}
.sug-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;transition:.15s;cursor:pointer}
.sug-item:hover{background:var(--card-hi)}
.sug-item .sug-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:10.5px;font-weight:800;color:#0F1420;padding:4px}
.sug-item .sug-ico svg{width:100%;height:100%;display:block}
.sug-item .sug-t{font-size:13px;font-weight:600;color:var(--text)}
.sug-item .sug-s{font-size:11px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:7px;margin-left:auto}
.icon-btn{position:relative;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--border);color:var(--muted);transition:.16s var(--ease)}
.icon-btn:hover{background:var(--card-hi);color:var(--text);border-color:var(--border-hi)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.help-btn{color:var(--blue);border-color:rgba(96,165,250,.4);background:rgba(96,165,250,.1)}
.icon-btn.help-btn:hover{color:#fff;background:rgba(96,165,250,.22);border-color:var(--blue)}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--pink);color:#0F1420;font-size:9.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.wallet-chip{display:none;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:10px;
  background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.35);color:var(--teal);
  font-size:12.5px;font-weight:700;transition:.16s var(--ease)}
.wallet-chip:hover{border-color:var(--teal)}
@media(min-width:520px){.wallet-chip{display:flex}}
.wallet-chip .coin-icon{width:15px;height:15px}
.avatar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;
  font-weight:800;font-size:13px;color:#fff;letter-spacing:.02em;border:1px solid var(--border);
  transition:.16s var(--ease);overflow:hidden}
.avatar:hover{transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(0,0,0,.7)}
.avatar-img{width:100%;height:100%;object-fit:cover;display:block}
.pay-chip{display:flex;align-items:center;justify-content:center;gap:0;height:38px;width:38px;padding:0;border-radius:10px;
  background:linear-gradient(135deg,var(--blue),#3B82F6);border:1px solid var(--blue);color:#0F1420;font-size:12.5px;font-weight:800;
  transition:.16s var(--ease);flex:none;box-shadow:0 6px 16px -10px rgba(96,165,250,.7)}
.pay-chip:hover{transform:translateY(-1px);box-shadow:0 10px 22px -12px rgba(96,165,250,.9)}
.pay-chip:active{transform:scale(.95)}
.pay-chip .coin-icon{width:16px;height:16px}
.pay-chip span{display:none}
@media(min-width:480px){.pay-chip{width:auto;padding:0 12px;gap:6px}.pay-chip span{display:inline}}
.coin-icon{display:inline-block;vertical-align:middle;flex:none;filter:drop-shadow(0 2px 4px rgba(251,191,36,.35))}
.coin-icon svg{display:block;width:100%;height:100%}
.coin-inline{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--gold);white-space:nowrap}
.coin-inline .coin-icon{width:13px;height:13px}
.coin-price{display:inline-flex;align-items:center;gap:5px;color:var(--gold);font-weight:800;font-size:13.5px}
.coin-price .coin-icon{width:13px;height:13px}
.coin-big{display:flex;align-items:center;gap:10px;font-size:clamp(24px,6.5vw,34px);font-weight:800;
  letter-spacing:-.03em;color:var(--gold);text-shadow:0 4px 22px rgba(251,191,36,.25)}
.coin-big .coin-icon{width:clamp(26px,6.5vw,36px);height:clamp(26px,6.5vw,36px)}
.wallet-num{font-size:11.5px;color:var(--muted);font-weight:600}
.notif-panel{position:fixed;top:62px;right:12px;left:12px;z-index:9000;background:#1F2838;
  border:1px solid var(--border-hi);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  display:none;overflow:hidden;max-height:calc(100vh - 86px);flex-direction:column}
.notif-panel.open{display:flex;animation:pop .18s var(--ease)}
@media(min-width:640px){.notif-panel{left:auto;width:380px;right:18px}}
@media(min-width:1024px){.notif-panel{top:66px;right:30px}}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.notif-head h4{font-size:13.5px;display:flex;align-items:center;gap:7px}
.notif-mark-btn{background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.35);color:var(--blue);
  border-radius:8px;padding:5px 9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s}
.notif-mark-btn:hover{background:rgba(96,165,250,.24)}
.notif-mark-btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
.notif-count-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.35);color:var(--gold);
  font-size:10px;font-weight:800;letter-spacing:.03em}
.notif-list{overflow-y:auto;flex:1}
.notif-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(53,66,88,.5);transition:.15s;align-items:flex-start}
.notif-item:last-child{border-bottom:none}
.notif-item.nav{cursor:pointer}
.notif-item:hover{background:var(--card)}
.notif-item.unread{background:rgba(96,165,250,.06)}
.notif-item.unread .n-title{color:var(--text)}
.notif-item .notif-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:rgba(96,165,250,.14);color:var(--blue)}
.notif-item .notif-ico.private{background:rgba(167,139,250,.16);color:var(--purple)}
.notif-item .notif-ico.system{background:rgba(77,208,225,.14);color:var(--cyan)}
.notif-item .notif-ico svg.lucide{width:15px;height:15px}
.notif-item .notif-body{flex:1;min-width:0}
.notif-item .n-title{font-size:13px;font-weight:700;color:var(--muted);line-height:1.3}
.notif-item .n-body{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;word-break:break-word}
.notif-item .n-time{font-size:10.5px;color:var(--muted-2);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.notif-item .n-tag{display:inline-block;padding:1px 6px;border-radius:4px;background:rgba(96,165,250,.14);color:var(--blue);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.notif-item .n-tag.private{background:rgba(167,139,250,.16);color:var(--purple)}
.notif-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 18px;gap:6px}
.notif-empty .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.28);color:var(--blue);margin-bottom:4px}
.notif-empty .ic svg.lucide{width:20px;height:20px}
.notif-empty h4{font-size:13px;font-weight:800}
.notif-empty p{font-size:12px;color:var(--muted-2);max-width:220px;line-height:1.5}
.notif-foot{border-top:1px solid var(--border);padding:10px 14px;text-align:center}
.notif-foot a{font-size:12px;font-weight:700;color:var(--blue)}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:70;display:flex;justify-content:space-around;
  padding:6px 5px calc(6px + env(safe-area-inset-bottom));background:rgba(29,37,53,.96);backdrop-filter:blur(18px);
  border-top:1px solid var(--border)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;
  color:var(--muted-2);font-size:9.5px;font-weight:700;letter-spacing:.01em;transition:.16s var(--ease)}
.bn-item.active{color:var(--blue)}
.bn-item.active svg.lucide{filter:drop-shadow(0 0 8px rgba(96,165,250,.55))}
.bn-item:active{transform:scale(.93)}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);transition:.2s var(--ease)}
.card.pad{padding:14px}
.card:hover{border-color:var(--border-hi)}
.stretched{position:absolute;inset:0;z-index:3;border-radius:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
  border-radius:11px;padding:11px 16px;font-weight:700;font-size:13.5px;color:var(--text);background:transparent;
  transition:.16s var(--ease);white-space:nowrap;letter-spacing:-.01em;min-height:42px}
.btn:active{transform:scale(.975)}
.btn-primary{background:linear-gradient(135deg,#60A5FA,#3B82F6);color:#0B1220;border-color:#60A5FA;
  box-shadow:0 8px 20px -14px rgba(96,165,250,.9)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 24px -14px rgba(96,165,250,1)}
.btn-coin{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#2A1A00;border-color:#FBBF24;
  box-shadow:0 8px 20px -14px rgba(251,191,36,.85)}
.btn-coin:hover{transform:translateY(-1px);box-shadow:0 12px 24px -14px rgba(251,191,36,1)}
.btn-ghost{background:var(--card);border-color:var(--border-hi);color:var(--text)}
.btn-ghost:hover{background:var(--card-hi);border-color:#55668A}
.btn-danger{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.4);color:#FCA5A5}
.btn-danger:hover{background:rgba(248,113,113,.22)}
.btn-success{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.4);color:#86EFAC}
.btn-success:hover{background:rgba(74,222,128,.22)}
.btn-sm{padding:8px 13px;font-size:12.5px;border-radius:9px;min-height:36px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;filter:grayscale(.3);cursor:not-allowed;pointer-events:none;box-shadow:none;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.32);font-size:11px;font-weight:700;
  color:var(--blue);letter-spacing:.02em}
.pill svg.lucide{width:13px;height:13px}
.meta{font-size:12px;color:var(--muted);margin-top:3px}
.tiny{font-size:11px;color:var(--muted-2)}
.grad{background:linear-gradient(100deg,#60A5FA,#A78BFA 50%,#4DD0E1);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;align-items:center;gap:9px}
.between{justify-content:space-between}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.02em}
.link{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--blue)}
.link svg.lucide{width:13px;height:13px}
.muted{color:var(--muted)}
.copy-inline{display:inline-flex;align-items:center;gap:5px;max-width:100%;min-width:0}
.copy-inline .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.copy-btn{background:var(--card-hi);border:1px solid var(--border);border-radius:7px;padding:3px;
  color:var(--muted);display:grid;place-items:center;transition:.15s var(--ease);flex:none}
.copy-btn:hover{color:var(--blue);border-color:var(--blue)}
.copy-btn svg.lucide{width:12px;height:12px}
.section{margin-top:26px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.section-head h2{font-size:16.5px}
.section-head p{font-size:12.5px;color:var(--muted);margin-top:3px}
.grid{display:grid;gap:11px}
.grid-games{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.grid-feat{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.home-date{display:flex;align-items:center;gap:7px;margin-bottom:12px;padding:0 3px;font-size:12px;
  font-weight:600;color:var(--muted);letter-spacing:.01em}
.home-date svg.lucide{width:13px;height:13px;color:var(--cyan)}
.leaderboard{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:18px 16px;
  background:linear-gradient(155deg,rgba(251,191,36,.10),rgba(167,139,250,.05) 55%,rgba(36,46,64,.6) 90%),
    var(--card);border:1px solid rgba(251,191,36,.24)}
.leaderboard::before{content:'';position:absolute;width:280px;height:280px;right:-100px;top:-140px;
  border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.18),transparent 68%);pointer-events:none}

const VN_DAYS = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
function getVietnameseDate(d){
  d = d || new Date();
  return VN_DAYS[d.getDay()] + ', ngày ' + String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}
function currentDateKey(){ const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
let _lastDateKey = currentDateKey();
function refreshDateDisplays(){
  const els = document.querySelectorAll('[data-date-display]'); if (!els.length) return;
  const s = getVietnameseDate();
  els.forEach(el => { if (el.textContent !== s) el.textContent = s; });
}
setInterval(() => { const k = currentDateKey(); if (k !== _lastDateKey){ _lastDateKey = k; refreshDateDisplays(); } }, 20000);
const NAME_CHANGE_COOLDOWN = 7*24*60*60*1000;
function canChangeName(user){
  if (!user || !user.lastNameChange) return { ok: true };
  const elapsed = Date.now() - user.lastNameChange;
  if (elapsed >= NAME_CHANGE_COOLDOWN) return { ok: true };
  return { ok: false, remainingMs: NAME_CHANGE_COOLDOWN - elapsed };
}
function fmtRemaining(ms){
  if (ms <= 0) return '0 phút';
  const totalMin = Math.floor(ms/60000);
  const d = Math.floor(totalMin/(24*60)); const h = Math.floor((totalMin%(24*60))/60); const m = totalMin % 60;
  if (d > 0) return `${d} ngày ${h} giờ`;
  if (h > 0) return `${h} giờ ${m} phút`;
  return `${m} phút`;
}

function demoHash(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return 'demo$' + (h >>> 0).toString(16); }
function ensureAdminHash(){ if (!LS.get(K.adminPassHash, null)) LS.set(K.adminPassHash, demoHash(DEFAULT_ADMIN_PASS_SEED)); }
function verifyAdminPassword(pw){
  if (SUPABASE_ENABLED) return false;
  const stored = LS.get(K.adminPassHash, null);
  return stored ? demoHash(String(pw || '')) === stored : false;
}

function getBankConfig(){
  const src = SUPABASE_ENABLED
    ? ((GC.settings && GC.settings.bank) || {})

  const m = Object.assign({}, BANK_DEFAULTS, src);

    bankId:        String(m.bankId || '').trim().toUpperCase(),

    accountNumber: String(m.accountNumber || '').trim().replace(/\s+/g,''),
    accountHolder: String(m.accountHolder || '').trim(),
    defaultDescription: String(m.defaultDescription || '').trim()
  };
}
function saveBankConfig(cfg){
  if (SUPABASE_ENABLED) return true;
  return LS.set(K.bankConfig, cfg);
}
function isBankConfigured(cfg){
  cfg = cfg || getBankConfig();
  return !!(cfg.bankId && /^\d{6,25}$/.test(cfg.accountNumber));
}
function buildVietQRUrl(cfg, amount, description){
  cfg = cfg || getBankConfig();
  if (!isBankConfigured(cfg)) return null;
  const bankPart = encodeURIComponent(cfg.bankId);
  const acctPart = encodeURIComponent(cfg.accountNumber);
  const p = new URLSearchParams();
  const amt = Math.round(Number(amount) || 0);
  if (amt > 0) p.set('amount', String(amt));
  if (description) p.set('addInfo', String(description).slice(0, 50));
  if (cfg.accountHolder) p.set('accountName', cfg.accountHolder);
  return `https://img.vietqr.io/image/${bankPart}-${acctPart}-${VIETQR_TEMPLATE}.png?${p.toString()}`;
}

function statusGroup(s){
  if (s === 'awaiting_payment') return 'awaiting_payment';
  if (s === 'awaiting_verification' || s === 'pending') return 'awaiting_verification';
  if (s === 'confirmed' || s === 'approved') return 'confirmed';
  if (s === 'rejected' || s === 'cancelled') return 'rejected';

}

  return s === 'awaiting_verification' || s === 'pending' || s === 'awaiting_payment';

/* ⭐ Gen mã CK duy nhất — dedup cả các mã cũ (bao gồm cancelled/rejected) */
function genTopupOrderId(){
  const used = new Set();
  if (SUPABASE_ENABLED){
    (GC.adminTopups || []).forEach(t => { if (t.ref_code) used.add(String(t.ref_code).toUpperCase()); });
  } else {
    (getLocalTopups() || []).forEach(t => { if (t.refCode) used.add(String(t.refCode).toUpperCase()); });
  }
  for (let i = 0; i < 500; i++){
    const id = 'LT' + Math.floor(100000 + Math.random() * 900000);
    if (!used.has(id)) return id;
  }
  return 'LT' + Date.now().toString().slice(-9) + Math.floor(Math.random()*90+10);
}

    cancelled:              'Đã huỷ'

}
function topupStatusClass(s){
  if (s === 'confirmed' || s === 'approved') return 'completed';

let _realtimeChannel = null;
function startRealtime() {
  if (!SUPABASE_ENABLED || !GC.profile) return;
  if (_realtimeChannel) return;
  const uid = GC.profile.id;
  _realtimeChannel = sb.channel('wq-' + uid)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'wallets', filter: 'user_id=eq.' + uid },
      async () => { await refreshUserCache(); render(); updateNotifBadge(); toast('Số dư ví vừa được cập nhật', 'success'); })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + uid },
      async (payload) => { await refreshUserCache(); render(); updateNotifBadge();
        const t = payload.new && payload.new.title ? payload.new.title : 'Thông báo mới'; toast(t, 'info'); })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'topup_requests' },
      async () => { if (!GC.isAdmin) return; await refreshAdminCache(); render(); toast('Có yêu cầu nạp mới', 'info'); })
    .subscribe();
}
function stopRealtime() { if (_realtimeChannel){ try { sb.removeChannel(_realtimeChannel); } catch(e){} _realtimeChannel = null; } }

const IMG_CACHE = {}; const IMG_META = {};
const IMG_KEYS = ['logo','hero_bg','game_freefire','carousel_0','carousel_1','carousel_2','service_rankboost','service_topsung','service_logo_rankboost','service_logo_topsung'];
async function loadAllImagesToCache(){
  for (const k of IMG_KEYS){ delete IMG_CACHE[k]; delete IMG_META[k]; }
  if (SUPABASE_ENABLED){
    const imgs = GC.images || {};
    for (const k of IMG_KEYS){ if (imgs[k] && imgs[k].url){ IMG_CACHE[k] = imgs[k].url; IMG_META[k] = { caption: imgs[k].caption||'', yPos: typeof imgs[k].yPos==='number'?imgs[k].yPos:50, updatedAt: Date.now() }; } }
    return;
  }
  for (const k of IMG_KEYS){
    const rec = await IMGDB.get(k);
    if (rec && rec.data){ IMG_CACHE[k] = rec.data; IMG_META[k] = { caption: rec.caption||'', yPos: (typeof rec.yPos==='number')?rec.yPos:50, updatedAt: rec.updatedAt||0 }; }
  }
}
function imgY(key){ const m = IMG_META[key]; return (m && typeof m.yPos === 'number') ? m.yPos : 50; }
function imgPosStyle(key, extra){ return `object-position:center ${imgY(key)}%;${extra || ''}`; }
function heroBgY(){ return imgY('hero_bg'); }

const IMGDB = {
  _db: null,
  async open(){
    if (this._db) return this._db;
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('no-idb'));
      const req = indexedDB.open('webcuaquan_media_v1', 1);
      req.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains('images')) db.createObjectStore('images', { keyPath: 'key' }); };
      req.onsuccess = () => { this._db = req.result; resolve(this._db); };
      req.onerror = () => reject(req.error);
    });
  },
  async get(key){ try { const db = await this.open(); return new Promise((res) => { const tx = db.transaction('images','readonly'); const r = tx.objectStore('images').get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); } catch(e){ return null; } },
  async put(rec){ try { const db = await this.open(); return new Promise((res) => { const tx = db.transaction('images','readwrite'); tx.objectStore('images').put(rec); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); } catch(e){ return false; } },
  async del(key){ try { const db = await this.open(); return new Promise((res) => { const tx = db.transaction('images','readwrite'); tx.objectStore('images').delete(key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); } catch(e){ return false; } }
};

function isValidGmail(email){
  const s = String(email || '').trim().toLowerCase();
  return /^[a-zA-Z0-9._%+\-]+@gmail\.com$/.test(s);
}
async function registerUser({ username, email, password }){
  const uname = String(username || '').trim();
  email = String(email || '').trim().toLowerCase();
  if (uname.length < 3) return { ok:false, error:'Tên hiển thị phải có ít nhất 3 ký tự.' };
  if (!isValidGmail(email)) return { ok:false, error:'Email phải có định dạng @gmail.com.' };
  if (String(password).length < 6) return { ok:false, error:'Mật khẩu phải có ít nhất 6 ký tự.' };

  if (SUPABASE_ENABLED){
    const res = await DB.signUp(email, password, uname);
    if (!res.ok) return res;
    await refreshUserCache();
    if (res.needsConfirm) return { ok:true, needsConfirm:true };
    return { ok:true, user: getCurrentUser() };
  }
  const users = LS.get(K.users, []) || [];
  if (email === ADMIN_EMAIL) return { ok:false, error:'Email này không thể đăng ký.' };
  if (users.some(u => u.email === email)) return { ok:false, error:'Email này đã được đăng ký.' };
  if (users.some(u => String(u.username||'').toLowerCase() === uname.toLowerCase())) return { ok:false, error:'Tên hiển thị này đã được sử dụng.' };
  const user = { id: uid('u'), username: uname, email, pass: demoHash(password), createdAt: Date.now(),
    color: 'linear-gradient(135deg,#60A5FA,#3B82F6)', avatar: null, lastNameChange: Date.now(), suspended: false };
  users.push(user); saveUsers(users); LS.set(K.session, user.id); setAdminSession(false);
  const d = defaultData();
  d.notifications.push({ id: uid('n'), title: 'Chào mừng đến LENTRINH', body: 'Tài khoản của bạn đã sẵn sàng.', time: Date.now(), read: false, type: 'welcome' });
  LS.set(K.data(user.id), d);
  return { ok:true, user };
}

async function loginUser(email, password){
  email = String(email || '').trim().toLowerCase();

  if (!SUPABASE_ENABLED && email === ADMIN_EMAIL){
    ensureAdminHash();
    const stored = LS.get(K.adminPassHash, null);
    const ok = stored ? demoHash(String(password || '')) === stored : false;
    if (!ok) return { ok:false, error:'Mật khẩu quản trị không đúng.' };
    LS.set(K.adminSession, true);
    LS.del(K.session);
    return { ok:true, isAdmin:true };
  }

  if (SUPABASE_ENABLED){
    const res = await DB.signIn(email, password);
    if (!res.ok) return res;
    await refreshUserCache();
    if (!GC.profile) return { ok:false, error:'Không tìm thấy hồ sơ.' };
    stopRealtime();
    if (GC.profile.suspended) return { ok:false, error:'Tài khoản đã bị đình chỉ.' };
    return { ok:true, user: getCurrentUser(), isAdmin: GC.isAdmin };
  }

  const users = LS.get(K.users, []) || [];
  const user = users.find(u => u.email === email);
  if (!user) return { ok:false, error:'Không tìm thấy tài khoản.' };
  if (user.pass !== demoHash(password)) return { ok:false, error:'Mật khẩu không đúng.' };
  if (user.suspended) return { ok:false, error:'Tài khoản đã bị đình chỉ.' };
  setAdminSession(false);
  LS.set(K.session, user.id);
  return { ok:true, user };
}

function initCustomSelects(root){
  root = root || document;
  root.querySelectorAll('[data-custom-select]').forEach(wrap => {
    if (wrap.dataset.csInit) return; wrap.dataset.csInit = '1';
    const sel = wrap.querySelector('.cd-select-native'), trigger = wrap.querySelector('.cd-select-trigger');
    const menu = wrap.querySelector('.cd-select-menu'), valueEl = wrap.querySelector('.cd-select-value');
    if (!sel || !trigger || !menu || !valueEl) return;
    const placeholder = wrap.dataset.placeholder || 'Chọn';
    const portal = wrap.dataset.portal === 'true';
    menu.innerHTML = Array.from(sel.options).map(o => `<button type="button" class="cd-select-option" role="option" data-value="${esc(o.value)}" ${o.disabled?'disabled':''}>${esc(o.textContent)}</button>`).join('');
    const updateLabel = () => {
      const cur = sel.value; const found = Array.from(sel.options).find(o => o.value === cur);
      if (cur && found){ valueEl.textContent = found.textContent; valueEl.classList.remove('placeholder'); }
      else { valueEl.textContent = placeholder; valueEl.classList.add('placeholder'); }
      menu.querySelectorAll('.cd-select-option').forEach(b => b.classList.toggle('selected', b.dataset.value === cur));
    };
    updateLabel();
    function positionMenu(){
      if (!portal) return;
      const r = trigger.getBoundingClientRect();
      const goUp = (window.innerHeight - r.bottom) < 270 && r.top > 200;
      menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - r.width - 8)) + 'px';
      menu.style.width = r.width + 'px';
      if (goUp){ menu.style.top='auto'; menu.style.bottom=(window.innerHeight - r.top + 6)+'px'; menu.classList.add('cd-up'); }
      else { menu.style.bottom='auto'; menu.style.top=(r.bottom + 6)+'px'; menu.classList.remove('cd-up'); }
    }
    function openMenu(){
      if (_openSelectWrap && _openSelectWrap !== wrap){ _openSelectWrap.classList.remove('open'); const t = _openSelectWrap.querySelector('.cd-select-trigger'); if (t) t.setAttribute('aria-expanded','false'); }
      _openSelectWrap = wrap; wrap.classList.add('open'); trigger.setAttribute('aria-expanded','true');
      if (portal){ if (menu.parentNode !== document.body) document.body.appendChild(menu); menu.classList.add('cd-portal'); positionMenu(); menu.style.display = 'block'; }
    }
    function closeMenu(){ wrap.classList.remove('open'); trigger.setAttribute('aria-expanded','false'); if (portal) menu.style.display = ''; if (_openSelectWrap === wrap) _openSelectWrap = null; }
    trigger.addEventListener('click', (e) => { e.stopPropagation(); if (wrap.classList.contains('open')) closeMenu(); else openMenu(); });
    menu.addEventListener('click', (e) => {
      const b = e.target.closest('.cd-select-option'); if (!b || b.disabled) return;
      e.stopPropagation(); sel.value = b.dataset.value;
      sel.dispatchEvent(new Event('change', { bubbles: true })); sel.dispatchEvent(new Event('input', { bubbles: true }));
      closeMenu(); updateLabel();
    });
    sel.addEventListener('change', updateLabel);
    if (portal){ window.addEventListener('scroll', () => { if (wrap.classList.contains('open')) positionMenu(); }, true); window.addEventListener('resize', () => { if (wrap.classList.contains('open')) positionMenu(); }); }
  });
}

let _carouselTimer = null;
function initCarousel(){
  const el = document.getElementById('ffCarousel');
  if (!el){ if (_carouselTimer){ clearInterval(_carouselTimer); _carouselTimer = null; } return; }
  if (_carouselTimer){ clearInterval(_carouselTimer); _carouselTimer = null; }
  const track = el.querySelector('.carousel-track'); const slides = el.querySelectorAll('.carousel-slide'); const dots = el.querySelectorAll('.carousel-dot');
  if (!track || slides.length < 2) return;
  let idx = 0; const total = slides.length;
  const go = (i) => { idx = ((i % total) + total) % total; track.style.transform = `translateX(-${idx * 100}%)`; dots.forEach((d, k) => d.classList.toggle('active', k === idx)); };
  const start = () => { if (_carouselTimer) clearInterval(_carouselTimer); _carouselTimer = setInterval(() => go(idx + 1), CONFIG.CAROUSEL_INTERVAL); };
  const stop = () => { if (_carouselTimer){ clearInterval(_carouselTimer); _carouselTimer = null; } };
  dots.forEach((d, i) => d.addEventListener('click', (e) => { e.stopPropagation(); go(i); start(); }));
  let startX = 0, startY = 0, moved = false;
  el.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; moved = false; stop(); }, { passive: true });
  el.addEventListener('touchmove', (e) => { const dx = e.touches[0].clientX - startX; const dy = e.touches[0].clientY - startY; if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) moved = true; }, { passive: true });
  el.addEventListener('touchend', (e) => { if (!moved){ start(); return; } const dx = e.changedTouches[0].clientX - startX; if (Math.abs(dx) < 40){ start(); return; } go(idx + (dx < 0 ? 1 : -1)); start(); });
  el.addEventListener('mouseenter', stop); el.addEventListener('mouseleave', start);
  go(0); start();
}

function refreshPaymentModal(){ const modal = $('.modal'); if (!modal) return; modal.innerHTML = paymentModalInner(); refreshIcons(); bindPayAmountInput(); }
function applyThousandsSeparator(rawValue){ const digits = String(rawValue||'').replace(/\D/g,''); if (!digits) return { formatted:'', numeric:0 }; const numeric = Number(digits); return { formatted: numeric.toLocaleString('vi-VN'), numeric }; }
function bindPayAmountInput(){
  const inp = $('#payAmountInput'); if (!inp) return;
  inp.addEventListener('input', () => {
    const prevPos = inp.selectionStart, prevLen = inp.value.length;
    const { formatted, numeric } = applyThousandsSeparator(inp.value); payAmount = numeric;
    if (inp.value !== formatted){
      inp.value = formatted;
      const added = formatted.length - prevLen;
      let np = prevPos + added; if (np < 0) np = 0; if (np > formatted.length) np = formatted.length;
      try { inp.setSelectionRange(np, np); } catch(e){}
    }
    $$('.pay-quick .chip').forEach(b => b.classList.toggle('active', Number(b.dataset.amount) === numeric));
    updateVietQRPreview();
  });
}
function updateVietQRPreview(){
  const img = document.getElementById('vietQrImg'); if (!img) return;
  const cfg = getBankConfig();
  const url = buildVietQRUrl(cfg, payAmount, payRefCode);
  if (url) img.src = url;
  const amtEl = document.getElementById('payLiveAmount');
  if (amtEl) amtEl.textContent = fmtNumber(payAmount) + ' xu';
}

  payAmount = 50000;
  payRefCode = genTopupOrderId();
  payLocked = false;
  openModal(paymentModalInner()); bindPayAmountInput();
}

function computeLeaderboard(){
  if (SUPABASE_ENABLED) return [];
  const users = (LS.get(K.users, []) || []).filter(u => !u.suspended);
  const rows = [];
  users.forEach(u => {
    const stored = LS.get(K.data(u.id), null); if (!stored) return;
    const wallet = stored.wallet || {};
    let total = wallet.totalDeposited;
    if (typeof total !== 'number'){
      const txs = wallet.transactions || [];
      total = txs.filter(t => t.amount > 0 && t.ref !== 'REFUND' && t.ref !== 'REVOKE' && t.ref !== 'ORDER' && t.ref !== 'ADMIN_GRANT').reduce((s,t) => s + t.amount, 0);
    }
    if (total > 0) rows.push({ userId:u.id, username:u.username, avatar:u.avatar, color:u.color, createdAt:u.createdAt, total });
  });
  rows.sort((a, b) => b.total !== a.total ? b.total - a.total : a.createdAt - b.createdAt);
  return rows.slice(0, 10);
}

      return `<div class="lb-row ${cls}"><span class="lb-rank">${rank}</span>

        <div class="lb-body"><div class="lb-name">${esc(r.username)} ${medal}</div>
          <div class="lb-sub">Thành viên từ ${fmtDate(r.createdAt)}</div></div>
        <div class="lb-score">${coinIconHTML(12)} ${fmtNumber(r.total)}</div></div>`;
    }).join('')}</div>
    <div class="notice" style="margin-top:12px">${ic('info')}<span>Xếp hạng dựa trên tổng xu đã nạp thành công (không tính xu cộng thủ công, đã chi tiêu, hoặc hoàn tiền).</span></div></div>`;
}

function getUnifiedNotifications(){
  const u = getCurrentUser(); if (!u) return [];
  const d = getData(); if (!d) return [];
  const own = d.notifications.map(n => Object.assign({}, n, { _kind: 'own' }));
  const anns = getAnnouncements().map(a => ({ id: a.id, title: a.title, body: a.body, time: a.time,
    read: SUPABASE_ENABLED ? false : !!d.announcementReads[a.id], type: 'announcement', _kind: 'announcement', recipientCount: a.recipientCount }));
  return own.concat(anns).sort((a,b) => b.time - a.time);
}
function iconForNotif(n){
  const t = n.type || '';
  if (t === 'private-message') return 'mail';
  if (t === 'order-created') return 'receipt';
  if (t === 'order-cancelled') return 'x';
  if (t === 'order-status') return 'activity';
  if (t === 'order-completed') return 'check-circle';
  if (t === 'wallet-topup') return 'coins';
  if (t === 'wallet-refund') return 'rotate-ccw';
  if (t === 'welcome') return 'sparkles';
  if (t === 'announcement' || t === 'broadcast') return 'megaphone';
  return 'info';
}
function tagForNotif(n){
  const t = n.type || '';
  if (t === 'private-message') return 'Tin nhắn';
  if (t === 'announcement' || t === 'broadcast') return 'Hệ thống';
  if (t === 'order-created' || t === 'order-status' || t === 'order-cancelled' || t === 'order-completed') return 'Đơn hàng';
  if (t === 'wallet-topup' || t === 'wallet-refund') return 'Ví';
  if (t === 'welcome') return 'Chào mừng';
  return '';
}
function notifIconClass(n){
  if (n.type === 'private-message') return 'notif-ico private';
  if (n.type === 'announcement' || n.type === 'broadcast') return 'notif-ico system';
  return 'notif-ico';
}
function navTargetForNotif(n){
  if (n._kind === 'own'){
    if (n.orderId) return '#/order/' + n.orderId;
    if (n.type === 'wallet-topup' || n.type === 'wallet-refund') return '#/wallet';
  }
  return '';
}
function markNotificationRead(notif){
  const u = getCurrentUser(); if (!u) return;
  const d = getData(); if (!d) return;
  if (notif._kind === 'announcement'){ if (!SUPABASE_ENABLED) d.announcementReads[notif.id] = true; }
  else {
    const own = d.notifications.find(x => x.id === notif.id); if (own) own.read = true;
    if (SUPABASE_ENABLED && sb) sb.from('notifications').update({ read: true }).eq('id', notif.id).then(()=>{});
  }
  saveData(d); updateNotifBadge();
}
async function markAllNotificationsRead(){
  const u = getCurrentUser(); if (!u) return;
  if (SUPABASE_ENABLED){ await DB.markAllMyNotifRead(); await refreshUserCache(); }
  else { const d = getData(); if (!d) return; d.notifications.forEach(n => n.read = true); getAnnouncements().forEach(a => { d.announcementReads[a.id] = true; }); saveData(d); }
  updateNotifBadge(); toast('Đã đánh dấu tất cả đã đọc', 'success');
}
function notifItemHTML(n){
  const nav = navTargetForNotif(n);
  const cls = 'notif-item' + (n.read ? '' : ' unread') + (nav ? ' nav' : '');
  const attrs = nav ? ` data-nav="${esc(nav)}"` : '';
  const iconCls = notifIconClass(n);
  const tagCls = n.type === 'private-message' ? 'n-tag private' : 'n-tag';
  return `<div class="${cls}"${attrs} data-notif-id="${esc(n.id)}" data-notif-kind="${n._kind}">
    <div class="${iconCls}">${ic(iconForNotif(n))}</div>
    <div class="notif-body"><div class="n-title">${esc(n.title)}</div><div class="n-body">${esc(n.body)}</div>
      <div class="n-time">${tagForNotif(n) ? `<span class="${tagCls}">${esc(tagForNotif(n))}</span>` : ''}${timeAgo(n.time)}</div></div></div>`;
}

function toggleNotificationPanel(){ const panel = document.getElementById('notifPanel'); if (panel && panel.classList.contains('open')) closeNotificationPanel(); else openNotificationPanel(); }
function bindNotificationButtons(){
  const btn = document.getElementById('notifBtn');
  if (btn && !btn.dataset.bound){ btn.dataset.bound = '1'; btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleNotificationPanel(); }); }
  const admBtn = document.getElementById('adminNotifBtn');
  if (admBtn && !admBtn.dataset.bound){ admBtn.dataset.bound = '1'; admBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleAdminNotifPanel(); }); }

document.addEventListener('click', (e) => {
  const panel = document.getElementById('notifPanel');
  if (panel && panel.classList.contains('open')){ if (!panel.contains(e.target) && !e.target.closest('#notifBtn')) closeNotificationPanel(); }
  const admPanel = document.getElementById('admNotifPanel');
  if (admPanel){ if (!admPanel.contains(e.target) && !e.target.closest('#adminNotifBtn')) admPanel.remove(); }
});
function updateNotifBadge(){
  const el = $('#notifBadge'); if (!el) return;
  const u = getCurrentUser(); if (!u){ el.style.display = 'none'; return; }
  const d = getData(); if (!d){ el.style.display = 'none'; return; }
  const ownUnread = d.notifications.filter(x => !x.read).length;
  const annUnread = SUPABASE_ENABLED ? 0 : getAnnouncements().filter(a => !d.announcementReads[a.id]).length;
  const n = ownUnread + annUnread;
  el.style.display = n ? 'grid' : 'none';
  el.textContent = n > 9 ? '9+' : n;
}
function toast(msg, type){
  type = type || 'success';
  const wrap = $('#toasts'); if (!wrap) return;
  const t = document.createElement('div'); t.className = 'toast toast-' + type;
  const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info';
  t.innerHTML = ic(icon) + '<span>' + esc(msg) + '</span>';
  wrap.appendChild(t); refreshIcons();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 280); }, 2800);
}

let avatarFileInput = null;
function ensureAvatarInput(){
  if (!avatarFileInput){
    avatarFileInput = document.createElement('input');
    avatarFileInput.type = 'file'; avatarFileInput.accept = 'image/*'; avatarFileInput.style.display = 'none';
    avatarFileInput.addEventListener('change', handleAvatarFile); document.body.appendChild(avatarFileInput);
  }
  return avatarFileInput;
}
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read-failed'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('img-load-failed'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h){ if (w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if (h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(c.toDataURL('image/jpeg', quality)); } catch(err){ reject(err); }
      }; img.src = e.target.result;
    }; reader.readAsDataURL(file);
  });
}
async function handleAvatarFile(e){
  const file = e.target.files && e.target.files[0];
  if (avatarFileInput) avatarFileInput.value = '';
  if (!file) return;
  if (!file.type || !file.type.startsWith('image/')){ toast('Vui lòng chọn file ảnh', 'error'); return; }
  if (file.size > 5*1024*1024){ toast('Ảnh phải nhỏ hơn 5MB', 'error'); return; }
  try {
    const dataUrl = await resizeImage(file, 320, 0.82);
    if (SUPABASE_ENABLED){
      const blob = await (await fetch(dataUrl)).blob();
      const up = await DB.uploadImage('avatar_' + (getCurrentUser()||{}).id, blob);
      if (!up.ok){ toast('Lỗi upload: ' + up.error, 'error'); return; }
      const r = await DB.updateMyAvatar(up.publicUrl);
      if (!r.ok){ toast('Lỗi lưu: ' + r.error, 'error'); return; }
      GC.profile.avatar_url = up.publicUrl;
    } else {
      if (!(await updateUser({ avatar: dataUrl }))){ toast('Không thể lưu ảnh.', 'error'); return; }
    }
    toast('Đã cập nhật ảnh đại diện', 'success');
    const wasOpen = !!document.querySelector('.modal [data-form="edit-profile"]');
    render();
    if (wasOpen) editProfileModal();
  } catch (err){ toast('Không thể xử lý ảnh', 'error'); }
}

let imageFileInput = null; let _pendingImageKey = null; let imgEditorState = null;
function ensureImageFileInput(){
  if (!imageFileInput){
    imageFileInput = document.createElement('input');
    imageFileInput.type = 'file'; imageFileInput.accept = 'image/png,image/jpeg,image/webp,image/gif'; imageFileInput.style.display = 'none';

async function handleImageFileChange(e){
  const file = e.target.files && e.target.files[0];
  if (imageFileInput) imageFileInput.value = '';
  const key = _pendingImageKey; _pendingImageKey = null;
  if (!file || !key) return;
  if (!isAdminSession()){ toast('Chỉ quản trị viên mới có thể tải ảnh', 'error'); return; }
  if (!file.type || !file.type.startsWith('image/')){ toast('Vui lòng chọn file ảnh hợp lệ', 'error'); return; }
  if (file.size > CONFIG.MAX_IMAGE_SIZE){ toast('Ảnh phải nhỏ hơn ' + (CONFIG.MAX_IMAGE_SIZE/(1024*1024)) + 'MB', 'error'); return; }
  const isLogo = (key === 'logo' || key.startsWith('service_logo_'));
  const maxDim = isLogo ? CONFIG.IMG_MAX_DIM_LOGO : CONFIG.IMG_MAX_DIM_WIDE;
  const quality = isLogo ? CONFIG.IMG_QUALITY_LOGO : CONFIG.IMG_QUALITY_WIDE;
  try { toast('Đang xử lý ảnh...', 'info'); const dataUrl = await resizeImage(file, maxDim, quality); openImageEditor(key, dataUrl); }
  catch(err){ toast('Không thể xử lý ảnh', 'error'); }
}

function attachImageEditorHandlers(){

  if (!frame || !img || !imgEditorState) return;
  if (range) range.addEventListener('input', () => { imgEditorState.yPos = Number(range.value); updateImageEditorPreview(); });
  let dragging = false, startPointerY = 0, startYPos = 0, frameH = 1;
  const onDown = (e) => { dragging = true; startPointerY = e.clientY; startYPos = imgEditorState.yPos; frameH = frame.getBoundingClientRect().height || 1; img.style.cursor = 'grabbing'; if (e.preventDefault) e.preventDefault(); };
  const onMove = (e) => { if (!dragging) return; const deltaY = e.clientY - startPointerY; let next = startYPos - (deltaY / frameH) * 100; next = Math.max(0, Math.min(100, next)); imgEditorState.yPos = next; updateImageEditorPreview(); if (e.preventDefault) e.preventDefault(); };
  const onUp = () => { dragging = false; img.style.cursor = 'grab'; };
  img.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp);
  window._imgEditorCleanup = () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onUp); };

function setFieldError(field, msg){

function getFFFieldError(field, form){
  const svcId = form.dataset.svcId;
  const svc = FF_SERVICES.find(s => s.id === svcId); if (!svc) return '';
  const key = field.dataset.field;
  const el = field.querySelector('input, select'); const val = (el && el.value || '').trim();
  if (key === 'playerId'){
    if (!val) return 'Vui lòng nhập UID';
    if (!/^\d+$/.test(val)) return 'UID chỉ được chứa chữ số';
    if (val.length < 7 || val.length > 13) return 'UID phải từ 7-13 chữ số';
    return '';
  }
  if (svc.type === 'rankboost'){
    if (key === 'mode') return val ? '' : 'Vui lòng chọn chế độ chơi';
    if (key === 'currentGroup') return val ? '' : 'Vui lòng chọn nhóm rank hiện tại';
    if (key === 'currentDivision') return val ? '' : 'Vui lòng chọn bậc rank hiện tại';
    if (key === 'targetGroup') return val ? '' : 'Vui lòng chọn nhóm rank mục tiêu';
    if (key === 'targetDivision'){
      if (!val) return 'Vui lòng chọn bậc rank mục tiêu';
      const mode = (form.querySelector('[name="mode"]')||{}).value || '';
      const curG = (form.querySelector('[name="currentGroup"]')||{}).value || '';
      const curD = (form.querySelector('[name="currentDivision"]')||{}).value || '';
      const tgtG = (form.querySelector('[name="targetGroup"]')||{}).value || '';
      if (!mode || !curG || !curD || !tgtG) return '';
      const list = ffRankCanonicalList(mode);
      const curIdx = list.findIndex(r => r.groupId === curG && r.division === curD);
      const tgtIdx = list.findIndex(r => r.groupId === tgtG && r.division === val);
      if (curIdx !== -1 && tgtIdx !== -1){
        if (tgtIdx === curIdx) return 'Rank mục tiêu phải khác rank hiện tại';
        if (tgtIdx < curIdx) return 'Rank mục tiêu phải cao hơn rank hiện tại';
      }
      return '';
    }
  }
  if (svc.type === 'topsung'){ if (key === 'topTarget') return val ? '' : 'Vui lòng chọn mốc top'; }
  return '';
}
function calcFFPrice(form){
  const svcId = form.dataset.svcId;
  const svc = FF_SERVICES.find(s => s.id === svcId); if (!svc) return { price: 0, rows: [] };
  if (svc.type === 'rankboost'){
    const mode = (form.querySelector('[name="mode"]')||{}).value || '';
    const curG = (form.querySelector('[name="currentGroup"]')||{}).value || '';
    const curD = (form.querySelector('[name="currentDivision"]')||{}).value || '';
    const tgtG = (form.querySelector('[name="targetGroup"]')||{}).value || '';
    const tgtD = (form.querySelector('[name="targetDivision"]')||{}).value || '';
    if (!mode || !curG || !curD || !tgtG || !tgtD) return { price: 0, rows: [] };
    const list = ffRankCanonicalList(mode);
    const curIdx = list.findIndex(r => r.groupId === curG && r.division === curD);
    const tgtIdx = list.findIndex(r => r.groupId === tgtG && r.division === tgtD);
    if (curIdx === -1 || tgtIdx === -1 || tgtIdx <= curIdx) return { price: 0, rows: [] };
    const steps = FF_RANK_STEP_PRICES[mode] || []; if (!steps.length) return { price: 0, rows: [] };
    let total = 0; const rows = [];
    for (let i = curIdx; i < tgtIdx; i++){ const step = steps[i] || 0; rows.push({ from: list[i].display, to: list[i+1].display, price: step }); total += step; }
    return { price: total, rows, stepsCount: tgtIdx - curIdx };
  }
  if (svc.type === 'topsung'){
    const tgtEl = form.querySelector('[name="topTarget"]'); const val = tgtEl ? tgtEl.value : '';
    if (!val) return { price: 0, rows: [] };
    const found = TOP_GUN_PRICES.find(t => t.value === val); if (!found) return { price: 0, rows: [] };
    return { price: found.price, rows: [{ label: 'Mốc ' + found.label, price: found.price }] };
  }
  return { price: 0, rows: [] };
}
function renderFFPriceSummary(form){
  const out = form.querySelector('[data-price-summary]'); if (!out) return;
  const { price, rows } = calcFFPrice(form);
  if (!price || !rows.length){ out.innerHTML = '<div class="price-row total" style="border-top:none;margin-top:0;padding-top:0"><span>Giá dịch vụ</span><span>—</span></div>'; return; }
  if (rows.length > 5){ out.innerHTML = `<div class="price-row"><span>Mốc</span><span>${esc(rows[0].from)} → ${esc(rows[rows.length-1].to)}</span></div>
    <div class="price-row"><span>Số bậc</span><span>${rows.length} bậc</span></div>
    <div class="price-row total"><span>Tổng dự kiến</span><span>${fmtCoins(price)}</span></div>`; return; }
  const rowsHTML = rows.map(r => { const label = r.label || ('Bậc ' + r.from + ' → ' + r.to);
    return `<div class="price-row"><span>${esc(label)}</span><span>${fmtCoins(r.price)}</span></div>`; }).join('');
  out.innerHTML = rowsHTML + `<div class="price-row total"><span>Tổng dự kiến</span><span>${fmtCoins(price)}</span></div>`;
}

function toggleFav(type, id){
  const u = getCurrentUser();
  if (!u){ toast('Đăng nhập để lưu yêu thích', 'info'); go('#/login'); return; }
  if (isSuspended(u)){ toast('Tài khoản đã bị đình chỉ', 'error'); return; }
  const d = getData(); const arr = d.favorites[type]; const i = arr.indexOf(id);
  let added;
  if (i > -1){ arr.splice(i, 1); added = false; toast('Đã xoá khỏi yêu thích', 'info'); }
  else { arr.push(id); added = true; toast('Đã thêm vào yêu thích', 'success'); }
  saveData(d);
  $$('[data-action="fav"][data-type="'+type+'"][data-id="'+id+'"]').forEach(b => b.classList.toggle('on', added));
  if (parseHash().name === 'favorites') render();
}
function copyToClipboard(text, okMsg){
  const t = String(text || ''); if (!t) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(() => toast(okMsg || 'Đã sao chép', 'success'), () => fallbackCopy(t, okMsg)); }
    else fallbackCopy(t, okMsg);
  } catch(err){ fallbackCopy(t, okMsg); }
}
function fallbackCopy(text, okMsg){
  try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(okMsg || 'Đã sao chép', 'success');
  } catch(err){ toast('Không thể sao chép', 'info'); }
}

}

let adminTopupSearch = { ref: '', result: null, searched: false, filter: 'all' };

/* Chuẩn hoá 1 record topup (Supabase) về shape thống nhất */
function mapTopupRecord(t){
  return {
    id: t.id,
    userId: t.user_id,
    userName: t.user_name || t.user_email || '—',
    userEmail: t.user_email || '',
    amount: t.amount,
    method: t.method,
    refCode: t.ref_code,
    packageLabel: t.package_label || packageLabelForAmount(t.amount),
    status: t.status,
    createdAt: new Date(t.created_at).getTime(),
    reviewedAt: t.reviewed_at ? new Date(t.reviewed_at).getTime() : null
  };
}
function mapLocalTopupRecord(t){
  return {
    id: t.id,
    userId: t.userId,
    userName: t.userName || '—',
    userEmail: t.userEmail || '',
    amount: t.amount,
    method: t.method,
    refCode: t.refCode,
    packageLabel: t.packageLabel || packageLabelForAmount(t.amount),
    status: t.status,
    createdAt: t.createdAt,
    reviewedAt: t.reviewedAt || null
  };
}
function getAllTopupsMapped(){
  if (SUPABASE_ENABLED){
    return (GC.adminTopups || []).map(mapTopupRecord);
  }
  return (getLocalTopups() || []).map(mapLocalTopupRecord);
}
/* ⭐ Tìm CHÍNH XÁC (không partial). Nếu Supabase → dùng RPC/DB; nếu local → dò chuỗi bằng tuyệt đối. */
async function performTopupSearch(){
  const inp = document.getElementById('adminTopupSearchInput');
  const raw = inp ? inp.value : adminTopupSearch.ref;
  const ref = String(raw||'').trim();
  adminTopupSearch.ref = ref;
  if (!ref){
    adminTopupSearch.searched = false;
    adminTopupSearch.result = null;
    render();
    return;
  }
  const normRef = ref.toUpperCase();
  if (SUPABASE_ENABLED){
    showLoadingOverlay('Đang tìm kiếm', 'Vui lòng chờ...');
    try {
      const found = await DB.adminFindTopupByRef(normRef);
      hideLoadingOverlay();
      adminTopupSearch.searched = true;
      adminTopupSearch.result = found ? mapTopupRecord(found) : null;
      render();
    } catch(e){
      hideLoadingOverlay();
      toast('Lỗi tìm kiếm: ' + (e && e.message || e), 'error');
    }
  } else {
    const found = (getLocalTopups() || []).find(t => String(t.refCode || '').trim().toUpperCase() === normRef);
    adminTopupSearch.searched = true;
    adminTopupSearch.result = found ? mapLocalTopupRecord(found) : null;
    render();
  }
}
function clearTopupSearch(){
  adminTopupSearch.ref = '';
  adminTopupSearch.result = null;
  adminTopupSearch.searched = false;
  render();
}

    case 'open-topup-help': e.preventDefault(); openTopupHelpModal(); break;

    case 'open-contact-panel': {
      openModal(`<div class="row between" style="margin-bottom:12px"><h3 style="font-size:16px;font-weight:800">Liên hệ hỗ trợ</h3>
          <button type="button" class="icon-btn" data-action="modal-close">${ic('x')}</button></div>

        <div class="contact-panel-actions">
          <a class="btn btn-primary btn-block" href="${ZALO_SUPPORT_URL}" target="_blank" rel="noopener noreferrer">${ic('external-link')} Liên hệ qua Zalo</a>
          <a class="btn btn-ghost btn-block" href="${SERVICE_CONTACT_URL}" target="_blank" rel="noopener noreferrer">${ic('external-link')} Liên hệ qua Facebook</a>

      updateVietQRPreview();
      break; }
    case 'pay-copy-ref': copyToClipboard(payRefCode, 'Đã sao chép'); break;
    case 'pay-confirm-qr': {
      if (payLocked) return;
      const u = getCurrentUser();
      if (!u){ toast('Vui lòng đăng nhập', 'info'); break; }
      if (isSuspended(u)){ toast('Tài khoản đã bị đình chỉ', 'error'); break; }

      if (payAmount > CONFIG.MAX_TOPUP){ toast('Tối đa ' + fmtNumber(CONFIG.MAX_TOPUP) + ' xu', 'error'); break; }
      if (!payRefCode){ toast('Thiếu mã đơn. Vui lòng đóng và mở lại.', 'error'); break; }

        ? (GC.adminTopups || []).find(x => x.ref_code === payRefCode)

      if (existing){ toast('Yêu cầu này đã được gửi trước đó', 'info'); break; }

      payLocked = true;
      const orig = t.innerHTML;
      t.innerHTML = `<span class="btn-spinner"></span><span>Đang gửi...</span>`;
      t.disabled = true;

      let res;
      if (SUPABASE_ENABLED){
        res = await DB.createTopupRequest(payAmount, 'vietqr', payRefCode);
      } else {
        try {
          const list = getLocalTopups();
          list.unshift({
            id: uid('tp'),
            userId: u.id, userName: u.username, userEmail: u.email,
            amount: payAmount, method: 'vietqr', refCode: payRefCode,
            packageLabel: packageLabelForAmount(payAmount),
            bankSnapshot: getBankConfig(),
            status: 'awaiting_verification',

          logAdminAction({ action: 'create_topup', targetUserId: u.id, amount: payAmount });
          res = { ok: true };
        } catch(err){ res = { ok: false, error: err.message }; }
      }

      payLocked = false;
      if (!res.ok){
        toast('Lỗi: ' + res.error, 'error');
        t.innerHTML = orig; t.disabled = false; refreshIcons(); break;

      const submittedRef = payRefCode, submittedAmt = payAmount;

      updateNotifBadge();

      render();
      showTopupSubmittedModal(submittedAmt, submittedRef);

    case 'logout': confirmLogoutModal(); break;
    case 'logout-confirm': { await logoutUser(); closeModal(); toast('Đã đăng xuất', 'success'); go('#/home'); await renderWithRefresh(); break; }
    case 'drawer-logout': break;
    case 'google': toast('Đăng nhập Google chưa cấu hình', 'info'); break;

      const { error } = await sb.auth.resetPasswordForEmail(u.email);

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'globalSearch'){ showSuggestions(el.value); }
  if (el.id === 'adminSearch'){ showAdminSearchResults(el.value); }
  // ⭐ Giữ đồng bộ với state nhưng KHÔNG tự tìm (phải bấm nút hoặc Enter)
  if (el.id === 'adminTopupSearchInput'){ adminTopupSearch.ref = el.value; }
  if (el.id === 'heroOverlayRange'){ const valEl = document.getElementById('heroOverlayValue'); if (valEl) valEl.textContent = Math.round(Number(el.value)*100) + '%'; }
  if (el.matches && el.matches('[data-numeric]')){
    const v = el.value; let cleaned = v.replace(/\D/g, '');
    if (cleaned !== v){ const start = el.selectionStart; const diff = v.length - cleaned.length; el.value = cleaned;
      try { const np = Math.max(0, (start||cleaned.length)-diff); el.setSelectionRange(np,np); } catch(e2){} }
  }
  if (el.id === 'addCoinsAmount'){
    const prevPos = el.selectionStart, prevLen = el.value.length;
    const { formatted } = applyThousandsSeparator(el.value);
    if (el.value !== formatted){ el.value = formatted; const added = formatted.length - prevLen;
      let np = prevPos + added; if (np < 0) np = 0; if (np > formatted.length) np = formatted.length;
      try { el.setSelectionRange(np,np); } catch(e2){} }
  }
  if (el.id === 'adminUserSearch'){ adminUsersFilter.q = el.value; const pos = el.selectionStart; render(); const n = $('#adminUserSearch'); if (n){ n.focus(); try { n.setSelectionRange(pos,pos); } catch(e2){} } }
  if (el.id === 'adminOrderSearch'){ adminOrdersFilter.q = el.value; const pos = el.selectionStart; render(); const n = $('#adminOrderSearch'); if (n){ n.focus(); try { n.setSelectionRange(pos,pos); } catch(e2){} } }

  if (el.id === 'annTitle'){ adminAnnounceDraft.title = el.value; }
  if (el.id === 'annBody'){ adminAnnounceDraft.body = el.value; }
});
document.addEventListener('paste', e => {
  const el = e.target;
  if (el && el.matches && (el.matches('[data-numeric]') || el.id === 'addCoinsAmount' || el.id === 'payAmountInput')){
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text') || '';
    let cleaned = String(text).replace(/\D/g, '');
    const start = el.selectionStart || 0, end = el.selectionEnd || 0; const v = el.value;
    el.value = v.slice(0, start) + cleaned + v.slice(end);
    const np = start + cleaned.length; try { el.setSelectionRange(np, np); } catch(e2){}
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
});

function makeOrderId(){
  const d = getData();
  const existing = new Set((d && d.orders ? d.orders : []).map(o => String(o.id)));
  for (let i = 0; i < 300; i++){ const id = 'WQ' + Math.floor(10000 + Math.random() * 90000); if (!existing.has(id)) return id; }
  return 'WQ' + Date.now().toString().slice(-5);
}
function createFFOrderLocal(svc, orderFields, price){
  const d = getData(); if (!d) return null;
  if (d.wallet.balance < price) return null;
  const order = Object.assign({ id: makeOrderId(), gameId:'freefire', serviceId: svc.id, gameName:'FF',
    serviceName: svc.name, server:'Việt Nam', contactMethod:'Zalo / Facebook', contactInfo: ZALO_ADMIN_PHONE,
    notes:'', base: price, addons: 0, total: price, status:'awaiting_account',
    createdAt: Date.now(), updatedAt: Date.now(), providerId: svc.id }, orderFields);
  d.wallet.balance -= price;
  d.wallet.transactions.unshift({ id: uid('t'), label: 'Thanh toán đơn ' + fmtOrderId(order.id), amount: -price, time: Date.now(), ref:'ORDER', orderId: order.id });
  d.orders.unshift(order);
  d.notifications.unshift({ id: uid('n'), title: 'Đơn hàng đã được tạo', body: 'Đơn ' + fmtOrderId(order.id) + ' đang chờ bàn giao tài khoản.', time: Date.now(), read:false, type:'order-created', orderId: order.id });
  const ok = saveData(d); return ok ? order : null;
}

  if (o.status === 'cancelled' || o.status === 'completed'){ toast('Không thể huỷ ở trạng thái này', 'info'); return; }
  const refund = o.total || 0;

    ${refund > 0 ? `<div class="info-box gold" style="margin:12px 0 0">${ic('info')}<span>Số tiền <strong style="color:var(--gold)">${fmtCoins(refund)}</strong> sẽ được hoàn lại.</span></div>` : ''}

async function performCancelOrder(orderId){
  if (SUPABASE_ENABLED){
    const r = await DB.cancelMyOrder(orderId);
    if (!r.ok){ toast('Lỗi: ' + r.error, 'error'); return; }
    closeModal(); toast('Đã huỷ đơn và hoàn xu', 'success');
    await refreshUserCache(); render(); return;
  }
  const d = getData(); if (!d) return;
  const o = d.orders.find(x => x.id === orderId); if (!o || o.status === 'cancelled' || o.status === 'completed') return;
  const refund = o.total || 0; o.status = 'cancelled'; o.updatedAt = Date.now(); o.refunded = refund > 0;
  if (refund > 0){ d.wallet.balance += refund; d.wallet.transactions.unshift({ id: uid('t'), label: 'Hoàn tiền đơn ' + fmtOrderId(o.id), amount: refund, time: Date.now(), ref:'REFUND', orderId: o.id }); }
  saveData(d); toast('Đã huỷ đơn' + (refund > 0 ? ' và hoàn ' + fmtCoins(refund) : ''), 'success');
  updateNotifBadge(); closeModal(); render();
}

async function adminUpdateOrderStatus(orderId, newStatus){
  if (SUPABASE_ENABLED){ const r = await DB.adminUpdateOrderStatus(orderId, newStatus); return r.ok; }
  const users = LS.get(K.users, []) || [];
  for (const u of users){
    const data = LS.get(K.data(u.id), null); if (!data) continue;

    if (o){ o.status = newStatus; o.updatedAt = Date.now(); LS.set(K.data(u.id), data); return true; }

  const totalAdminGrants = tx.filter(t => t.ref === 'ADMIN_GRANT').reduce((s,t) => s + t.amount, 0);
  return `<div class="adm-section" style="margin-top:2px">

}
function adminTxItem(t){
  const isIn = t.amount > 0;
  const isRefund = t.ref === 'REFUND';
  const isAdminGrant = t.ref === 'ADMIN_GRANT';
  let type, iconName, cls;
  if (isAdminGrant){ type='Admin cộng'; iconName='key'; cls='admin'; }
  else if (isRefund){ type='Hoàn xu'; iconName='rotate-ccw'; cls='refund'; }
  else if (isIn){ type='Nạp xu'; iconName='coins'; cls='in'; }
  else { type='Thanh toán'; iconName='receipt'; cls='out'; }
  return `<div class="adm-item">
    <div class="adm-item-top" style="margin-bottom:7px">
      <div class="tx-ic ${cls}" style="width:32px;height:32px;border-radius:9px">${ic(iconName)}</div>

        <div class="adm-item-sub">${esc(t.userName||'—')}</div></div>

}

let lastPath = null;
function render(){
  const route = parseHash();
  const path = location.hash || '#/home';
  const changed = path !== lastPath;
  lastPath = path;
  const adminMode = isAdminSession();
  document.body.classList.toggle('admin-mode', adminMode);
  $('#topbar').classList.toggle('admin-topbar', adminMode);
  if (adminMode){
    if (route.name !== 'admin'){ go('#/admin'); return; }
    document.title = 'Quản trị — LENTRINH';
    renderAdminChrome();
    $('#view').innerHTML = viewAdmin(route);
    initCustomSelects(); initFormValidation(); refreshIcons();
    if (changed) window.scrollTo(0, 0);
    return;
  }
  if (route.name === 'admin'){ go('#/login'); return; }
  const currentUser = getCurrentUser();
  const suspendedNow = currentUser && currentUser.suspended;
  if (suspendedNow && PROTECTED.indexOf(route.name) > -1){
    document.title = 'Tài khoản bị đình chỉ — LENTRINH';
    renderChrome(); $('#view').innerHTML = viewSuspended(); refreshIcons();
    if (changed) window.scrollTo(0, 0);
    return;
  }
  if (route.name !== 'freefire'){ ffExpandedService = null; }
  document.title = PAGE_TITLES[route.name] || 'LENTRINH';
  closeSuggest();
  renderChrome();
  const view = $('#view');
  if (PROTECTED.indexOf(route.name) > -1 && !currentUser){
    view.innerHTML = authRequiredView(); refreshIcons();
    if (changed) window.scrollTo(0, 0);
    return;
  }
  view.innerHTML = routeHTML(route);
  afterRender(route);
  refreshIcons();
  if (changed) window.scrollTo(0, 0);
  updateNotifBadge();
}
function afterRender(route){
  refreshDateDisplays(); initCustomSelects(); initFormValidation();
  initFFForms(); initRankBoostCascades(); bindNotificationButtons(); initCarousel();
  const routeName = route ? route.name : parseHash().name;
  if (routeName !== 'freefire'){ if (_carouselTimer){ clearInterval(_carouselTimer); _carouselTimer = null; } }
}

window.addEventListener('hashchange', async () => {
  closeNotificationPanel(); closeAdminNotifPanel(); closeModal();
  if (isDrawerOpen()) closeDrawer();
  await render();
});

let isRegistering = false;
document.addEventListener('submit', async e => {
  const form = e.target;
  const kind = form.dataset.form;
  if (!kind) return;
  e.preventDefault();

  if (kind === 'login'){
    if (form.dataset.submitting === '1') return;
    if (!validateBasicForm(form, true)) return;
    form.dataset.submitting = '1';
    const btn = form.querySelector('button[type="submit"]');
    setButtonLoading(btn, 'Đang đăng nhập...');
    const email = form.email.value.trim(), pass = form.password.value;
    try {
      const res = await loginUser(email, pass);
      if (!res.ok){ form.dataset.submitting = '0'; restoreButton(btn);
        if (res.error.toLowerCase().includes('email')) setFieldError(form.querySelector('[data-field="email"]'), res.error);
        else if (res.error.includes('Mật khẩu')) setFieldError(form.querySelector('[data-field="password"]'), res.error);
        else toast(res.error, 'error');
        return; }
      toast('Chào mừng ' + (res.user ? res.user.username : (res.isAdmin ? 'quản trị viên' : '')), 'success');
      go(res.isAdmin ? '#/admin' : '#/home');
      await renderWithRefresh();
    } catch(err){ form.dataset.submitting = '0'; restoreButton(btn); toast('Lỗi: ' + err.message, 'error'); }
    return;
  }
  if (kind === 'register'){
    if (isRegistering) return;
    if (!validateBasicForm(form, true)) return;
    isRegistering = true;
    const btn = form.querySelector('button[type="submit"]');
    setButtonLoading(btn, 'Đang tạo tài khoản...');
    const username = form.username.value.trim(); const email = form.email.value.trim(); const password = form.password.value;
    try {
      const res = await registerUser({ username, email, password });
      isRegistering = false;
      if (!res.ok){ restoreButton(btn);
        if (res.error.includes('Email')) setFieldError(form.querySelector('[data-field="email"]'), res.error);
        else if (res.error.includes('Tên hiển thị')) setFieldError(form.querySelector('[data-field="username"]'), res.error);
        else toast(res.error, 'error'); return; }
      if (res.needsConfirm){ toast('Kiểm tra email để xác nhận tài khoản', 'info'); go('#/login'); await renderWithRefresh(); return; }
      toast('Đã tạo tài khoản', 'success'); go('#/home'); await renderWithRefresh();
    } catch(err){ isRegistering = false; restoreButton(btn); toast('Lỗi: ' + err.message, 'error'); }
    return;
  }
  if (kind === 'ff-order'){
    const svcId = form.dataset.svcId;
    const svc = FF_SERVICES.find(s => s.id === svcId);
    if (!svc){ toast('Không tìm thấy dịch vụ', 'error'); return; }
    const u = getCurrentUser();
    if (!u){ toast('Vui lòng đăng nhập', 'info'); go('#/login'); return; }
    if (isSuspended(u)){ toast('Tài khoản đã bị đình chỉ', 'error'); return; }
    if (!validateFFForm(form, true)) return;
    const playerId = (form.playerId.value || '').trim();
    const calc = calcFFPrice(form); const price = calc.price;
    if (!price || price <= 0){ toast('Vui lòng chọn đầy đủ', 'error'); return; }
    saveCurrentFFDraft(form);
    let orderFields = { playerId };
    if (svc.type === 'rankboost'){
      const mode = (form.querySelector('[name="mode"]')||{}).value || '';
      const curG = (form.querySelector('[name="currentGroup"]')||{}).value || '';
      const curD = (form.querySelector('[name="currentDivision"]')||{}).value || '';
      const tgtG = (form.querySelector('[name="targetGroup"]')||{}).value || '';
      const tgtD = (form.querySelector('[name="targetDivision"]')||{}).value || '';
      const modeLabel = (FF_MODE_HIERARCHY[mode]||{}).label || '';
      Object.assign(orderFields, { gameMode:mode, gameModeLabel:modeLabel, currentGroup:curG, currentRank:curD, targetGroup:tgtG, targetRank:tgtD, rankSteps: calc.stepsCount || 0 });
    } else if (svc.type === 'topsung'){
      const tgt = (form.topTarget.value || '').trim();
      const found = TOP_GUN_PRICES.find(x => x.value === tgt);
      orderFields.currentRank = '—';
      orderFields.targetRank = found ? found.label : tgt;
    }
    const checkData = getData();
    if (!checkData){ toast('Không thể đọc ví.', 'error'); return; }
    const balance = checkData.wallet.balance || 0;
    if (balance < price){ showInsufficientBalanceModal(balance, price); return; }
    const btn = form.querySelector('button[type="submit"]');
    if (btn){ btn.disabled = true; btn.style.opacity = '.6'; }
    showLoadingOverlay('ĐANG XỬ LÝ ĐƠN HÀNG', 'Vui lòng chờ...');
    try {
      if (SUPABASE_ENABLED){
        const res = await DB.createOrder(svc.id, svc.name, playerId, price, orderFields);
        hideLoadingOverlay();
        if (!res.ok){ if (btn){ btn.disabled = false; btn.style.opacity = ''; }
          if (res.error.includes('insufficient_balance')) showInsufficientBalanceModal(balance, price);
          else toast('Lỗi: ' + res.error, 'error'); return; }
        clearFormDraft(u.id); ffExpandedService = null;
        await refreshUserCache(); render(); updateNotifBadge();
        const order = GC.orders.find(o => o.id === res.orderId);
        if (order) showOrderSuccessModal(order);
        toast('Đã tạo đơn #' + res.orderId, 'success');
      } else {
        await new Promise(r => setTimeout(r, 1200));
        const d2 = getData();
        if (!d2 || d2.wallet.balance < price){ hideLoadingOverlay();
          if (d2) showInsufficientBalanceModal(d2.wallet.balance, price);
          if (btn){ btn.disabled = false; btn.style.opacity = ''; } return; }
        const order = createFFOrderLocal(svc, orderFields, price);
        hideLoadingOverlay();
        if (!order){ toast('Không thể tạo đơn.', 'error'); if (btn){ btn.disabled = false; btn.style.opacity = ''; } return; }
        clearFormDraft(u.id); ffExpandedService = null; render(); updateNotifBadge(); showOrderSuccessModal(order);
        toast('Đã tạo đơn ' + fmtOrderId(order.id), 'success');
      }
    } catch(err){ hideLoadingOverlay(); if (btn){ btn.disabled = false; btn.style.opacity = ''; } toast('Lỗi: ' + err.message, 'error'); }
    return;
  }
  if (kind === 'ticket'){ if (!validateBasicForm(form, true)) return;
    form.reset(); form.querySelectorAll('.field[data-field]').forEach(f => { f.dataset.touched = ''; setFieldError(f, ''); });
    toast('Đã gửi yêu cầu', 'success'); return; }
  if (kind === 'edit-profile'){
    if (!validateBasicForm(form, true)) return;
    const u = getCurrentUser(); if (!u) return;
    const newName = (form.username.value || '').trim(); const updates = {};
    const nameInput = form.querySelector('input[name="username"]');
    if (nameInput && !nameInput.disabled && newName !== u.username){
      const check = canChangeName(u);
      if (!check.ok){ setFieldError(form.querySelector('[data-field="username"]'), 'Đổi tên 1 lần mỗi 7 ngày. Còn lại: ' + fmtRemaining(check.remainingMs)); return; }
      if (!SUPABASE_ENABLED){ const users = getUsers();
        if (users.some(x => x.id !== u.id && String(x.username||'').toLowerCase() === newName.toLowerCase())){ setFieldError(form.querySelector('[data-field="username"]'), 'Tên này đã được sử dụng'); return; } }
      updates.username = newName;
    }
    if (!Object.keys(updates).length){ toast('Không có thay đổi', 'info'); closeModal(); return; }
    const ok = await updateUser(updates);
    if (!ok){ toast('Không thể lưu', 'error'); return; }
    closeModal(); toast('Đã cập nhật hồ sơ', 'success'); await renderWithRefresh(); return;
  }
  if (kind === 'change-password'){
    if (SUPABASE_ENABLED){ toast('Ở Supabase, đổi mật khẩu qua email đặt lại.', 'info'); closeModal(); return; }
    if (!validateBasicForm(form, true)) return;
    const u = getCurrentUser(); if (!u) return;
    const current = form.current.value, next = form.next.value;
    if (demoHash(current) !== u.pass){ setFieldError(form.querySelector('[data-field="current"]'), 'Mật khẩu hiện tại không đúng'); return; }
    if (next === current){ setFieldError(form.querySelector('[data-field="next"]'), 'Mật khẩu mới phải khác'); return; }
    if (!(await updateUser({ pass: demoHash(next) }))){ toast('Không thể cập nhật', 'error'); return; }
    closeModal(); toast('Đã cập nhật mật khẩu', 'success'); return;
  }
  if (kind === 'admin-verify-suspend'){
    const userId = form.dataset.userId;
    if (SUPABASE_ENABLED){ const res = await DB.adminSetSuspended(userId, true);
      if (!res.ok){ toast('Lỗi: ' + res.error, 'error'); return; } }
    else { if (!performSuspendUser(userId)){ toast('Không thể đình chỉ', 'error'); return; } }
    closeModal(); toast('Đã đình chỉ', 'success'); await renderWithRefresh(); return;
  }
  if (kind === 'admin-private-message'){ if (!validateBasicForm(form, true)) return; return; }
  if (kind === 'admin-bank-config'){
    if (!isAdminSession()){ toast('Chỉ quản trị viên', 'error'); return; }
    const cfg = {
      bankId:        (form.bankId.value || '').trim().toUpperCase(),
      bankName:      (form.bankName.value || '').trim(),
      accountNumber: (form.accountNumber.value || '').trim().replace(/\s+/g,''),
      accountHolder: (form.accountHolder.value || '').trim(),
      defaultDescription: (form.defaultDescription.value || '').trim()
    };
    let bad = false;
    const setErr = (name, msg) => { const f = form.querySelector(`[data-field="${name}"]`); if (f) setFieldError(f, msg); bad = true; };
    ['bankId','bankName','accountNumber','accountHolder'].forEach(n => {
      const f = form.querySelector(`[data-field="${n}"]`); if (f) setFieldError(f, '');
    });
    if (!/^[A-Z0-9]{2,20}$/.test(cfg.bankId)) setErr('bankId', 'Mã ngân hàng không hợp lệ (chữ và số, 2–20 ký tự).');
    if (cfg.bankName.length < 2)              setErr('bankName', 'Vui lòng nhập tên ngân hàng.');
    if (!/^\d{6,25}$/.test(cfg.accountNumber)) setErr('accountNumber', 'Số tài khoản chỉ gồm 6–25 chữ số.');
    if (cfg.accountHolder.length < 2)         setErr('accountHolder', 'Vui lòng nhập chủ tài khoản.');
    if (bad) return;

    if (SUPABASE_ENABLED){
      const r = await DB.adminSetSetting('bank', cfg);
      if (!r.ok){ toast('Lỗi: ' + r.error, 'error'); return; }
      GC.settings.bank = cfg;
    } else {
      saveBankConfig(cfg);
    }
    toast('Đã lưu cấu hình ngân hàng', 'success');
    render();
    return;
  }
});

  ensureAdminHash();
  if (!location.hash){ location.hash = '#/home'; }

  await renderWithRefresh();
  refreshIcons();
  window.addEventListener('load', refreshIcons);
  setTimeout(refreshIcons, 400);
  setTimeout(refreshIcons, 1500);
})();
</script>
