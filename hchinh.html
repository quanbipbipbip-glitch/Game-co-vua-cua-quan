
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#171C28" />
<title>Webcuaquan — Dịch vụ cày rank Free Fire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* ============ THEME ============ */
:root{
  --bg:#171C28;--bg-2:#1D2535;--card:#242E40;--card-hi:#2B364A;
  --border:#354258;--border-hi:#4A5872;
  --text:#F1F5F9;--muted:#A7B3C7;--muted-2:#7A8699;

  --blue:#60A5FA;--cyan:#4DD0E1;--purple:#A78BFA;--teal:#2DD4BF;
  --green:#4ADE80;--orange:#FB923C;--pink:#F472B6;--gold:#FBBF24;

  --accent:var(--blue);--accent-soft:rgba(96,165,250,.14);

  --danger:#F87171;--warn:var(--orange);--success:var(--green);

  --r:12px;--r-lg:16px;--r-xl:20px;
  --shadow:0 8px 24px -14px rgba(0,0,0,.55);
  --shadow-lg:0 16px 40px -20px rgba(0,0,0,.6);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:14px;line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(720px 500px at 6% -10%, rgba(96,165,250,.10), transparent 60%),
    radial-gradient(640px 500px at 100% 4%, rgba(167,139,250,.09), transparent 60%),
    radial-gradient(700px 480px at 50% 120%, rgba(45,212,191,.06), transparent 65%)}
body.no-scroll{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.02em;font-weight:700;color:var(--text)}
p{margin:0}
img{max-width:100%}
::selection{background:rgba(96,165,250,.35);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3A4761;border-radius:8px;border:3px solid transparent;background-clip:content-box}

button,.btn,.nav-item,.bn-item,.tab,.chip,.icon-btn,.fav-btn,.avatar,.pay-chip,.wallet-chip,
.rank-row,.faq-q,.contact-link,.orders-btn,.game-card,.order-card,.row-item,.notif-item,
.cd-select-trigger,.cd-select-option,.adm-action,.adm-item,.adm-chip,.svc-contact,
.lb-row,.coin-badge,.notif-mark-btn,.adm-announce-item,.adm-user-status,.adm-user-actions,
.carousel-dot,.carousel-slide,.adm-img-actions,.drawer-item,.drawer-close,.hamburger-btn{
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
.mono,.copyable,input,textarea,select,.selectable,.terms-section p,.terms-section li{
  -webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}
input,textarea,select{-webkit-touch-callout:default}
svg.lucide{width:17px;height:17px;flex:none;stroke-width:1.9}
i[data-lucide]{display:inline-block;width:17px;height:17px;flex:none}
i.icon-fb{display:inline-grid;place-items:center;font-style:normal;font-size:13px;line-height:1;opacity:.85}
.btn svg.lucide,.btn i[data-lucide]{width:15px;height:15px}
.icon-btn svg.lucide,.icon-btn i[data-lucide]{width:18px;height:18px}
.bottomnav svg.lucide,.bottomnav i[data-lucide]{width:20px;height:20px}

.app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:16px 14px 108px}
@media(min-width:1024px){
  .sidebar{display:flex;flex-direction:column;width:248px;flex:none;position:sticky;top:0;height:100vh;padding:20px 12px 14px;
    border-right:1px solid var(--border);background:linear-gradient(180deg,#1D2535,#171C28)}
  .bottomnav{display:none}
  .view{padding:24px 30px 56px}
}

/* BRAND */
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#60A5FA,#A78BFA);color:#0F1420;overflow:hidden;padding:0;
  box-shadow:0 6px 18px -10px rgba(96,165,250,.75)}
.brand-mark.has-logo{background:#1D2535;border:1px solid var(--border);box-shadow:none}
.brand-mark.has-logo img{width:100%;height:100%;object-fit:contain;display:block;padding:3px}
.brand-mark svg.lucide,.brand-mark i[data-lucide]{width:18px;height:18px}
.brand-text{font-weight:800;font-size:15px;letter-spacing:.03em;color:var(--text)}
.brand-text em{font-style:normal;font-weight:800;
  background:linear-gradient(100deg,#60A5FA,#A78BFA 60%,#4DD0E1);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sidebar .brand{margin-bottom:20px}

/* SIDEBAR */
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  color:var(--muted);font-size:13.5px;font-weight:600;transition:.16s var(--ease);position:relative}
.nav-item:hover{background:var(--card-hi);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(96,165,250,.16),rgba(96,165,250,.03));color:var(--text)}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 4px 4px 0;background:var(--blue);box-shadow:0 0 12px rgba(96,165,250,.6)}
.nav-item.active svg.lucide{color:var(--blue)}
.sidebar-foot{margin-top:auto;padding:12px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--card);font-size:11px;color:var(--muted);line-height:1.5}
.sidebar-foot strong{display:block;color:var(--text);font-size:11.5px;margin-bottom:3px}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 12px;border-bottom:1px solid var(--border);background:rgba(23,28,40,.85);backdrop-filter:blur(16px)}
@media(min-width:1024px){.topbar{padding:11px 30px;flex-wrap:nowrap}}
.hamburger-btn{display:grid}
@media(min-width:1024px){.hamburger-btn{display:none}}
.brand-mobile{display:flex;align-items:center;gap:8px}
@media(min-width:1024px){.brand-mobile{display:none}}
.brand-mobile .brand-text{font-size:14.5px}
.brand-mobile .brand-mark{width:30px;height:30px;border-radius:9px}

.search-wrap{position:relative;order:3;width:100%;display:flex;align-items:center}
@media(min-width:1024px){.search-wrap{order:0;width:auto;flex:1;max-width:400px}}
.search-wrap > svg.lucide,.search-wrap > i[data-lucide]{position:absolute;left:12px;color:var(--muted-2);width:16px;height:16px;pointer-events:none}
.search-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px 10px 36px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;transition:.16s var(--ease)}
.search-input::placeholder{color:var(--muted-2)}
.search-input:focus{border-color:var(--blue);background:var(--card-hi);box-shadow:0 0 0 3px rgba(96,165,250,.18)}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:90;background:#222B3E;
  border:1px solid var(--border-hi);border-radius:var(--r);box-shadow:var(--shadow-lg);
  padding:6px;display:none;max-height:60vh;overflow:auto}
.suggest.open{display:block;animation:pop .16s var(--ease)}
.sug-group{padding:6px 8px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);font-weight:700}
.sug-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;transition:.15s;cursor:pointer}
.sug-item:hover{background:var(--card-hi)}
.sug-item .sug-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:10.5px;font-weight:800;color:#0F1420}
.sug-item .sug-t{font-size:13px;font-weight:600;color:var(--text)}
.sug-item .sug-s{font-size:11px;color:var(--muted)}

.top-actions{display:flex;align-items:center;gap:7px;margin-left:auto}
.icon-btn{position:relative;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--border);color:var(--muted);transition:.16s var(--ease)}
.icon-btn:hover{background:var(--card-hi);color:var(--text);border-color:var(--border-hi)}
.icon-btn:active{transform:scale(.94)}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--pink);color:#0F1420;font-size:9.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.wallet-chip{display:none;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:10px;
  background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.35);color:var(--teal);
  font-size:12.5px;font-weight:700;transition:.16s var(--ease)}
.wallet-chip:hover{border-color:var(--teal)}
@media(min-width:520px){.wallet-chip{display:flex}}
.wallet-chip .coin-icon{width:15px;height:15px}
.avatar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;
  font-weight:800;font-size:13px;color:#fff;letter-spacing:.02em;border:1px solid var(--border);
  transition:.16s var(--ease);overflow:hidden}
.avatar:hover{transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(0,0,0,.7)}
.avatar-img{width:100%;height:100%;object-fit:cover;display:block}
.pay-chip{display:flex;align-items:center;justify-content:center;gap:0;height:38px;width:38px;padding:0;border-radius:10px;
  background:linear-gradient(135deg,var(--blue),#3B82F6);border:1px solid var(--blue);color:#0F1420;font-size:12.5px;font-weight:800;
  transition:.16s var(--ease);flex:none;box-shadow:0 6px 16px -10px rgba(96,165,250,.7)}
.pay-chip:hover{transform:translateY(-1px);box-shadow:0 10px 22px -12px rgba(96,165,250,.9)}
.pay-chip:active{transform:scale(.95)}
.pay-chip .coin-icon{width:16px;height:16px}
.pay-chip span{display:none}
@media(min-width:480px){.pay-chip{width:auto;padding:0 12px;gap:6px}.pay-chip span{display:inline}}

/* COIN */
.coin-icon{display:inline-block;vertical-align:middle;flex:none;filter:drop-shadow(0 2px 4px rgba(251,191,36,.35))}
.coin-icon svg{display:block;width:100%;height:100%}
.coin-inline{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--gold);white-space:nowrap}
.coin-inline .coin-icon{width:13px;height:13px}
.coin-price{display:inline-flex;align-items:center;gap:5px;color:var(--gold);font-weight:800;font-size:13.5px}
.coin-price .coin-icon{width:13px;height:13px}
.coin-big{display:flex;align-items:center;gap:10px;font-size:clamp(24px,6.5vw,34px);font-weight:800;
  letter-spacing:-.03em;color:var(--gold);text-shadow:0 4px 22px rgba(251,191,36,.25)}
.coin-big .coin-icon{width:clamp(26px,6.5vw,36px);height:clamp(26px,6.5vw,36px)}
.wallet-num{font-size:11.5px;color:var(--muted);font-weight:600}

/* NOTIF */
.notif-panel{position:fixed;top:62px;right:12px;left:12px;z-index:9000;background:#1F2838;
  border:1px solid var(--border-hi);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  display:none;overflow:hidden;max-height:calc(100vh - 86px);flex-direction:column}
.notif-panel.open{display:flex;animation:pop .18s var(--ease)}
@media(min-width:640px){.notif-panel{left:auto;width:380px;right:18px}}
@media(min-width:1024px){.notif-panel{top:66px;right:30px}}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.notif-head h4{font-size:13.5px;display:flex;align-items:center;gap:7px}
.notif-mark-btn{background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.35);color:var(--blue);
  border-radius:8px;padding:5px 9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s}
.notif-mark-btn:hover{background:rgba(96,165,250,.24)}
.notif-mark-btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
.notif-count-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.35);color:var(--gold);
  font-size:10px;font-weight:800;letter-spacing:.03em}
.notif-list{overflow-y:auto;flex:1}
.notif-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(53,66,88,.5);transition:.15s;align-items:flex-start}
.notif-item:last-child{border-bottom:none}
.notif-item.nav{cursor:pointer}
.notif-item:hover{background:var(--card)}
.notif-item.unread{background:rgba(96,165,250,.06)}
.notif-item.unread .n-title{color:var(--text)}
.notif-item .notif-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:rgba(96,165,250,.14);color:var(--blue)}
.notif-item .notif-ico.private{background:rgba(167,139,250,.16);color:var(--purple)}
.notif-item .notif-ico.system{background:rgba(77,208,225,.14);color:var(--cyan)}
.notif-item .notif-ico svg.lucide{width:15px;height:15px}
.notif-item .notif-body{flex:1;min-width:0}
.notif-item .n-title{font-size:13px;font-weight:700;color:var(--muted);line-height:1.3}
.notif-item .n-body{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;word-break:break-word}
.notif-item .n-time{font-size:10.5px;color:var(--muted-2);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.notif-item .n-tag{display:inline-block;padding:1px 6px;border-radius:4px;background:rgba(96,165,250,.14);color:var(--blue);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.notif-item .n-tag.private{background:rgba(167,139,250,.16);color:var(--purple)}
.notif-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 18px;gap:6px}
.notif-empty .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.28);color:var(--blue);margin-bottom:4px}
.notif-empty .ic svg.lucide{width:20px;height:20px}
.notif-empty h4{font-size:13px;font-weight:800}
.notif-empty p{font-size:12px;color:var(--muted-2);max-width:220px;line-height:1.5}
.notif-foot{border-top:1px solid var(--border);padding:10px 14px;text-align:center}
.notif-foot a{font-size:12px;font-weight:700;color:var(--blue)}

/* BOTTOM NAV */
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:70;display:flex;justify-content:space-around;
  padding:6px 5px calc(6px + env(safe-area-inset-bottom));background:rgba(29,37,53,.96);backdrop-filter:blur(18px);
  border-top:1px solid var(--border)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;
  color:var(--muted-2);font-size:9.5px;font-weight:700;letter-spacing:.01em;transition:.16s var(--ease)}
.bn-item.active{color:var(--blue)}
.bn-item.active svg.lucide{filter:drop-shadow(0 0 8px rgba(96,165,250,.55))}
.bn-item:active{transform:scale(.93)}

/* CARD */
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
  transition:.2s var(--ease)}
.card.pad{padding:14px}
.card:hover{border-color:var(--border-hi)}
.stretched{position:absolute;inset:0;z-index:3;border-radius:inherit}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
  border-radius:11px;padding:11px 16px;font-weight:700;font-size:13.5px;color:var(--text);background:transparent;
  transition:.16s var(--ease);white-space:nowrap;letter-spacing:-.01em;min-height:42px}
.btn:active{transform:scale(.975)}
.btn-primary{background:linear-gradient(135deg,#60A5FA,#3B82F6);color:#0B1220;border-color:#60A5FA;
  box-shadow:0 8px 20px -14px rgba(96,165,250,.9)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 24px -14px rgba(96,165,250,1)}
.btn-coin{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#2A1A00;border-color:#FBBF24;
  box-shadow:0 8px 20px -14px rgba(251,191,36,.85)}
.btn-coin:hover{transform:translateY(-1px);box-shadow:0 12px 24px -14px rgba(251,191,36,1)}
.btn-ghost{background:var(--card);border-color:var(--border-hi);color:var(--text)}
.btn-ghost:hover{background:var(--card-hi);border-color:#55668A}
.btn-danger{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.4);color:#FCA5A5}
.btn-danger:hover{background:rgba(248,113,113,.22)}
.btn-success{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.4);color:#86EFAC}
.btn-success:hover{background:rgba(74,222,128,.22)}
.btn-sm{padding:8px 13px;font-size:12.5px;border-radius:9px;min-height:36px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;filter:grayscale(.3);cursor:not-allowed;pointer-events:none;box-shadow:none;transform:none}

.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.32);font-size:11px;font-weight:700;
  color:var(--blue);letter-spacing:.02em}
.pill svg.lucide{width:13px;height:13px}
.meta{font-size:12px;color:var(--muted);margin-top:3px}
.tiny{font-size:11px;color:var(--muted-2)}
.price{font-size:14px;font-weight:800;color:var(--text);letter-spacing:-.02em}
.grad{background:linear-gradient(100deg,#60A5FA,#A78BFA 50%,#4DD0E1);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;align-items:center;gap:9px}
.between{justify-content:space-between}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.02em}
.link{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--blue)}
.link svg.lucide{width:13px;height:13px}
.muted{color:var(--muted)}
.copy-inline{display:inline-flex;align-items:center;gap:5px;max-width:100%;min-width:0}
.copy-inline .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.copy-btn{background:var(--card-hi);border:1px solid var(--border);border-radius:7px;padding:3px;
  color:var(--muted);display:grid;place-items:center;transition:.15s var(--ease);flex:none}
.copy-btn:hover{color:var(--blue);border-color:var(--blue)}
.copy-btn svg.lucide{width:12px;height:12px}

.section{margin-top:26px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.section-head h2{font-size:16.5px}
.section-head p{font-size:12.5px;color:var(--muted);margin-top:3px}
.grid{display:grid;gap:11px}
.grid-games{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.grid-feat{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.home-date{display:flex;align-items:center;gap:7px;margin-bottom:12px;padding:0 3px;font-size:12px;
  font-weight:600;color:var(--muted);letter-spacing:.01em}
.home-date svg.lucide{width:13px;height:13px;color:var(--cyan)}

/* LEADERBOARD */
.leaderboard{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:18px 16px;
  background:linear-gradient(155deg,rgba(251,191,36,.10),rgba(167,139,250,.05) 55%,rgba(36,46,64,.6) 90%),
    var(--card);border:1px solid rgba(251,191,36,.24)}
.leaderboard::before{content:'';position:absolute;width:280px;height:280px;right:-100px;top:-140px;
  border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.18),transparent 68%);pointer-events:none}
.lb-head{position:relative;z-index:1;margin-bottom:12px}
.lb-head h2{font-size:clamp(15px,3.8vw,18px);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.lb-head h2 .coin-icon{width:18px;height:18px}
.lb-head p{font-size:11.5px;color:var(--muted);margin-top:4px}
.lb-list{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  background:rgba(36,46,64,.6);border:1px solid var(--border);transition:.2s var(--ease)}
.lb-row:hover{border-color:var(--border-hi);transform:translateX(2px)}
.lb-row.top1{background:linear-gradient(90deg,rgba(251,191,36,.18),rgba(251,191,36,.02));border-color:rgba(251,191,36,.5)}
.lb-row.top2{background:linear-gradient(90deg,rgba(167,139,250,.14),rgba(167,139,250,.02));border-color:rgba(167,139,250,.4)}
.lb-row.top3{background:linear-gradient(90deg,rgba(96,165,250,.14),rgba(96,165,250,.02));border-color:rgba(96,165,250,.4)}
.lb-rank{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;
  font-weight:800;font-size:12px;color:var(--muted);background:var(--card-hi);border:1px solid var(--border)}
.lb-row.top1 .lb-rank{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#2A1A00;border-color:transparent;box-shadow:0 0 14px rgba(251,191,36,.55)}
.lb-row.top2 .lb-rank{background:linear-gradient(135deg,#C4B5FD,#A78BFA);color:#2A1A40;border-color:transparent}
.lb-row.top3 .lb-rank{background:linear-gradient(135deg,#93C5FD,#60A5FA);color:#0B1220;border-color:transparent}
.lb-avatar{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;
  font-weight:800;font-size:12px;color:#fff;letter-spacing:.02em;overflow:hidden}
.lb-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.lb-body{flex:1;min-width:0}
.lb-name{font-size:13px;font-weight:800;color:var(--text);line-height:1.25;word-break:break-word}
.lb-sub{font-size:11px;color:var(--muted-2);margin-top:2px}
.lb-score{flex:none;text-align:right;font-weight:800;color:var(--gold);font-size:12.5px;display:flex;align-items:center;gap:5px;justify-content:flex-end}
.lb-score .coin-icon{width:12px;height:12px}
.lb-empty{text-align:center;padding:22px 14px;font-size:12.5px;color:var(--muted-2)}

/* GAME CARD */
.game-card{overflow:hidden;padding:9px}
.game-card:hover{transform:translateY(-2px);border-color:rgba(96,165,250,.45);box-shadow:0 18px 34px -24px rgba(96,165,250,.55)}
.game-art{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,#2B364A,#1D2535)}
.game-art::before{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 85% at 18% 0%, rgba(255,255,255,.1), transparent 56%),linear-gradient(180deg,transparent 38%,rgba(0,0,0,.4))}
.game-art span{position:relative;z-index:1;font-weight:800;font-size:22px;letter-spacing:.05em;color:rgba(255,255,255,.9)}
.game-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:2;background:#1D2535}
.game-art.has-img::before{display:none}
.game-body{padding:10px 4px 4px}
.game-name{font-size:13.5px;font-weight:700;padding-right:26px}
.fav-btn{position:relative;z-index:4;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:rgba(23,28,40,.65);border:1px solid var(--border);color:var(--muted-2);transition:.16s var(--ease);flex:none}
.fav-btn.on{color:var(--pink);border-color:rgba(244,114,182,.45);background:rgba(244,114,182,.15)}
.fav-btn.on svg.lucide{fill:var(--pink)}
.fav-btn svg.lucide{width:14px;height:14px}

/* HERO */
.hero{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:var(--r-xl);padding:30px 18px 22px;text-align:center;
  background:linear-gradient(155deg,rgba(96,165,250,.14),rgba(167,139,250,.08) 50%,rgba(45,212,191,.05) 90%),var(--card)}
@media(min-width:860px){.hero{padding:48px 44px 36px;text-align:left}}
.hero-orb{position:absolute;width:400px;height:400px;right:-140px;top:-180px;pointer-events:none;
  background:radial-gradient(circle,rgba(167,139,250,.35),transparent 66%);filter:blur(22px)}
.hero h1{font-size:clamp(26px,6.2vw,42px);font-weight:800;letter-spacing:-.032em;margin:14px 0 10px;max-width:620px;position:relative}
.hero-sub{font-size:14px;color:var(--muted);max-width:440px;position:relative}
.hero-actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px;position:relative}
@media(min-width:860px){.hero-actions{justify-content:flex-start}}
.hero.has-custom-bg{background:var(--card)}
.hero.has-custom-bg .hero-orb{display:none}
.hero.has-custom-bg::before{content:'';position:absolute;inset:0;
  background-image:var(--hero-img);
  background-size:cover;background-position:center var(--hero-y,50%);background-repeat:no-repeat;
  background-color:#1D2535;z-index:0;pointer-events:none}
.hero.has-custom-bg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(23,28,40,var(--hero-overlay,.72)),rgba(23,28,40,var(--hero-overlay,.72)));
  z-index:1;pointer-events:none}
.hero.has-custom-bg > *{position:relative;z-index:2}
.hero.has-custom-bg h1{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero.has-custom-bg .hero-sub{color:#E2E8F0}
.hero.has-custom-bg .pill{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.hero.has-custom-bg .trust-item{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#E2E8F0}
.hero.has-custom-bg .grad{background:linear-gradient(100deg,#93C5FD,#C4B5FD 50%,#67E8F9);-webkit-background-clip:text;background-clip:text;color:transparent}

.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:24px;position:relative}
@media(min-width:720px){.trust{grid-template-columns:repeat(4,1fr);gap:10px}}
.trust-item{display:flex;align-items:center;gap:8px;padding:10px 11px;border-radius:10px;
  background:var(--card-hi);border:1px solid var(--border);font-size:11.5px;font-weight:600;color:var(--muted)}
.trust-item svg.lucide{color:var(--cyan);width:15px;height:15px}

/* FEATURES / CTA */
.feat{padding:14px;display:flex;flex-direction:column;gap:8px}
.feat-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.feat-ic[data-c="blue"]{background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.3);color:var(--blue)}
.feat-ic[data-c="purple"]{background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.3);color:var(--purple)}
.feat-ic[data-c="cyan"]{background:rgba(77,208,225,.14);border:1px solid rgba(77,208,225,.3);color:var(--cyan)}
.feat-ic[data-c="teal"]{background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.3);color:var(--teal)}
.feat-ic[data-c="green"]{background:rgba(74,222,128,.14);border:1px solid rgba(74,222,128,.3);color:var(--green)}
.feat-ic[data-c="gold"]{background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.3);color:var(--gold)}
.feat-ic[data-c="pink"]{background:rgba(244,114,182,.14);border:1px solid rgba(244,114,182,.3);color:var(--pink)}
.feat-ic[data-c="orange"]{background:rgba(251,146,60,.14);border:1px solid rgba(251,146,60,.3);color:var(--orange)}
.feat h3{font-size:13.5px}
.feat p{font-size:12px;color:var(--muted);line-height:1.55}
.cta{position:relative;overflow:hidden;margin-top:32px;border-radius:var(--r-xl);padding:28px 18px;text-align:center;
  border:1px solid rgba(167,139,250,.3);
  background:linear-gradient(135deg,rgba(96,165,250,.16),rgba(167,139,250,.14) 60%,rgba(45,212,191,.08))}
.cta h2{font-size:clamp(19px,4.4vw,26px);font-weight:800;letter-spacing:-.03em}
.cta p{color:var(--muted);margin-top:6px;font-size:13.5px}
.cta .btn{margin-top:16px}

/* FORMS */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.01em}
.input,select,textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:11px;
  padding:12px 13px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;transition:.16s var(--ease);appearance:none}
textarea{min-height:88px;resize:vertical;line-height:1.55}
.input::placeholder,textarea::placeholder{color:var(--muted-2)}
.input:focus,select:focus,textarea:focus{border-color:var(--blue);background:var(--card-hi);box-shadow:0 0 0 3px rgba(96,165,250,.18)}
.input[disabled]{opacity:.55;cursor:not-allowed}
.field-error{display:none;color:#FCA5A5;font-size:11px;margin-top:4px;font-weight:600;line-height:1.4}
.field-error.show{display:block}
.field.invalid .input,.field.invalid .cd-select-trigger,.field.invalid textarea{border-color:rgba(248,113,113,.6);background:rgba(248,113,113,.06)}
.field.invalid .label{color:#FCA5A5}

.cd-select{position:relative;width:100%}
.cd-select-native{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;top:0;left:0;border:0;padding:0}
.cd-select-trigger{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 13px;
  background:var(--card);border:1px solid var(--border);border-radius:11px;
  color:var(--text);font-size:13.5px;font-family:inherit;text-align:left;cursor:pointer;transition:.16s var(--ease);min-height:44px}
.cd-select-trigger:hover{border-color:var(--border-hi);background:var(--card-hi)}
.cd-select.open .cd-select-trigger{border-color:var(--blue);background:var(--card-hi);box-shadow:0 0 0 3px rgba(96,165,250,.18)}
.cd-select-value{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--text)}
.cd-select-value.placeholder{color:var(--muted-2);font-weight:500}
.cd-select-trigger svg.lucide{width:15px;height:15px;color:var(--blue);flex:none;transition:transform .25s var(--ease)}
.cd-select.open .cd-select-trigger svg.lucide{transform:rotate(180deg)}
.cd-select-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;background:#2A364A;
  border:1px solid var(--border-hi);border-radius:11px;padding:5px;
  box-shadow:var(--shadow-lg);max-height:250px;overflow:auto;display:none;animation:cdOpen .18s var(--ease);-webkit-overflow-scrolling:touch}
.cd-select.open .cd-select-menu{display:block}
.cd-select-menu.cd-portal{position:fixed;z-index:9999;top:auto;left:auto;right:auto;bottom:auto;width:auto;min-width:180px;max-width:calc(100vw - 24px)}
.cd-select-menu.cd-up{top:auto;bottom:calc(100% + 6px)}
@keyframes cdOpen{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.cd-select-option{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:11px 12px;
  border-radius:8px;background:transparent;border:none;color:var(--text);font-size:13px;font-weight:600;
  font-family:inherit;text-align:left;cursor:pointer;transition:.14s var(--ease);min-height:40px}
.cd-select-option:hover{background:var(--card-hi)}
.cd-select-option.selected{background:linear-gradient(90deg,rgba(96,165,250,.22),rgba(96,165,250,.06));color:var(--text)}
.cd-select-option.selected::after{content:'✓';color:var(--blue);font-weight:800;font-size:13.5px;margin-left:auto}

.pw-wrap{position:relative;display:block}
.pw-wrap .input{padding-right:44px}
.pw-toggle{position:absolute;right:5px;top:13px;width:32px;height:32px;border-radius:8px;
  background:transparent;border:none;display:grid;place-items:center;color:var(--muted-2)}
.pw-toggle svg.lucide{width:16px;height:16px}
.check{display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border-radius:11px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;transition:.16s var(--ease);margin-bottom:8px}
.check input{width:17px;height:17px;accent-color:var(--blue);margin:1px 0 0;flex:none;cursor:pointer}
.check .c-t{font-size:13px;font-weight:600}
.check .c-s{font-size:11px;color:var(--muted-2);margin-top:2px}

.info-box{display:flex;gap:10px;padding:12px 13px;border-radius:11px;background:rgba(96,165,250,.08);
  border:1px solid rgba(96,165,250,.28);font-size:12px;color:#BFDBFE;line-height:1.55;margin:4px 0 14px}
.info-box svg.lucide{color:var(--blue);flex:none;margin-top:1px;width:16px;height:16px}
.info-box.warn{background:rgba(251,146,60,.1);border-color:rgba(251,146,60,.32);color:#FDBA74}
.info-box.warn svg.lucide{color:var(--orange)}
.info-box.danger{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.32);color:#FCA5A5}
.info-box.danger svg.lucide{color:var(--danger)}
.info-box.gold{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.28);color:#FDE68A}
.info-box.gold svg.lucide{color:var(--gold)}
.notice{display:flex;gap:10px;padding:12px 13px;border-radius:11px;background:rgba(77,208,225,.08);
  border:1px solid rgba(77,208,225,.28);font-size:12px;color:#A5F3FC;line-height:1.55;margin-top:12px}
.notice svg.lucide{color:var(--cyan);flex:none;margin-top:1px;width:16px;height:16px}

.summary{border-radius:11px;border:1px solid var(--border);background:var(--card-hi);padding:13px;margin-top:6px}
.price-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--muted);gap:10px;align-items:center}
.price-row span:last-child{color:var(--text);font-weight:600;text-align:right}
.price-row.total{border-top:1px dashed var(--border-hi);margin-top:6px;padding-top:10px;font-size:14px;color:var(--text);font-weight:800}
.price-row.total span:last-child{color:var(--gold);font-size:16px;font-weight:800}

/* ORDERS */
.order-card{padding:14px;display:flex;flex-direction:column;gap:10px}
.order-main{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.order-main h3{font-size:13.5px}
.status{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:10.5px;
  font-weight:800;letter-spacing:.03em;text-transform:uppercase;flex:none}
.status::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.st-pending{background:rgba(251,146,60,.14);color:#FDBA74;border:1px solid rgba(251,146,60,.32)}
.st-progress{background:rgba(96,165,250,.14);color:#93C5FD;border:1px solid rgba(96,165,250,.32)}
.st-completed{background:rgba(74,222,128,.14);color:#86EFAC;border:1px solid rgba(74,222,128,.32)}
.st-cancelled{background:rgba(248,113,113,.13);color:#FCA5A5;border:1px solid rgba(248,113,113,.3)}
.st-awaiting{background:rgba(251,191,36,.14);color:#FDE68A;border:1px solid rgba(251,191,36,.32)}
.tabs{display:flex;gap:5px;overflow-x:auto;padding:3px;border-radius:12px;background:var(--card);
  border:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;white-space:nowrap;padding:9px 12px;border-radius:9px;border:none;background:transparent;
  color:var(--muted);font-size:12px;font-weight:700;transition:.16s var(--ease)}
.tab.active{background:linear-gradient(135deg,#60A5FA,#3B82F6);color:#0B1220}
.tab-reset{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--blue);
  background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.32);padding:6px 10px;border-radius:7px}
.tl{position:relative;padding-left:24px;margin-top:6px}
.tl::before{content:'';position:absolute;left:6px;top:9px;bottom:14px;width:2px;background:var(--border);border-radius:2px}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-24px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--card);
  border:2px solid var(--border-hi);transition:.3s var(--ease)}
.tl-item.done .tl-dot{background:var(--blue);border-color:rgba(96,165,250,.5);box-shadow:0 0 0 4px rgba(96,165,250,.15)}
.tl-title{font-size:12.5px;font-weight:700;color:var(--muted)}
.tl-item.done .tl-title{color:var(--text)}
.tl-time{font-size:11px;color:var(--muted-2);margin-top:2px}

/* WALLET */
.balance-card{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 18px;
  border:1px solid rgba(45,212,191,.32);
  background:linear-gradient(140deg,rgba(45,212,191,.16),rgba(96,165,250,.1) 62%,transparent),var(--card)}
.balance-card::after{content:'';position:absolute;width:240px;height:240px;right:-100px;top:-120px;border-radius:50%;
  background:radial-gradient(circle,rgba(45,212,191,.22),transparent 66%)}
.balance-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.tx{display:flex;align-items:center;gap:11px;padding:12px;border-radius:11px;border:1px solid var(--border);
  background:var(--card);transition:.16s var(--ease)}
.tx:hover{border-color:var(--border-hi)}
.tx-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--card-hi);color:var(--muted)}
.tx-ic.in,.tx-ic.out{background:rgba(96,165,250,.14);color:var(--blue)}
.tx-ic.refund{background:rgba(74,222,128,.14);color:var(--green)}
.tx-ic.admin{background:rgba(251,191,36,.14);color:var(--gold)}

/* PROFILE */
.profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:24px 16px 20px}
.profile-avatar-wrap{position:relative;width:100px;height:100px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(96,165,250,.24),rgba(167,139,250,.18));
  border:2px solid rgba(96,165,250,.4);box-shadow:0 14px 40px -18px rgba(96,165,250,.85);
  overflow:hidden;cursor:pointer;transition:.2s var(--ease)}
.profile-avatar-img{width:100%;height:100%;object-fit:cover;display:block}
.profile-avatar-initial{width:100%;height:100%;display:grid;place-items:center;font-weight:800;font-size:34px;color:#0B1220}
.profile-avatar-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);opacity:0;transition:.2s var(--ease);color:#fff}
.profile-avatar-wrap:hover .profile-avatar-overlay{opacity:1}
.avatar-edit-btn{margin-top:9px;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9px;
  background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.4);color:var(--blue);font-size:12px;font-weight:700}
.profile-name{font-size:20px;font-weight:800;letter-spacing:-.025em;margin-top:12px;line-height:1.2}
.profile-username{font-size:13px;color:var(--purple);font-weight:600;margin-top:2px}
.profile-since{font-size:11px;color:var(--muted-2);margin-top:6px}
.profile-edit-btn{margin-top:14px;width:100%;max-width:300px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:400px;margin-top:16px}
.stat{padding:12px 9px;border-radius:11px;border:1px solid var(--border);background:var(--card-hi);text-align:center}
.stat .v{font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.stat:nth-child(1) .v{color:var(--blue)}
.stat:nth-child(2) .v{color:var(--green)}
.stat:nth-child(3) .v{color:var(--gold)}
.stat .l{font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;font-weight:700}
.row-item{display:flex;align-items:center;gap:11px;padding:13px;border-radius:11px;border:1px solid var(--border);
  background:var(--card);transition:.16s var(--ease);color:var(--text);text-align:left;width:100%}
.row-item:hover{border-color:var(--border-hi);background:var(--card-hi)}
.row-item .ri-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(96,165,250,.12);color:var(--blue)}
.row-item:nth-child(2) .ri-ic{background:rgba(167,139,250,.12);color:var(--purple)}
.row-item:nth-child(3) .ri-ic{background:rgba(77,208,225,.12);color:var(--cyan)}
.row-item:nth-child(4) .ri-ic{background:rgba(45,212,191,.12);color:var(--teal)}
.row-item .ri-t{font-size:13px;font-weight:700;display:block}
.row-item .ri-s{font-size:11px;color:var(--muted);margin-top:2px;display:block}
.row-item > svg.lucide{color:var(--muted-2);flex:none}
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:var(--card-hi);border:1px solid var(--border);flex:none;transition:.2s var(--ease)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#8899B4;transition:.22s var(--ease)}
.switch.on{background:rgba(96,165,250,.35);border-color:rgba(96,165,250,.6)}
.switch.on::after{left:20px;background:var(--blue);box-shadow:0 0 12px rgba(96,165,250,.85)}

/* EMPTY / TOAST / MODAL / LOADING */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:44px 20px;border-radius:var(--r-xl);
  border:1px dashed var(--border-hi);background:rgba(36,46,64,.5)}
.empty-ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;margin-bottom:8px;
  background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.28);color:var(--blue)}
.empty h3{font-size:15px}
.empty p{font-size:12.5px;color:var(--muted);max-width:280px}
.empty .btn{margin-top:12px}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;z-index:400;display:flex;flex-direction:column;gap:7px;width:min(92vw,360px);pointer-events:none}
@media(min-width:1024px){#toasts{left:auto;right:22px;bottom:22px;transform:none}}
.toast{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#2A364A;
  border:1px solid var(--border-hi);box-shadow:var(--shadow-lg);
  font-size:13px;font-weight:600;animation:toastIn .3s var(--ease)}
.toast.out{animation:toastOut .26s var(--ease) forwards}
.toast svg.lucide{flex:none;width:17px;height:17px}
.toast-success svg.lucide{color:var(--green)}
.toast-error svg.lucide{color:var(--danger)}
.toast-info svg.lucide{color:var(--cyan)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.97)}}

.modal-backdrop{position:fixed;inset:0;z-index:300;background:rgba(10,14,22,.72);backdrop-filter:blur(6px);
  display:grid;place-items:end center;padding:0;animation:fadeIn .2s var(--ease)}
@media(min-width:640px){.modal-backdrop{place-items:center;padding:18px}}
.modal{width:100%;max-width:440px;background:#232E42;border:1px solid var(--border-hi);
  border-radius:20px 20px 0 0;padding:20px;animation:slideUp .28s var(--ease);max-height:88vh;overflow:auto}
@media(min-width:640px){.modal{border-radius:20px;animation:pop .22s var(--ease)}}
@keyframes slideUp{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}

.footer{margin-top:auto;border-top:1px solid var(--border);background:rgba(29,37,53,.6);position:relative;z-index:1}
.footer-inner{max-width:1180px;margin:0 auto;padding:24px 18px 32px;display:flex;flex-direction:column;gap:18px}
@media(min-width:768px){.footer-inner{flex-direction:row;justify-content:space-between;align-items:flex-start;padding:28px 30px 36px}}
.footer-brand p{font-size:12.5px;color:var(--muted);margin-top:8px;max-width:240px}
.footer-links{display:flex;flex-wrap:wrap;gap:8px 20px}
.footer-links a{font-size:12.5px;color:var(--muted);font-weight:600;transition:.16s}
.footer-links a:hover{color:var(--blue)}
.footer-bottom{font-size:11px;color:var(--muted-2);border-top:1px solid var(--border);padding-top:14px;line-height:1.6}

.auth-wrap{max-width:410px;margin:10px auto 0}
.auth-card{padding:22px 20px}
@media(min-width:640px){.auth-card{padding:28px 26px}}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted-2);font-size:11px;font-weight:700;letter-spacing:.06em}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.faq-item{border:1px solid var(--border);border-radius:11px;background:var(--card);overflow:hidden;transition:.16s var(--ease)}
.faq-item:hover{border-color:var(--border-hi)}
.faq-q{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;font-size:13px;
  font-weight:700;cursor:pointer;width:100%;background:none;border:none;color:var(--text);text-align:left}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s var(--ease)}
.faq-a p{padding:0 13px 13px;font-size:12.5px;color:var(--muted);line-height:1.65}
.faq-item.open .faq-a{max-height:280px}
.faq-item.open .faq-q svg.lucide{transform:rotate(180deg);color:var(--blue)}

/* BANNER */
.banner{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 16px;margin-bottom:14px;border:1px solid var(--border);background:var(--card)}
.banner::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.85}
.banner::after{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 100% at 12% 0%,rgba(255,255,255,.18),transparent 58%),linear-gradient(180deg,transparent 30%,rgba(11,18,32,.55))}
.banner-in{position:relative;z-index:1}
.banner h1{font-size:clamp(20px,5vw,28px);font-weight:800;letter-spacing:-.03em;color:#fff;text-shadow:0 4px 22px rgba(0,0,0,.4)}
.banner p{color:rgba(255,255,255,.85);font-size:12.5px;margin-top:5px;max-width:500px}
.banner-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bstat{display:flex;flex-direction:column;padding:8px 11px;border-radius:10px;background:rgba(11,18,32,.4);
  border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);min-width:0}
.bstat .v{font-size:13px;font-weight:800;line-height:1.2;color:#fff}
.bstat .l{font-size:9.5px;color:rgba(255,255,255,.72);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:2px}
.banner.compact{padding:18px 15px}
.banner.compact h1{font-size:clamp(19px,4.6vw,24px)}
.banner.compact p{font-size:12px;margin-top:4px}
.banner-stats.compact{gap:6px;margin-top:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.banner-stats.compact::-webkit-scrollbar{display:none}
.banner-stats.compact .bstat{padding:6px 10px;border-radius:9px}
.banner-stats.compact .bstat .v{font-size:12.5px}
.banner-stats.compact .bstat .l{font-size:8.5px;margin-top:1px;letter-spacing:.05em}
@media(max-width:640px){
  .banner-stats.compact{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;overflow:visible}
  .banner-stats.compact .bstat{padding:7px 10px}
  .banner-stats.compact .bstat .v{font-size:12px}
  .banner-stats.compact .bstat .l{font-size:8.5px}
}

/* CAROUSEL */
.carousel-wrap{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);background:#1D2535;margin-bottom:14px}
.carousel-track{display:flex;transition:transform .5s cubic-bezier(.4,0,.2,1);touch-action:pan-y}
.carousel-slide{flex:0 0 100%;aspect-ratio:16/7;position:relative;background:#1D2535;display:grid;place-items:center;overflow:hidden}
.carousel-slide img{width:100%;height:100%;object-fit:cover;display:block;background:#1D2535}
.carousel-slide .placeholder{font-size:12.5px;color:var(--muted-2);padding:0 14px;text-align:center}
.carousel-slide .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 12px;background:linear-gradient(180deg,transparent,rgba(11,18,32,.8));font-size:12.5px;font-weight:600;color:#fff;text-align:left;z-index:2}
.carousel-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:3}
.carousel-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);border:none;padding:0;cursor:pointer;transition:.22s var(--ease)}
.carousel-dot.active{background:var(--blue);width:18px;border-radius:3px}
@media(max-width:640px){.carousel-slide{aspect-ratio:16/9}}

/* SERVICE CARDS */
.svc-thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;margin-bottom:12px;background:#1D2535;display:grid;place-items:center;border:1px solid var(--border)}
.svc-thumb img{width:100%;height:100%;object-fit:cover;display:block;background:#1D2535}
.svc-thumb .ph{font-size:11.5px;color:var(--muted-2);padding:0 12px;text-align:center}
.rank-item{margin-bottom:9px}
.rank-item:last-child{margin-bottom:0}
.rank-row{display:flex;align-items:center;gap:11px;padding:13px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;cursor:pointer;transition:.16s var(--ease);position:relative;overflow:hidden}
.rank-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--svc-color,var(--blue));opacity:.7}
.rank-row:hover{border-color:var(--border-hi);background:var(--card-hi)}
.rank-row.expanded{border-color:var(--svc-color,var(--blue));background:linear-gradient(135deg,rgba(96,165,250,.1),rgba(96,165,250,.02));border-radius:12px 12px 0 0}
.rank-row[data-svc="rankboost"]{--svc-color:var(--blue)}
.rank-row[data-svc="topsung"]{--svc-color:var(--purple)}
.svc-avatar{width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;
  font-weight:800;font-size:13.5px;color:#0B1220;letter-spacing:.02em}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:14px;font-weight:800;color:var(--text);letter-spacing:-.01em;line-height:1.2}
.rank-divisions{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.01em;line-height:1.35}
.rank-price{flex:none;text-align:right;font-size:14px;font-weight:800;color:var(--gold);letter-spacing:-.01em;line-height:1.15}
.rank-price small{display:block;font-size:9px;color:var(--muted-2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.rank-detail{padding:14px;background:rgba(29,37,53,.6);border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;animation:rankExpand .25s var(--ease)}
.rank-item[data-svc="rankboost"] .rank-detail{border-color:rgba(96,165,250,.35);background:rgba(96,165,250,.05)}
.rank-item[data-svc="topsung"] .rank-detail{border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.05)}
@keyframes rankExpand{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.rank-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:11px;margin-bottom:12px;border-bottom:1px dashed var(--border-hi)}
.rank-detail-name{font-size:15px;font-weight:800;letter-spacing:-.01em}
.rank-detail-sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.01em}
.svc-contact{display:flex;flex-direction:column;gap:14px;padding:18px;
  background:linear-gradient(135deg,rgba(251,146,60,.12),rgba(251,191,36,.08));
  border:1px solid rgba(251,146,60,.32);border-radius:var(--r-xl);margin-top:12px;position:relative;overflow:hidden}
.svc-contact::before{content:'';position:absolute;width:200px;height:200px;right:-70px;top:-90px;
  border-radius:50%;background:radial-gradient(circle,rgba(251,146,60,.28),transparent 68%);pointer-events:none}
@media(min-width:640px){.svc-contact{flex-direction:row;align-items:center;justify-content:space-between;padding:20px 24px}}
.svc-contact-info{position:relative;z-index:1}
.svc-contact-info h3{font-size:15px;font-weight:800;line-height:1.3}
.svc-contact-info p{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.55;max-width:500px}
.svc-contact .btn{position:relative;z-index:1;flex:none;align-self:flex-start}
@media(min-width:640px){.svc-contact .btn{align-self:center}}
.contact-panel-actions{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.contact-panel-info{display:flex;gap:10px;padding:11px 12px;border-radius:11px;background:var(--card-hi);
  border:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}

/* PAYMENT */
.pay-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(251,146,60,.14);
  border:1px solid rgba(251,146,60,.38);color:#FDBA74;font-size:10.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.qr-box{width:160px;height:160px;margin:4px auto 12px;padding:9px;background:#fff;border-radius:12px;
  box-shadow:0 8px 24px -14px rgba(0,0,0,.6);position:relative}
.qr-box::after{content:'DEMO';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);
  font-weight:800;font-size:12px;letter-spacing:.15em;color:rgba(96,165,250,.85);background:rgba(255,255,255,.9);
  padding:3px 9px;border-radius:5px;border:1.5px dashed rgba(96,165,250,.6);pointer-events:none}
.bank-info{display:grid;gap:5px;padding:11px 12px;border-radius:11px;background:var(--card-hi);border:1px solid var(--border);font-size:12px;margin-bottom:12px}
.bank-info .bi-row{display:flex;justify-content:space-between;gap:10px}
.bank-info .bi-row span:first-child{color:var(--muted-2)}
.bank-info .bi-row span:last-child{color:var(--text);font-weight:700}
.pay-amount-label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.pay-amount-input{position:relative;margin-bottom:8px}
.pay-amount-input .input{font-size:15px;font-weight:700;letter-spacing:-.01em;padding-right:46px}
.pay-amount-input .suffix{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:12.5px;font-weight:800;pointer-events:none}
.pay-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px}
.pay-quick .chip{padding:9px 5px;font-size:11px;text-align:center;justify-content:center;display:flex;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-weight:700}
.pay-quick .chip.active{background:rgba(96,165,250,.16);border-color:rgba(96,165,250,.5);color:var(--blue)}
.pay-ref{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:10px 12px;border-radius:11px;background:rgba(167,139,250,.1);border:1px dashed rgba(167,139,250,.45);margin-bottom:14px}
.pay-ref .pr-l{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.pay-ref .pr-v{font-family:ui-monospace,monospace;font-size:13px;font-weight:800;color:var(--purple);letter-spacing:.04em}
.pay-ref button{background:none;border:none;color:var(--muted);padding:4px}
.pay-foot-note{display:flex;gap:7px;align-items:flex-start;font-size:10.5px;color:var(--muted-2);margin-top:12px;line-height:1.5}
.pay-foot-note svg.lucide{width:12px;height:12px;flex:none;margin-top:1px}

/* LOADING */
.loading-overlay{position:fixed;inset:0;z-index:500;
  background:radial-gradient(circle at 50% 42%, rgba(96,165,250,.16), transparent 58%), rgba(15,20,30,.9);
  backdrop-filter:blur(14px);display:grid;place-items:center;padding:18px;animation:fadeIn .22s var(--ease)}
.loading-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;
  padding:32px 36px 28px;max-width:92vw;
  background:linear-gradient(180deg,#26324A,#1D2535);
  border:1px solid rgba(96,165,250,.35);border-radius:20px;
  box-shadow:0 26px 70px -28px rgba(96,165,250,.5),0 18px 50px -18px rgba(0,0,0,.9);text-align:center;overflow:hidden}
.loading-ring-wrap{position:relative;width:74px;height:74px;display:grid;place-items:center;z-index:1}
.loading-ring{position:absolute;inset:0;border-radius:50%;
  border:3px solid rgba(96,165,250,.14);border-top-color:var(--blue);border-right-color:rgba(167,139,250,.6);
  animation:spin 1s linear infinite;box-shadow:0 0 24px -4px rgba(96,165,250,.5)}
.loading-ring-inner{position:absolute;inset:12px;border-radius:50%;
  border:2px solid transparent;border-bottom-color:var(--cyan);animation:spin 1.4s linear infinite reverse;opacity:.85}
.loading-ring-core{width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #93C5FD, #60A5FA 60%, #A78BFA);
  box-shadow:0 0 16px rgba(96,165,250,.85);animation:corePulse 1.4s ease-in-out infinite;z-index:1}
@keyframes corePulse{0%,100%{transform:scale(.85);opacity:.78}50%{transform:scale(1.18);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{position:relative;z-index:1;font-size:13px;font-weight:800;color:var(--text);letter-spacing:.1em;text-transform:uppercase}
.loading-sub{position:relative;z-index:1;font-size:12px;color:var(--muted);margin-top:-10px}
.btn-spinner{display:inline-block;flex:none;width:14px;height:14px;border-radius:50%;
  border:2px solid rgba(11,18,32,.3);border-top-color:#0B1220;animation:spin .7s linear infinite}

/* ORDER SUCCESS / INSUFFICIENT */
.order-success-wrap{text-align:center}
.success-check{width:66px;height:66px;margin:2px auto 14px;border-radius:20px;
  background:linear-gradient(135deg,rgba(74,222,128,.2),rgba(96,165,250,.14));
  border:1px solid rgba(74,222,128,.45);display:grid;place-items:center;color:var(--green)}
.success-check svg.lucide{width:30px;height:30px}
.order-success-title{font-size:16px;font-weight:800;color:var(--green);line-height:1.25;margin-bottom:6px}
.order-success-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.order-info-box{display:grid;gap:7px;padding:12px 13px;background:var(--card-hi);border:1px solid var(--border);border-radius:11px;text-align:left;margin-bottom:12px}
.order-info-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;align-items:center}
.order-info-row .k{color:var(--muted-2);flex:none}
.order-info-row .v{color:var(--text);font-weight:700;text-align:right;word-break:break-word;min-width:0}
.order-info-row.highlight .v{color:var(--gold);font-size:13.5px}
.order-info-row.status-row .v{color:#FDBA74}
.contact-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:800;margin-bottom:8px;text-align:left}
.contact-links{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.contact-link{flex:1;min-width:110px;display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:11px;
  background:var(--card-hi);border:1px solid var(--border-hi);color:var(--text);font-weight:700;font-size:13px;min-height:44px}
.contact-link:hover{background:var(--card);border-color:var(--blue);color:var(--blue)}
.orders-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;border-radius:12px;
  background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.35);color:var(--blue);font-weight:700;font-size:13.5px;margin-bottom:12px}
.security-notice{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:rgba(77,208,225,.08);
  border:1px solid rgba(77,208,225,.28);font-size:11px;color:#A5F3FC;line-height:1.5;text-align:left}
.insufficient-wrap{text-align:left}
.insufficient-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.insufficient-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:rgba(251,146,60,.14);border:1px solid rgba(251,146,60,.4);color:var(--orange)}
.insufficient-title{font-size:15.5px;font-weight:800;color:#FDBA74;letter-spacing:-.015em;line-height:1.2}
.insufficient-sub{font-size:12px;color:var(--muted);margin-top:3px}
.insufficient-msg{font-size:13px;color:var(--text);line-height:1.55;margin-bottom:14px;padding:11px 12px;background:rgba(251,146,60,.06);border:1px solid rgba(251,146,60,.22);border-radius:11px}
.insufficient-msg strong{color:var(--gold);font-weight:800}

/* MODAL AVATAR / COOLDOWN / LOGOUT */
.modal-avatar-block{display:flex;flex-direction:column;align-items:center;margin-bottom:16px}
.modal-avatar-wrap{width:80px;height:80px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(96,165,250,.24),rgba(167,139,250,.18));
  border:2px solid rgba(96,165,250,.4);overflow:hidden;cursor:pointer;position:relative}
.modal-avatar-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.modal-avatar-initial{width:100%;height:100%;display:grid;place-items:center;font-weight:800;font-size:28px;color:#0B1220}
.modal-avatar-edit{margin-top:9px;font-size:12px;font-weight:700;color:var(--blue);background:none;border:none;padding:4px 8px;border-radius:8px}

.cooldown-hint{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:9px;background:rgba(251,146,60,.1);

.cooldown-hint svg.lucide{width:13px;height:13px;color:var(--orange);flex:none;margin-top:1px}
.logout-confirm{text-align:center}

.logout-confirm-ic svg.lucide{width:24px;height:24px}
.logout-confirm h3{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.logout-confirm p{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.logout-confirm-actions{display:flex;gap:9px;margin-top:18px}
.logout-confirm-actions .btn{flex:1}

/* SUSPEND */
.suspend-view{max-width:540px;margin:18px auto 0}
.suspend-card{padding:28px 20px;text-align:center}
.suspend-icon{width:68px;height:68px;margin:0 auto 16px;border-radius:22px;display:grid;place-items:center;
  background:rgba(248,113,113,.13);border:1px solid rgba(248,113,113,.35);color:#FCA5A5}
.suspend-icon svg.lucide{width:30px;height:30px}
.suspend-title{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;line-height:1.25}
.suspend-msg{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:20px;text-align:left}

/* TERMS */
.terms-wrap{max-width:800px;margin:0 auto}
.terms-head{margin-bottom:18px}
.terms-head .eyebrow{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.3);font-size:10.5px;font-weight:800;
  color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.terms-head h1{font-size:clamp(21px,5vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1.15}
.terms-head .updated{margin-top:8px;font-size:12px;color:var(--muted-2)}
.terms-toc{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:20px}
.terms-toc h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);margin-bottom:10px;font-weight:800}
.terms-toc ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr;gap:5px}
@media(min-width:600px){.terms-toc ol{grid-template-columns:1fr 1fr;column-gap:20px}}
.terms-toc a{font-size:12.5px;color:var(--muted);display:block;padding:3px 0}
.terms-body{display:flex;flex-direction:column;gap:20px}
.terms-section h2{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:baseline;gap:9px}
.terms-section h2 .num{font-size:11px;font-weight:800;color:var(--blue);background:rgba(96,165,250,.12);
  border:1px solid rgba(96,165,250,.32);border-radius:6px;padding:2px 7px;flex:none}
.terms-section p{font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:9px}
.terms-section ul{margin:5px 0 9px;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.terms-section li{font-size:13px;color:var(--muted);line-height:1.65}
.terms-section a{color:var(--blue);text-decoration:underline;text-decoration-color:rgba(96,165,250,.4)}
.terms-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}

/* DRAFT BADGE */
.draft-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  background:rgba(77,208,225,.14);border:1px solid rgba(77,208,225,.32);color:var(--cyan);
  font-size:10.5px;font-weight:800;letter-spacing:.02em;margin-bottom:10px}

/* IMAGE EDITOR */
input[type="range"]{-webkit-appearance:none;appearance:none;height:6px;background:var(--border);border-radius:999px;outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;box-shadow:0 2px 8px rgba(96,165,250,.6)}
input[type="range"]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;box-shadow:0 2px 8px rgba(96,165,250,.6)}
input[type="range"].hero-overlay-range{width:100%;accent-color:var(--blue)}
.img-editor-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#1D2535;
  border:1px solid var(--border-hi);margin-bottom:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.img-editor-frame img{width:100%;height:100%;object-fit:cover;display:block;cursor:grab;-webkit-user-drag:none;user-drag:none;user-select:none;-webkit-user-select:none;pointer-events:auto}
.img-editor-frame img:active{cursor:grabbing}
.img-editor-hint{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:12px}
.img-editor-slider{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.img-editor-slider .label{margin:0;flex:none;color:var(--muted)}
.img-editor-slider input[type="range"]{flex:1;accent-color:var(--blue)}

/* ADMIN */

.topbar.admin-topbar{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;padding:11px 14px}
@media(min-width:900px){.topbar.admin-topbar{grid-template-columns:auto 1fr auto;padding:11px 24px;gap:18px;flex-wrap:nowrap}}
.adm-brand{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.adm-brand .name{font-weight:800;font-size:12.5px;letter-spacing:.13em;

.adm-sug-group{padding:6px 9px 4px;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-2);font-weight:800}

.adm-header-actions{display:flex;align-items:center;gap:7px;justify-self:end}
.adm-avatar{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#60A5FA,#A78BFA);

.adm-h2{font-size:11px;font-weight:800;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.adm-section{margin-bottom:22px}
.adm-section-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:10px}

.adm-section-head .link{font-size:11.5px;font-weight:700;color:var(--blue);display:inline-flex;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px}

.adm-stat .v.small{font-size:12.5px}
.adm-actions{display:flex;flex-direction:column;gap:7px}
.adm-action{display:flex;align-items:center;gap:11px;padding:12px 13px;
  background:var(--card);border:1px solid var(--border);border-radius:11px;

.adm-action:nth-child(3) .ic{background:rgba(167,139,250,.14);color:var(--purple)}

.adm-act:last-child{border-bottom:none}
.adm-act .t{font-size:10.5px;color:var(--muted-2);font-family:ui-monospace,monospace;flex:none;min-width:42px;padding-top:1px}
.adm-act .x{flex:1;min-width:0;font-size:12px;color:var(--text);line-height:1.5}
.adm-act .x strong{color:var(--blue);font-weight:700}
.adm-list{display:flex;flex-direction:column;gap:7px}

.adm-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}

  background:var(--card);color:var(--muted);font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.adm-chip.active{background:rgba(96,165,250,.16);border-color:rgba(96,165,250,.45);color:var(--blue)}
.adm-search-input{position:relative;display:flex;align-items:center;margin-bottom:12px}
.adm-search-input > svg.lucide{position:absolute;left:11px;width:14px;height:14px;color:var(--muted-2);pointer-events:none}

  padding:10px 11px 10px 32px;color:var(--text);font-size:12.5px;font-family:inherit;outline:none}
.adm-search-input input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(96,165,250,.18);background:var(--card-hi)}
.adm-info{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden}

.adm-empty .s{font-size:11.5px;color:var(--muted);margin-top:3px}

.adm-user-status{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:6px;

/* DRAWER */
.drawer-backdrop{position:fixed;inset:0;z-index:800;background:rgba(10,14,22,.65);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:900;
  width:min(320px,88vw);max-width:100%;background:linear-gradient(180deg,#1D2535,#171C28);
  border-right:1px solid var(--border-hi);
  display:flex;flex-direction:column;
  transform:translateX(-102%);transition:transform .28s var(--ease);
  box-shadow:24px 0 60px -20px rgba(0,0,0,.7);

/* =========================================================

const $  = (s, r = document) => r.querySelector(s);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtNumber = n => Number(n || 0).toLocaleString('vi-VN');

function hashCode(str){ let h = 0; for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) | 0; return Math.abs(h); }

/* =========================================================
   DATE / NAME COOLDOWN
   ========================================================= */
const VN_DAYS = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
function getVietnameseDate(d){
  d = d || new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return VN_DAYS[d.getDay()] + ', ngày ' + dd + '/' + mm + '/' + yyyy;
}
function currentDateKey(){ const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
let _lastDateKey = currentDateKey();
function refreshDateDisplays(){
  const els = document.querySelectorAll('[data-date-display]');
  if (!els.length) return;
  const s = getVietnameseDate();
  els.forEach(el => { if (el.textContent !== s) el.textContent = s; });
}
setInterval(() => { const k = currentDateKey(); if (k !== _lastDateKey){ _lastDateKey = k; refreshDateDisplays(); } }, 20000);
const NAME_CHANGE_COOLDOWN = 7*24*60*60*1000;
function canChangeName(user){
  if (!user || !user.lastNameChange) return { ok: true };
  const elapsed = Date.now() - user.lastNameChange;
  if (elapsed >= NAME_CHANGE_COOLDOWN) return { ok: true };
  return { ok: false, remainingMs: NAME_CHANGE_COOLDOWN - elapsed };
}
function fmtRemaining(ms){
  if (ms <= 0) return '0 phút';
  const totalMin = Math.floor(ms/60000);
  const d = Math.floor(totalMin/(24*60));
  const h = Math.floor((totalMin%(24*60))/60);
  const m = totalMin % 60;
  if (d > 0) return `${d} ngày ${h} giờ`;
  if (h > 0) return `${h} giờ ${m} phút`;
  return `${m} phút`;
}

/* =========================================================

const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const K = {
  users:'tb_users', session:'tb_session', adminSession:'tb_admin_session',

const ADMIN_EMAIL = 'quan810@gmail.com';
const DEFAULT_ADMIN_PASS_SEED = '123456';
const SERVICE_CONTACT_URL = 'https://www.facebook.com/share/1dB4HcZYoB/';
const ZALO_ADMIN_PHONE = '84369733791';

function isAdminSession(){ return LS.get(K.adminSession, false) === true; }
function setAdminSession(v){ if (v) LS.set(K.adminSession, true); else LS.del(K.adminSession); }
function isSuspended(user){ return !!(user && user.suspended); }
function demoHash(s){
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return 'demo$' + (h >>> 0).toString(16);
}
function ensureAdminHash(){ if (!LS.get(K.adminPassHash, null)) LS.set(K.adminPassHash, demoHash(DEFAULT_ADMIN_PASS_SEED)); }
function verifyAdminPassword(pw){
  const stored = LS.get(K.adminPassHash, null);
  if (!stored) return false;
  return demoHash(String(pw || '')) === stored;
}
function logAdminAction({action, targetUserId, reason, amount}){
  const log = LS.get(K.auditLog, []) || [];

function saveFormDraft(userId, data){ if (!userId) return false; return LS.set(K.formDraft(userId), Object.assign({}, data, { savedAt: Date.now() })); }

const HERO_DEFAULTS = { overlayOpacity: 0.72 };

  const raw = LS.get(K.heroSettings, {}) || {};

  const v = Number(merged.overlayOpacity);
  merged.overlayOpacity = isFinite(v) ? Math.max(0, Math.min(1, v)) : HERO_DEFAULTS.overlayOpacity;
  return merged;
}
function saveHeroSettings(s){ return LS.set(K.heroSettings, s); }

/* =========================================================
   IMAGE STORAGE (IndexedDB)
   ========================================================= */
const IMGDB = {
  _db: null,
  async open(){
    if (this._db) return this._db;
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('no-idb'));
      const req = indexedDB.open('webcuaquan_media_v1', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('images')){
          db.createObjectStore('images', { keyPath: 'key' });
        }
      };
      req.onsuccess = () => { this._db = req.result; resolve(this._db); };
      req.onerror = () => reject(req.error);
    });
  },
  async get(key){
    try {
      const db = await this.open();
      return new Promise((resolve) => {
        const tx = db.transaction('images', 'readonly');
        const req = tx.objectStore('images').get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
    } catch(e){ return null; }
  },
  async put(rec){
    try {
      const db = await this.open();
      return new Promise((resolve) => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').put(rec);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      });
    } catch(e){ return false; }
  },
  async del(key){
    try {
      const db = await this.open();
      return new Promise((resolve) => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').delete(key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      });
    } catch(e){ return false; }
  }
};

const IMG_CACHE = {};
const IMG_META = {};
const IMG_KEYS = [
  'logo','hero_bg','game_freefire',
  'carousel_0','carousel_1','carousel_2',
  'service_rankboost','service_topsung'
];

async function loadAllImagesToCache(){
  for (const k of IMG_KEYS){
    const rec = await IMGDB.get(k);
    if (rec && rec.data){
      IMG_CACHE[k] = rec.data;
      IMG_META[k] = {
        caption: rec.caption || '',
        yPos: (typeof rec.yPos === 'number') ? rec.yPos : 50,
        updatedAt: rec.updatedAt || 0
      };
    } else {
      delete IMG_CACHE[k];
      delete IMG_META[k];
    }
  }
}
function imgY(key){
  const m = IMG_META[key];
  return (m && typeof m.yPos === 'number') ? m.yPos : 50;
}
function imgPosStyle(key, extra){
  return `object-position:center ${imgY(key)}%;${extra || ''}`;
}
function heroBgY(){ return imgY('hero_bg'); }

/* =========================================================
   DATA
   ========================================================= */
const AV_COLORS = [
  'linear-gradient(135deg,#60A5FA,#3B82F6)',
  'linear-gradient(135deg,#A78BFA,#7C3AED)',
  'linear-gradient(135deg,#2DD4BF,#0D9488)',

];
const pickColor = () => AV_COLORS[Math.floor(Math.random() * AV_COLORS.length)];
function defaultData(){
  return {
    orders: [], favorites: { games: [], services: [], providers: [] }, notifications: [],
    wallet: { balance: 0, transactions: [], totalDeposited: 0 },
    settings: {
      emailNotif: true, pushNotif: true, orderUpdates: true, marketing: false,
      publicProfile: false, showStats: true, twoFactor: false, loginAlerts: true
    },
    tickets: [],
    announcementReads: {}
  };
}
function getUsers(){ return LS.get(K.users, []); }
function saveUsers(list){ return LS.set(K.users, list); }
function getCurrentUser(){ const id = LS.get(K.session, null); if (!id) return null; return getUsers().find(u => u.id === id) || null; }
function getData(){
  const u = getCurrentUser();
  if (!u) return null;
  const stored = LS.get(K.data(u.id), null);
  const def = defaultData();
  if (!stored) return def;
  const wallet = Object.assign({}, def.wallet, stored.wallet || {});
  if (typeof wallet.totalDeposited !== 'number'){
    wallet.totalDeposited = (wallet.transactions || [])
      .filter(t => t.amount > 0 && t.ref !== 'REFUND' && t.ref !== 'REVOKE' && t.ref !== 'ORDER' && t.ref !== 'ADMIN_GRANT')
      .reduce((s, t) => s + t.amount, 0);
  }
  return {
    orders: stored.orders || [],
    notifications: stored.notifications || [],
    tickets: stored.tickets || [],
    favorites: Object.assign({}, def.favorites, stored.favorites || {}),
    wallet,
    settings: Object.assign({}, def.settings, stored.settings || {}),
    announcementReads: Object.assign({}, def.announcementReads, stored.announcementReads || {})
  };
}
function saveData(d){
  const u = getCurrentUser();
  if (!u) return false;
  return LS.set(K.data(u.id), d);
}
function getAnnouncements(){ return LS.get(K.announcements, []) || []; }
function saveAnnouncements(list){ return LS.set(K.announcements, list); }
function publishAnnouncement(title, body){
  const list = getAnnouncements();
  const t = String(title||'').trim();
  const b = String(body||'').trim();
  if (!t || !b) return { ok:false, error:'Vui lòng nhập đầy đủ tiêu đề và nội dung.' };
  const dup = list.find(x => x.title === t && x.body === b && (Date.now() - x.time) < 8000);
  if (dup) return { ok:false, error:'Tin nhắn này vừa được gửi, vui lòng chờ vài giây.' };
  const recipientCount = getUsers().length;
  const ann = { id: uid('ann'), title: t, body: b, time: Date.now(), publisher: 'Quản trị viên', recipientCount, type: 'broadcast' };
  list.unshift(ann);
  if (list.length > 200) list.length = 200;
  if (!saveAnnouncements(list)) return { ok:false, error:'Không thể lưu.' };
  logAdminAction({ action: 'broadcast_message', reason: t });
  return { ok:true, ann, recipientCount };
}
function sendPrivateMessage(targetUserId, title, body){
  const t = String(title||'').trim();
  const b = String(body||'').trim();
  if (!t || !b) return { ok:false, error:'Vui lòng nhập tiêu đề và nội dung.' };
  const stored = LS.get(K.data(targetUserId), null);
  const def = defaultData();
