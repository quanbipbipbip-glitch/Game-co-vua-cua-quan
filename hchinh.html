function isValidGmail(email){
  const s = String(email || '').trim().toLowerCase();
  return /^[a-zA-Z0-9._%+\-]+@gmail\.com$/.test(s);
}
function registerUser({ username, email, password }){
  const users = getUsers();
  email = String(email || '').trim().toLowerCase();
  const uname = String(username || '').trim();
  if (uname.length < 3) return { ok:false, error:'Tên hiển thị phải có ít nhất 3 ký tự.' };
  if (!email) return { ok:false, error:'Vui lòng nhập email.' };
  if (!isValidGmail(email)) return { ok:false, error:'Email phải có định dạng @gmail.com (ví dụ: ten@gmail.com).' };
  if (String(password).length < 6) return { ok:false, error:'Mật khẩu phải có ít nhất 6 ký tự.' };
  if (email === ADMIN_EMAIL) return { ok:false, error:'Email này không thể đăng ký.' };
  if (users.some(u => u.email === email)) return { ok:false, error:'Email này đã được đăng ký.' };
  if (users.some(u => String(u.username||'').toLowerCase() === uname.toLowerCase())) return { ok:false, error:'Tên hiển thị này đã được sử dụng.' };
  const user = { id: uid('u'), username: uname, email, pass: demoHash(password),
    createdAt: Date.now(), color: pickColor(), avatar: null, lastNameChange: Date.now(), suspended: false };
  users.push(user);
  if (!saveUsers(users)) return { ok:false, error:'Không thể lưu tài khoản.' };
  LS.set(K.session, user.id);
  setAdminSession(false);
  const d = defaultData();
  d.notifications.push({
    id: uid('n'), title: 'Chào mừng đến Webcuaquan',
    body: 'Tài khoản của bạn đã sẵn sàng. Nạp xu vào ví và đặt đơn Free Fire đầu tiên.',
    time: Date.now(), read: false, type: 'welcome'
  });
  LS.set(K.data(user.id), d);
  return { ok:true, user };
}
function loginUser(email, password){
  email = String(email || '').trim().toLowerCase();
  if (email === ADMIN_EMAIL){
    ensureAdminHash();
    if (verifyAdminPassword(password)){
      setAdminSession(true);
      LS.del(K.session);
      return { ok:true, isAdmin:true };
    }
    return { ok:false, error:'Mật khẩu quản trị không đúng.' };
  }
  const users = getUsers();
  const user = users.find(u => u.email === email);
  if (!user) return { ok:false, error:'Không tìm thấy tài khoản với email này.' };
  if (user.pass !== demoHash(password)) return { ok:false, error:'Mật khẩu không đúng.' };
  if (user.suspended) return { ok:false, error:'Tài khoản của bạn đã bị đình chỉ. Vui lòng liên hệ bộ phận hỗ trợ để được kiểm tra.' };
  setAdminSession(false);
  LS.set(K.session, user.id);
  return { ok:true, user };
}
function logoutUser(){ LS.del(K.session); }
function updateUser(patch){
  const u = getCurrentUser();
  if (!u) return false;
  const users = getUsers();
  const i = users.findIndex(x => x.id === u.id);
  if (i < 0) return false;
  users[i] = Object.assign({}, users[i], patch);
  return saveUsers(users);
}

   ========================================================= */
let _openSelectWrap = null;
function initCustomSelects(root){
  root = root || document;
  root.querySelectorAll('[data-custom-select]').forEach(wrap => {
    if (wrap.dataset.csInit) return;
    wrap.dataset.csInit = '1';
    const sel = wrap.querySelector('.cd-select-native');
    const trigger = wrap.querySelector('.cd-select-trigger');
    const menu = wrap.querySelector('.cd-select-menu');
    const valueEl = wrap.querySelector('.cd-select-value');
    if (!sel || !trigger || !menu || !valueEl) return;
    const placeholder = wrap.dataset.placeholder || 'Chọn';
    const portal = wrap.dataset.portal === 'true';
    menu.innerHTML = Array.from(sel.options).map(o =>
      `<button type="button" class="cd-select-option" role="option" data-value="${esc(o.value)}" ${o.disabled?'disabled':''}>${esc(o.textContent)}</button>`).join('');
    const updateLabel = () => {
      const cur = sel.value;
      const found = Array.from(sel.options).find(o => o.value === cur);
      if (cur && found){ valueEl.textContent = found.textContent; valueEl.classList.remove('placeholder'); }
      else { valueEl.textContent = placeholder; valueEl.classList.add('placeholder'); }
      menu.querySelectorAll('.cd-select-option').forEach(b => b.classList.toggle('selected', b.dataset.value === cur));
    };
    updateLabel();
    function positionMenu(){
      if (!portal) return;
      const r = trigger.getBoundingClientRect();
      const spaceBelow = window.innerHeight - r.bottom;
      const spaceAbove = r.top;
      const menuHeight = Math.min(250, menu.scrollHeight || 250);
      const goUp = spaceBelow < menuHeight + 20 && spaceAbove > spaceBelow;
      menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - r.width - 8)) + 'px';
      menu.style.width = r.width + 'px';
      if (goUp){ menu.style.top='auto'; menu.style.bottom=(window.innerHeight - r.top + 6)+'px'; menu.classList.add('cd-up'); }
      else { menu.style.bottom='auto'; menu.style.top=(r.bottom + 6)+'px'; menu.classList.remove('cd-up'); }
    }
    function openMenu(){
      if (_openSelectWrap && _openSelectWrap !== wrap){
        _openSelectWrap.classList.remove('open');
        const t = _openSelectWrap.querySelector('.cd-select-trigger');
        if (t) t.setAttribute('aria-expanded','false');
      }
      _openSelectWrap = wrap;
      wrap.classList.add('open');
      trigger.setAttribute('aria-expanded','true');
      if (portal){
        if (menu.parentNode !== document.body) document.body.appendChild(menu);
        menu.classList.add('cd-portal');
        positionMenu();
        menu.style.display = 'block';
      }
    }
    function closeMenu(){
      wrap.classList.remove('open');
      trigger.setAttribute('aria-expanded','false');
      if (portal) menu.style.display = '';
      if (_openSelectWrap === wrap) _openSelectWrap = null;
    }
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      if (wrap.classList.contains('open')) closeMenu(); else openMenu();
    });
    menu.addEventListener('click', (e) => {
      const b = e.target.closest('.cd-select-option');
      if (!b || b.disabled) return;
      e.stopPropagation();
      sel.value = b.dataset.value;
      sel.dispatchEvent(new Event('change', { bubbles: true }));
      sel.dispatchEvent(new Event('input', { bubbles: true }));
      closeMenu();
      updateLabel();
    });
    sel.addEventListener('change', updateLabel);
    if (portal){
      window.addEventListener('scroll', () => { if (wrap.classList.contains('open')) positionMenu(); }, true);
      window.addEventListener('resize', () => { if (wrap.classList.contains('open')) positionMenu(); });
    }
  });
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('[data-custom-select]') && !e.target.closest('.cd-select-menu')){
    document.querySelectorAll('[data-custom-select].open').forEach(w => {
      w.classList.remove('open');
      const t = w.querySelector('.cd-select-trigger');
      if (t) t.setAttribute('aria-expanded','false');
    });
    _openSelectWrap = null;
  }
});
function customSelectHTML(name, options, currentValue, placeholder, portal){
  const opts = options.map(o => {
    const v = typeof o === 'object' ? o.value : o;
    const l = typeof o === 'object' ? o.label : o;
    const sel = String(v) === String(currentValue) ? ' selected' : '';
    return `<option value="${esc(v)}"${sel}>${esc(l)}</option>`;
  }).join('');
  return `
    <div class="cd-select" data-custom-select data-placeholder="${esc(placeholder||'Chọn')}"${portal?' data-portal="true"':''}>
      <select name="${esc(name)}" class="cd-select-native">${opts}</select>
      <button type="button" class="cd-select-trigger" aria-haspopup="listbox" aria-expanded="false">
        <span class="cd-select-value placeholder">${esc(placeholder||'Chọn')}</span>
        ${ic('chevron-down')}
      </button>
      <div class="cd-select-menu" role="listbox"></div>
    </div>`;
}
function updateCustomSelectOptions(wrap, options, placeholder){
  if (!wrap) return;
  const sel = wrap.querySelector('.cd-select-native');
  const menu = wrap.querySelector('.cd-select-menu');
  const valueEl = wrap.querySelector('.cd-select-value');
  if (!sel || !menu || !valueEl) return;
  const ph = placeholder || wrap.dataset.placeholder || 'Chọn';
  wrap.dataset.placeholder = ph;
  sel.innerHTML = `<option value="">${esc(ph)}</option>` +
    options.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('');
  menu.innerHTML = `<button type="button" class="cd-select-option" role="option" data-value="">${esc(ph)}</button>` +
    options.map(o => `<button type="button" class="cd-select-option" role="option" data-value="${esc(o.value)}">${esc(o.label)}</button>`).join('');
  sel.value = '';
  valueEl.textContent = ph;
  valueEl.classList.add('placeholder');
  menu.querySelectorAll('.cd-select-option').forEach(b => b.classList.toggle('selected', b.dataset.value === ''));
}

          ${caps[i] ? `<div class="cap">${esc(caps[i])}</div>` : ''}
        </div>
      `).join('')}
    </div>
    <div class="carousel-dots">
      ${[0,1,2].map(i => `<button type="button" class="carousel-dot ${i===0?'active':''}" data-carousel-dot="${i}" aria-label="Ảnh ${i+1}"></button>`).join('')}
    </div>

let _carouselTimer = null;
function initCarousel(){
  const el = document.getElementById('ffCarousel');
  if (!el) { if (_carouselTimer){ clearInterval(_carouselTimer); _carouselTimer = null; } return; }
  if (_carouselTimer){ clearInterval(_carouselTimer); _carouselTimer = null; }
  const track = el.querySelector('.carousel-track');
  const slides = el.querySelectorAll('.carousel-slide');
  const dots = el.querySelectorAll('.carousel-dot');
  if (!track || slides.length < 2) return;
  let idx = 0;
  const total = slides.length;
  const go = (i) => {
    idx = ((i % total) + total) % total;
    track.style.transform = `translateX(-${idx * 100}%)`;
    dots.forEach((d, k) => d.classList.toggle('active', k === idx));
  };
  const start = () => {
    if (_carouselTimer) clearInterval(_carouselTimer);
    _carouselTimer = setInterval(() => go(idx + 1), CONFIG.CAROUSEL_INTERVAL);
  };
  const stop = () => { if (_carouselTimer){ clearInterval(_carouselTimer); _carouselTimer = null; } };
  dots.forEach((d, i) => d.addEventListener('click', (e) => { e.stopPropagation(); go(i); start(); }));
  let startX = 0, startY = 0, moved = false;
  el.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; moved = false; stop(); }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) moved = true;
  }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (!moved){ start(); return; }
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) < 40){ start(); return; }
    go(idx + (dx < 0 ? 1 : -1));
    start();
  });
  el.addEventListener('mouseenter', stop);
  el.addEventListener('mouseleave', start);
  go(0);
  start();
}

function makeOrderId(){
  const d = getData();
  const existing = new Set((d && d.orders ? d.orders : []).map(o => String(o.id)));
  for (let i = 0; i < 300; i++){
    const num = Math.floor(10000 + Math.random() * 90000);
    const id = 'WQ' + num;
    if (!existing.has(id)) return id;
  }

function genRefCode(){ return 'NAP-' + Date.now().toString(36).toUpperCase().slice(-6); }
function fakeQR(seed, size){
  size = size || 21;
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = ((h << 5) - h + seed.charCodeAt(i)) | 0;
  const rand = (x, y) => { let v = (h ^ Math.imul(x,73856093) ^ Math.imul(y,19349663)) | 0; v = Math.imul(v,2654435761)|0; return ((v>>>0)%100)<48; };
  const isFinder = (x,y) => (x<7&&y<7)||(x>=size-7&&y<7)||(x<7&&y>=size-7);
  const finder = (ox,oy) => { let s=''; for (let y=0;y<7;y++) for (let x=0;x<7;x++){ const outer=x===0||y===0||x===6||y===6, inner=x>=2&&x<=4&&y>=2&&y<=4; if (outer||inner) s += `<rect x="${ox+x}" y="${oy+y}" width="1" height="1"/>`; } return s; };
  let cells = finder(0,0) + finder(size-7,0) + finder(0,size-7);
  for (let y=0;y<size;y++) for (let x=0;x<size;x++){ if (isFinder(x,y)) continue; if (rand(x,y)) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block"><rect width="${size}" height="${size}" fill="#fff"/><g fill="#000">${cells}</g></svg>`;
}

function applyThousandsSeparator(rawValue){

  return { formatted: numeric.toLocaleString('vi-VN'), numeric };
}
function bindPayAmountInput(){
  const inp = $('#payAmountInput');

    const prevPos = inp.selectionStart;
    const prevLen = inp.value.length;
    const { formatted, numeric } = applyThousandsSeparator(inp.value);
    payAmount = numeric;
    if (inp.value !== formatted){
      inp.value = formatted;
      const addedSeparators = formatted.length - prevLen;
      let newPos = prevPos + addedSeparators;
      if (newPos < 0) newPos = 0;
      if (newPos > formatted.length) newPos = formatted.length;
      try { inp.setSelectionRange(newPos, newPos); } catch(e){}
    }

  if (!stored) return { ok:false, error:'Không tìm thấy dữ liệu người dùng.' };

function computeLeaderboard(){
  const users = getUsers().filter(u => !u.suspended);
  const rows = [];
  users.forEach(u => {
    const stored = LS.get(K.data(u.id), null);
    if (!stored) return;
    const wallet = stored.wallet || {};
    let total = wallet.totalDeposited;
    if (typeof total !== 'number'){
      const txs = wallet.transactions || [];
      total = txs.filter(t =>
        t.amount > 0 && t.ref !== 'REFUND' && t.ref !== 'REVOKE' &&
        t.ref !== 'ORDER' && t.ref !== 'ADMIN_GRANT'
      ).reduce((s,t) => s + t.amount, 0);
    }
    if (total > 0) rows.push({ userId:u.id, username:u.username, avatar:u.avatar, color:u.color, createdAt:u.createdAt, total });
  });
  rows.sort((a, b) => {
    if (b.total !== a.total) return b.total - a.total;
    return a.createdAt - b.createdAt;
  });
  return rows.slice(0, 10);
}

/* =========================================================
   NOTIFICATIONS
   ========================================================= */
function getUnifiedNotifications(){
  const u = getCurrentUser(); if (!u) return [];
  const d = getData(); if (!d) return [];
  const own = d.notifications.map(n => Object.assign({}, n, { _kind: 'own' }));
  const anns = getAnnouncements().map(a => ({
    id: a.id, title: a.title, body: a.body, time: a.time,
    read: !!d.announcementReads[a.id],
    type: 'announcement', _kind: 'announcement',
    recipientCount: a.recipientCount
  }));
  return own.concat(anns).sort((a,b) => b.time - a.time);
}
function iconForNotif(n){
  const t = n.type || '';
  if (t === 'private-message') return 'mail';
  if (t === 'order-created') return 'receipt';
  if (t === 'order-cancelled') return 'x';
  if (t === 'order-status') return 'activity';
  if (t === 'order-completed') return 'check-circle';
  if (t === 'wallet-topup') return 'coins';
  if (t === 'wallet-refund') return 'rotate-ccw';
  if (t === 'welcome') return 'sparkles';
  if (t === 'announcement' || t === 'broadcast') return 'megaphone';
  return 'info';
}
function tagForNotif(n){
  const t = n.type || '';
  if (t === 'private-message') return 'Tin nhắn';
  if (t === 'announcement' || t === 'broadcast') return 'Hệ thống';
  if (t === 'order-created' || t === 'order-status' || t === 'order-cancelled' || t === 'order-completed') return 'Đơn hàng';
  if (t === 'wallet-topup' || t === 'wallet-refund') return 'Ví';
  if (t === 'welcome') return 'Chào mừng';
  return '';
}
function notifIconClass(n){
  if (n.type === 'private-message') return 'notif-ico private';
  if (n.type === 'announcement' || n.type === 'broadcast') return 'notif-ico system';
  return 'notif-ico';
}
function navTargetForNotif(n){
  if (n._kind === 'own'){
    if (n.orderId) return '#/order/' + n.orderId;
    if (n.type === 'wallet-topup' || n.type === 'wallet-refund') return '#/wallet';
  }
  return '';
}
function markNotificationRead(notif){
  const u = getCurrentUser(); if (!u) return;
  const d = getData(); if (!d) return;
  if (notif._kind === 'announcement') d.announcementReads[notif.id] = true;
  else { const own = d.notifications.find(x => x.id === notif.id); if (own) own.read = true; }
  saveData(d); updateNotifBadge();
}
function markAllNotificationsRead(){
  const u = getCurrentUser(); if (!u) return;
  const d = getData(); if (!d) return;
  d.notifications.forEach(n => n.read = true);
  getAnnouncements().forEach(a => { d.announcementReads[a.id] = true; });
  saveData(d); updateNotifBadge();
  toast('Đã đánh dấu tất cả đã đọc', 'success');
}
function notifItemHTML(n){
  const nav = navTargetForNotif(n);
  const cls = 'notif-item' + (n.read ? '' : ' unread') + (nav ? ' nav' : '');
  const attrs = nav ? ` data-nav="${esc(nav)}"` : '';
  const iconCls = notifIconClass(n);
  const tagCls = n.type === 'private-message' ? 'n-tag private' : 'n-tag';
  return `<div class="${cls}"${attrs} data-notif-id="${esc(n.id)}" data-notif-kind="${n._kind}">
    <div class="${iconCls}">${ic(iconForNotif(n))}</div>
    <div class="notif-body">
      <div class="n-title">${esc(n.title)}</div>
      <div class="n-body">${esc(n.body)}</div>
      <div class="n-time">${tagForNotif(n) ? `<span class="${tagCls}">${esc(tagForNotif(n))}</span>` : ''}${timeAgo(n.time)}</div>
    </div>
  </div>`;
}
function renderNotificationPanelHTML(){
  const u = getCurrentUser(); if (!u) return '';
  const list = getUnifiedNotifications();
  const unread = list.filter(x => !x.read).length;
  const top = list.slice(0, 10);
  return `
    <div class="notif-head">
      <h4>Thông báo ${unread > 0 ? `<span class="notif-count-badge">${unread} chưa đọc</span>` : ''}</h4>
      <div class="notif-head-actions">
        <button type="button" class="notif-mark-btn" data-action="mark-all-read" ${unread === 0 ? 'disabled' : ''}>Đánh dấu tất cả đã đọc</button>
      </div>
    </div>
    <div class="notif-list">
      ${top.length ? top.map(notifItemHTML).join('') : `<div class="notif-empty">

    ${list.length > 0 ? `<div class="notif-foot"><a href="#/notifications" data-action="notif-view-all">Xem tất cả (${list.length})</a></div>` : ''}
  `;
}
function ensureNotificationPanelEl(){
  let panel = document.getElementById('notifPanel');
  if (!panel){
    panel = document.createElement('div');
    panel.id = 'notifPanel';
    panel.className = 'notif-panel';
    document.body.appendChild(panel);
  }
  return panel;
}
function openNotificationPanel(){
  const u = getCurrentUser();
  if (!u){ toast('Vui lòng đăng nhập để xem thông báo', 'info'); go('#/login'); return; }
  const panel = ensureNotificationPanelEl();
  panel.innerHTML = renderNotificationPanelHTML();
  panel.classList.add('open');
  refreshIcons();
}
function closeNotificationPanel(){
  const panel = document.getElementById('notifPanel');
  if (panel) panel.classList.remove('open');
}
function toggleNotificationPanel(){
  const panel = document.getElementById('notifPanel');
  if (panel && panel.classList.contains('open')) closeNotificationPanel();
  else openNotificationPanel();
}
function bindNotificationButtons(){
  const btn = document.getElementById('notifBtn');
  if (btn && !btn.dataset.bound){
    btn.dataset.bound = '1';
    btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleNotificationPanel(); });
  }
  const admBtn = document.getElementById('adminNotifBtn');
  if (admBtn && !admBtn.dataset.bound){
    admBtn.dataset.bound = '1';
    admBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleAdminNotifPanel(); });
  }
}
document.addEventListener('click', (e) => {
  const panel = document.getElementById('notifPanel');
  if (panel && panel.classList.contains('open')){
    if (!panel.contains(e.target) && !e.target.closest('#notifBtn')) closeNotificationPanel();
  }
  const admPanel = document.getElementById('admNotifPanel');
  if (admPanel){
    if (!admPanel.contains(e.target) && !e.target.closest('#adminNotifBtn')) admPanel.remove();
  }
});
function updateNotifBadge(){
  const el = $('#notifBadge'); if (!el) return;
  const u = getCurrentUser(); if (!u){ el.style.display = 'none'; return; }
  const d = getData(); if (!d){ el.style.display = 'none'; return; }
  const ownUnread = d.notifications.filter(x => !x.read).length;
  const annUnread = getAnnouncements().filter(a => !d.announcementReads[a.id]).length;
  const n = ownUnread + annUnread;
  el.style.display = n ? 'grid' : 'none';
  el.textContent = n > 9 ? '9+' : n;
}
function toast(msg, type){
  type = type || 'success';
  const wrap = $('#toasts'); if (!wrap) return;
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info';
  t.innerHTML = ic(icon) + '<span>' + esc(msg) + '</span>';
  wrap.appendChild(t); refreshIcons();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 280); }, 2800);
}
function openModal(html){

function viewOrderDetail(route){
  const id = route.parts[1];
  const d = getData();
  const o = d.orders.find(x => x.id === id);
  if (!o) return notFound();
  const isAwaiting = o.status === 'awaiting_account';
  const steps = ['Đơn đã tạo','Đang ghép người cày','Người cày đã nhận','Đang thực hiện','Hoàn thành'];
  let doneCount = 1;
  if (o.status === 'pending' || isAwaiting) doneCount = 1;
  else if (o.status === 'progress') doneCount = 4;
  else if (o.status === 'completed') doneCount = 5;
  const timeline = o.status === 'cancelled'
    ? `<div class="tl">
        <div class="tl-item done"><span class="tl-dot"></span><div class="tl-title">Đơn đã tạo</div><div class="tl-time">${fmtDateTime(o.createdAt)}</div></div>
        <div class="tl-item done"><span class="tl-dot"></span><div class="tl-title" style="color:#FCA5A5">Đơn đã huỷ${o.refunded?' · Đã hoàn tiền':''}</div><div class="tl-time">${fmtDateTime(o.updatedAt||o.createdAt)}</div></div>
      </div>`
    : `<div class="tl">${steps.map((label, i) => {
        const done = i < doneCount;
        const current = i === doneCount - 1 && o.status !== 'completed';
        return `<div class="tl-item ${done?'done':''} ${current?'current':''}">
          <span class="tl-dot"></span>
          <div class="tl-title">${label}</div>
          <div class="tl-time">${done ? fmtDateTime(o.createdAt + i*60000*7) : 'Đang chờ'}</div>
        </div>`;
      }).join('')}</div>`;
  const canCancel = o.status === 'pending' || isAwaiting || o.status === 'progress';
  return `
  <a class="link" href="#/orders" style="margin-bottom:12px;display:inline-flex">${ic('chevron-left')} Đơn hàng của tôi</a>
  <div class="card pad" style="padding:16px">

          <button type="button" class="copy-btn" data-action="copy-text" data-text="${esc(fmtOrderId(o.id))}">${ic('copy')}</button>
        </div>
        <h1 style="font-size:18px;margin-top:2px">${esc(o.serviceName)}</h1>
        <div class="meta">${esc(o.gameName)}</div>
      </div>
      ${statusBadge(o.status)}
    </div>
    <div class="summary" style="margin-top:14px">
      ${o.gameModeLabel ? `<div class="price-row"><span>Chế độ chơi</span><span>${esc(o.gameModeLabel)}</span></div>` : ''}
      ${o.currentRank && o.currentRank !== '—' ? `<div class="price-row"><span>Rank hiện tại</span><span>${esc(o.currentRank)}</span></div>` : ''}
      ${o.targetRank && o.targetRank !== '—' ? `<div class="price-row"><span>Rank mục tiêu</span><span>${esc(o.targetRank)}</span></div>` : ''}
      ${o.rankSteps ? `<div class="price-row"><span>Số bậc</span><span>${o.rankSteps} bậc</span></div>` : ''}
      <div class="price-row" style="align-items:center">
        <span>UID / ID người chơi</span>
        <span style="display:flex;justify-content:flex-end;min-width:0">
          <span class="copy-inline"><span class="mono">${esc(o.playerId)}</span>
          <button type="button" class="copy-btn" data-action="copy-text" data-text="${esc(o.playerId)}">${ic('copy')}</button></span>
        </span>
      </div>
      <div class="price-row"><span>Ngày tạo</span><span>${fmtDateTime(o.createdAt)}</span></div>
      <div class="price-row total"><span>Tổng xu</span><span>${fmtCoins(o.total)}</span></div>
      ${o.refunded ? `<div class="price-row" style="color:#86EFAC"><span>Đã hoàn xu</span><span style="color:#86EFAC">+${fmtCoins(o.total)}</span></div>` : ''}
    </div>
  </div>
  ${isAwaiting ? `
    <div class="info-box warn" style="margin-top:14px">${ic('alert-circle')}<span>Đơn hàng đang chờ bàn giao tài khoản. Vui lòng liên hệ người cày rank để trao đổi.</span></div>

let avatarFileInput = null;
function ensureAvatarInput(){
  if (!avatarFileInput){
    avatarFileInput = document.createElement('input');
    avatarFileInput.type = 'file'; avatarFileInput.accept = 'image/*';
    avatarFileInput.style.display = 'none';
    avatarFileInput.addEventListener('change', handleAvatarFile);
    document.body.appendChild(avatarFileInput);
  }
  return avatarFileInput;
}
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read-failed'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('img-load-failed'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h){ if (w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if (h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(c.toDataURL('image/jpeg', quality)); } catch(err){ reject(err); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handleAvatarFile(e){
  const file = e.target.files && e.target.files[0];
  if (avatarFileInput) avatarFileInput.value = '';
  if (!file) return;
  if (!file.type || !file.type.startsWith('image/')){ toast('Vui lòng chọn file ảnh', 'error'); return; }
  if (file.size > 5*1024*1024){ toast('Ảnh phải nhỏ hơn 5MB', 'error'); return; }
  try {
    const dataUrl = await resizeImage(file, 320, 0.82);
    if (!updateUser({ avatar: dataUrl })){ toast('Không thể lưu ảnh.', 'error'); return; }
    toast('Đã cập nhật ảnh đại diện', 'success');
    const wasOpen = !!document.querySelector('.modal [data-form="edit-profile"]');
    render();
    if (wasOpen) editProfileModal();
  } catch (err){ toast('Không thể xử lý ảnh', 'error'); }
}

let imageFileInput = null;
let _pendingImageKey = null;
let _pendingImageDataUrl = null;
let imgEditorState = null;

function ensureImageFileInput(){
  if (!imageFileInput){
    imageFileInput = document.createElement('input');
    imageFileInput.type = 'file';
    imageFileInput.accept = 'image/png,image/jpeg,image/webp,image/gif';
    imageFileInput.style.display = 'none';
    imageFileInput.addEventListener('change', handleImageFileChange);
    document.body.appendChild(imageFileInput);
  }
  return imageFileInput;
}
async function handleImageFileChange(e){
  const file = e.target.files && e.target.files[0];
  if (imageFileInput) imageFileInput.value = '';
  const key = _pendingImageKey;
  _pendingImageKey = null;
  if (!file || !key) return;
  if (!isAdminSession()){ toast('Chỉ quản trị viên mới có thể tải ảnh', 'error'); return; }
  if (!file.type || !file.type.startsWith('image/')){ toast('Vui lòng chọn file ảnh hợp lệ', 'error'); return; }
  if (file.size > CONFIG.MAX_IMAGE_SIZE){ toast('Ảnh phải nhỏ hơn ' + (CONFIG.MAX_IMAGE_SIZE/(1024*1024)) + 'MB', 'error'); return; }
  const maxDim = key === 'logo' ? CONFIG.IMG_MAX_DIM_LOGO : CONFIG.IMG_MAX_DIM_WIDE;
  const quality = key === 'logo' ? CONFIG.IMG_QUALITY_LOGO : CONFIG.IMG_QUALITY_WIDE;
  try {
    toast('Đang xử lý ảnh...', 'info');
    const dataUrl = await resizeImage(file, maxDim, quality);
    _pendingImageDataUrl = dataUrl;
    openImageEditor(key, dataUrl);
  } catch(err){
    toast('Không thể xử lý ảnh', 'error');
  }
}
function requestImageUpload(key){
  if (!isAdminSession()){ toast('Chỉ quản trị viên mới có thể tải ảnh', 'error'); return; }
  _pendingImageKey = key;
  ensureImageFileInput().click();
}

  const startY = (typeof existing.yPos === 'number') ? existing.yPos : 50;
  imgEditorState = { key, dataUrl, yPos: startY };

function updateImageEditorPreview(){
  if (!imgEditorState) return;
  const img = document.getElementById('imgEditorImg');
  const range = document.getElementById('imgEditorRange');
  const val = document.getElementById('imgEditorValue');
  if (img) img.style.objectPosition = `center ${imgEditorState.yPos}%`;
  if (range) range.value = String(Math.round(imgEditorState.yPos));
  if (val) val.textContent = Math.round(imgEditorState.yPos) + '%';
}
function attachImageEditorHandlers(){
  const frame = document.getElementById('imgEditorFrame');
  const img = document.getElementById('imgEditorImg');
  const range = document.getElementById('imgEditorRange');
  if (!frame || !img || !range || !imgEditorState) return;

  range.addEventListener('input', () => {
    imgEditorState.yPos = Number(range.value);
    updateImageEditorPreview();
  });

  let dragging = false, startPointerY = 0, startYPos = 0, frameH = 1;
  const onDown = (e) => {
    dragging = true;
    startPointerY = e.clientY;
    startYPos = imgEditorState.yPos;
    frameH = frame.getBoundingClientRect().height || 1;
    img.style.cursor = 'grabbing';
    if (e.preventDefault) e.preventDefault();
  };
  const onMove = (e) => {
    if (!dragging) return;
    const deltaY = e.clientY - startPointerY;
    let next = startYPos - (deltaY / frameH) * 100;
    next = Math.max(0, Math.min(100, next));
    imgEditorState.yPos = next;
    updateImageEditorPreview();
    if (e.preventDefault) e.preventDefault();
  };
  const onUp = () => { dragging = false; img.style.cursor = 'grab'; };

  img.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  window._imgEditorCleanup = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
  };
}

function setFieldError(field, msg){
  if (!field) return;
  const errEl = field.querySelector('.field-error');
  if (msg){ field.classList.add('invalid'); if (errEl){ errEl.textContent = msg; errEl.classList.add('show'); } }
  else { field.classList.remove('invalid'); if (errEl){ errEl.textContent = ''; errEl.classList.remove('show'); } }
}
function getFFFieldError(field, form){
  const svcId = form.dataset.svcId;
  const svc = FF_SERVICES.find(s => s.id === svcId);
  if (!svc) return '';
  const key = field.dataset.field;
  const el = field.querySelector('input, select');
  const val = (el && el.value || '').trim();
  if (key === 'playerId'){
    if (!val) return 'Vui lòng nhập UID';
    if (!/^\d+$/.test(val)) return 'UID chỉ được chứa chữ số';
    if (val.length < 7 || val.length > 13) return 'UID phải từ 7-13 chữ số';
    return '';
  }
  if (svc.type === 'rankboost'){
    if (key === 'mode') return val ? '' : 'Vui lòng chọn chế độ chơi';
    if (key === 'currentGroup') return val ? '' : 'Vui lòng chọn nhóm rank hiện tại';
    if (key === 'currentDivision') return val ? '' : 'Vui lòng chọn bậc rank hiện tại';
    if (key === 'targetGroup') return val ? '' : 'Vui lòng chọn nhóm rank mục tiêu';
    if (key === 'targetDivision'){
      if (!val) return 'Vui lòng chọn bậc rank mục tiêu';
      const mode = (form.querySelector('[name="mode"]')||{}).value || '';
      const curG = (form.querySelector('[name="currentGroup"]')||{}).value || '';
      const curD = (form.querySelector('[name="currentDivision"]')||{}).value || '';
      const tgtG = (form.querySelector('[name="targetGroup"]')||{}).value || '';
      if (!mode || !curG || !curD || !tgtG) return '';
      const list = ffRankCanonicalList(mode);
      const curIdx = list.findIndex(r => r.groupId === curG && r.division === curD);
      const tgtIdx = list.findIndex(r => r.groupId === tgtG && r.division === val);
      if (curIdx !== -1 && tgtIdx !== -1){
        if (tgtIdx === curIdx) return 'Rank mục tiêu phải khác rank hiện tại';
        if (tgtIdx < curIdx) return 'Rank mục tiêu phải cao hơn rank hiện tại';
      }
      return '';
    }
  }
  if (svc.type === 'topsung'){
    if (key === 'topTarget') return val ? '' : 'Vui lòng chọn mốc top';
  }
  return '';
}
function calcFFPrice(form){
  const svcId = form.dataset.svcId;
  const svc = FF_SERVICES.find(s => s.id === svcId);
  if (!svc) return { price: 0, rows: [] };
  if (svc.type === 'rankboost'){
    const mode = (form.querySelector('[name="mode"]')||{}).value || '';
    const curG = (form.querySelector('[name="currentGroup"]')||{}).value || '';
    const curD = (form.querySelector('[name="currentDivision"]')||{}).value || '';
    const tgtG = (form.querySelector('[name="targetGroup"]')||{}).value || '';
    const tgtD = (form.querySelector('[name="targetDivision"]')||{}).value || '';
    if (!mode || !curG || !curD || !tgtG || !tgtD) return { price: 0, rows: [] };
    const list = ffRankCanonicalList(mode);
    const curIdx = list.findIndex(r => r.groupId === curG && r.division === curD);
    const tgtIdx = list.findIndex(r => r.groupId === tgtG && r.division === tgtD);
    if (curIdx === -1 || tgtIdx === -1 || tgtIdx <= curIdx) return { price: 0, rows: [] };
    const steps = FF_RANK_STEP_PRICES[mode] || [];
    if (!steps.length) return { price: 0, rows: [] };
    let total = 0; const rows = [];
    for (let i = curIdx; i < tgtIdx; i++){
      const step = steps[i] || 0;
      rows.push({ from: list[i].display, to: list[i+1].display, price: step });
      total += step;
    }
    return { price: total, rows, stepsCount: tgtIdx - curIdx };
  }
  if (svc.type === 'topsung'){
    const tgtEl = form.querySelector('[name="topTarget"]');
    const val = tgtEl ? tgtEl.value : '';
    if (!val) return { price: 0, rows: [] };
    const found = TOP_GUN_PRICES.find(t => t.value === val);
    if (!found) return { price: 0, rows: [] };
    return { price: found.price, rows: [{ label: 'Mốc ' + found.label, price: found.price }] };
  }
  return { price: 0, rows: [] };
}
function renderFFPriceSummary(form){
  const out = form.querySelector('[data-price-summary]');
  if (!out) return;
  const { price, rows } = calcFFPrice(form);
  if (!price || !rows.length){
    out.innerHTML = '<div class="price-row total" style="border-top:none;margin-top:0;padding-top:0"><span>Giá dịch vụ</span><span>—</span></div>';
    return;
  }
  if (rows.length > 5){
    out.innerHTML = `
      <div class="price-row"><span>Mốc đã chọn</span><span>${esc(rows[0].from)} → ${esc(rows[rows.length-1].to)}</span></div>
      <div class="price-row"><span>Số bậc</span><span>${rows.length} bậc</span></div>
      <div class="price-row total"><span>Tổng dự kiến</span><span>${fmtCoins(price)}</span></div>`;
    return;
  }
  const rowsHTML = rows.map(r => {
    const label = r.label || ('Bậc ' + r.from + ' → ' + r.to);
    return `<div class="price-row"><span>${esc(label)}</span><span>${fmtCoins(r.price)}</span></div>`;
  }).join('');
  out.innerHTML = rowsHTML + `<div class="price-row total"><span>Tổng dự kiến</span><span>${fmtCoins(price)}</span></div>`;
}
function validateFFForm(form, showAll){

function initFFForms(){
  document.querySelectorAll('form[data-form="ff-order"]').forEach(form => {
    if (form.dataset.ffInit) return;
    form.dataset.ffInit = '1';
    const revalidate = () => validateFFForm(form, false);
    form.querySelectorAll('.field[data-field]').forEach(field => {
      const el = field.querySelector('input, select');
      if (!el) return;
      const markTouch = () => { field.dataset.touched = '1'; revalidate(); };
      el.addEventListener('input', markTouch);
      el.addEventListener('change', markTouch);
      el.addEventListener('blur', () => { if (field.dataset.touched === '1') revalidate(); });
    });
    validateFFForm(form, false);
  });

function initRankBoostCascades(){
  document.querySelectorAll('form[data-form="ff-order"][data-svc-id="rankboost"]').forEach(form => {
    if (form.dataset.cascadeInit) return;
    form.dataset.cascadeInit = '1';

    const curGroupSel = form.querySelector('[name="currentGroup"]');
    const curDivSel = form.querySelector('[name="currentDivision"]');
    const tgtGroupSel = form.querySelector('[name="targetGroup"]');
    const tgtDivSel = form.querySelector('[name="targetDivision"]');
    if (!modeSel || !curGroupSel || !curDivSel || !tgtGroupSel || !tgtDivSel) return;
    const curGroupWrap = curGroupSel.closest('[data-custom-select]');
    const curDivWrap = curDivSel.closest('[data-custom-select]');
    const tgtGroupWrap = tgtGroupSel.closest('[data-custom-select]');
    const tgtDivWrap = tgtDivSel.closest('[data-custom-select]');
    function refreshGroups(){
      const mode = modeSel.value;
      const groups = ffGroupOptions(mode);
      updateCustomSelectOptions(curGroupWrap, groups, 'Chọn nhóm rank hiện tại');
      updateCustomSelectOptions(tgtGroupWrap, groups, 'Chọn nhóm rank mục tiêu');
      updateCustomSelectOptions(curDivWrap, [], 'Chọn bậc rank hiện tại');
      updateCustomSelectOptions(tgtDivWrap, [], 'Chọn bậc rank mục tiêu');
      validateFFForm(form, false);
    }
    function refreshDivisions(which){
      const mode = modeSel.value;
      if (which === 'current'){
        const g = curGroupSel.value;
        updateCustomSelectOptions(curDivWrap, ffDivisionOptions(mode, g), 'Chọn bậc rank hiện tại');
      } else {
        const g = tgtGroupSel.value;
        updateCustomSelectOptions(tgtDivWrap, ffDivisionOptions(mode, g), 'Chọn bậc rank mục tiêu');
      }
      validateFFForm(form, false);
    }
    modeSel.addEventListener('change', refreshGroups);
    curGroupSel.addEventListener('change', () => refreshDivisions('current'));
    tgtGroupSel.addEventListener('change', () => refreshDivisions('target'));
    if (curGroupSel.value) refreshDivisions('current');
    if (tgtGroupSel.value) refreshDivisions('target');
    const u = getCurrentUser();
    const draft = u ? loadFormDraft(u.id) : null;
    if (draft && draft.serviceId === 'rankboost'){
      if (draft.currentDivision){
        const opt = Array.from(curDivSel.options).find(o => o.value === draft.currentDivision);
        if (opt){ curDivSel.value = draft.currentDivision; curDivSel.dispatchEvent(new Event('change', { bubbles: true })); }
      }
      if (draft.targetDivision){
        const opt = Array.from(tgtDivSel.options).find(o => o.value === draft.targetDivision);
        if (opt){ tgtDivSel.value = draft.targetDivision; tgtDivSel.dispatchEvent(new Event('change', { bubbles: true })); }
      }
    }
    validateFFForm(form, false);
  });
}

function validateBasicForm(form, showAll){
  const rules = BASIC_RULES[form.dataset.form];
  if (!rules) return true;
  let allOk = true;
  form.querySelectorAll('.field[data-field]').forEach(field => {
    const key = field.dataset.field;
    const rule = rules[key];
    if (!rule) return;
    let val = '';
    if (key === 'terms'){
      const cb = field.querySelector('input[type="checkbox"]');
      val = cb ? String(cb.checked) : '';
    } else {
      const el = field.querySelector('input, select, textarea');
      val = (el && el.value || '').trim();
    }
    const err = rule(val, form);
    if (err){
      allOk = false;
      if (showAll || field.dataset.touched === '1') setFieldError(field, err);
      else setFieldError(field, '');
    } else setFieldError(field, '');
  });

  });
}

function toggleFav(type, id){
  const u = getCurrentUser();
  if (!u){ toast('Đăng nhập để lưu yêu thích', 'info'); go('#/login'); return; }
  if (isSuspended(u)){ toast('Tài khoản đã bị đình chỉ', 'error'); return; }
  const d = getData();
  const arr = d.favorites[type];
  const i = arr.indexOf(id);
  let added;
  if (i > -1){ arr.splice(i, 1); added = false; toast('Đã xoá khỏi yêu thích', 'info'); }
  else { arr.push(id); added = true; toast('Đã thêm vào yêu thích', 'success'); }
  saveData(d);
  $$('[data-action="fav"][data-type="'+type+'"][data-id="'+id+'"]').forEach(b => b.classList.toggle('on', added));
  if (parseHash().name === 'favorites') render();
}
function copyToClipboard(text, okMsg){
  const t = String(text || ''); if (!t) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(() => toast(okMsg || 'Đã sao chép', 'success'), () => fallbackCopy(t, okMsg));
    } else fallbackCopy(t, okMsg);
  } catch(err){ fallbackCopy(t, okMsg); }
}
function fallbackCopy(text, okMsg){
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast(okMsg || 'Đã sao chép', 'success');
  } catch(err){ toast('Không thể sao chép', 'info'); }
}
function saveCurrentFFDraft(form){
  const u = getCurrentUser(); if (!u || !form) return;
  const svcId = form.dataset.svcId;
  const data = {
    serviceId: svcId,
    mode: (form.querySelector('[name="mode"]')||{}).value || '',
    currentGroup: (form.querySelector('[name="currentGroup"]')||{}).value || '',
    currentDivision: (form.querySelector('[name="currentDivision"]')||{}).value || '',
    targetGroup: (form.querySelector('[name="targetGroup"]')||{}).value || '',
    targetDivision: (form.querySelector('[name="targetDivision"]')||{}).value || '',
    playerId: (form.querySelector('[name="playerId"]')||{}).value || '',
    topTarget: (form.querySelector('[name="topTarget"]')||{}).value || ''
  };
  saveFormDraft(u.id, data);
}

function openDrawer(){
  renderDrawerHTML();
  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('drawerBackdrop');
  if (!drawer || !backdrop) return;
  drawer.classList.add('open');
  backdrop.classList.add('open');
  drawer.setAttribute('aria-hidden','false');
  document.body.classList.add('no-scroll');
}
function closeDrawer(){
  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('drawerBackdrop');
  if (!drawer || !backdrop) return;
  drawer.classList.remove('open');
  backdrop.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');
  document.body.classList.remove('no-scroll');
}
function isDrawerOpen(){
  const drawer = document.getElementById('drawer');
  return !!(drawer && drawer.classList.contains('open'));
}

  if (e.target.closest('#drawerBackdrop')){ closeDrawer(); return; }

  if (el.matches && el.matches('[data-numeric]')){
    const v = el.value;
    let cleaned = v.replace(/\D/g, '');
    if (cleaned !== v){
      const start = el.selectionStart;
      const diff = v.length - cleaned.length;
      el.value = cleaned;
      try { const np = Math.max(0, (start || cleaned.length) - diff); el.setSelectionRange(np, np); } catch(err){}
    }
  }
  if (el.id === 'addCoinsAmount'){
    const prevPos = el.selectionStart;
    const prevLen = el.value.length;
    const { formatted } = applyThousandsSeparator(el.value);
    if (el.value !== formatted){
      el.value = formatted;
      const added = formatted.length - prevLen;
      let np = prevPos + added;
      if (np < 0) np = 0;
      if (np > formatted.length) np = formatted.length;
      try { el.setSelectionRange(np, np); } catch(err){}
    }
  }
  if (el.id === 'adminUserSearch'){
    adminUsersFilter.q = el.value;
    const pos = el.selectionStart;
    render();
    const nel = $('#adminUserSearch');
    if (nel){ nel.focus(); try { nel.setSelectionRange(pos, pos); } catch(err){} }
  }
  if (el.id === 'adminOrderSearch'){
    adminOrdersFilter.q = el.value;
    const pos = el.selectionStart;
    render();
    const nel = $('#adminOrderSearch');
    if (nel){ nel.focus(); try { nel.setSelectionRange(pos, pos); } catch(err){} }
  }
  if (el.id === 'adminTxSearch'){
    adminTxFilter.q = el.value;
    const pos = el.selectionStart;
    render();
    const nel = $('#adminTxSearch');
    if (nel){ nel.focus(); try { nel.setSelectionRange(pos, pos); } catch(err){} }
  }
  if (el.id === 'annTitle'){ adminAnnounceDraft.title = el.value; }
  if (el.id === 'annBody'){ adminAnnounceDraft.body = el.value; }
});

document.addEventListener('paste', e => {
  const el = e.target;
  if (el && el.matches && (el.matches('[data-numeric]') || el.id === 'addCoinsAmount' || el.id === 'payAmountInput')){
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text') || '';
    let cleaned = String(text).replace(/\D/g, '');
    const start = el.selectionStart || 0, end = el.selectionEnd || 0;
    const v = el.value;
    el.value = v.slice(0, start) + cleaned + v.slice(end);
    const np = start + cleaned.length;
    try { el.setSelectionRange(np, np); } catch(err){}
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
});

   SUBMIT HANDLER
   ========================================================= */
let isRegistering = false;
document.addEventListener('submit', e => {
  const form = e.target;
  const kind = form.dataset.form;
  if (!kind) return;
  e.preventDefault();

  if (kind === 'login'){
    if (form.dataset.submitting === '1') return;
    if (!validateBasicForm(form, true)) return;
    form.dataset.submitting = '1';
    const btn = form.querySelector('button[type="submit"]');
    setButtonLoading(btn, 'Đang đăng nhập...');
    const email = form.email.value.trim(), pass = form.password.value;
    setTimeout(() => {
      const res = loginUser(email, pass);
      if (!res.ok){
        form.dataset.submitting = '0';
        restoreButton(btn);
        if (res.error.toLowerCase().includes('email')) setFieldError(form.querySelector('[data-field="email"]'), res.error);
        else if (res.error.includes('Mật khẩu')) setFieldError(form.querySelector('[data-field="password"]'), res.error);
        else toast(res.error, 'error');
        return;
      }
      if (res.isAdmin){ toast('Chào mừng quản trị viên', 'success'); go('#/admin'); render(); return; }
      toast('Chào mừng trở lại, ' + res.user.username, 'success');
      go('#/home'); render();
    }, 550);
    return;
  }

  if (kind === 'register'){
    if (isRegistering) return;
    if (!validateBasicForm(form, true)) return;
    isRegistering = true;
    const btn = form.querySelector('button[type="submit"]');
    setButtonLoading(btn, 'Đang tạo tài khoản...');
    const username = form.username.value.trim();
    const email = form.email.value.trim();
    const password = form.password.value;
    setTimeout(() => {
      const res = registerUser({ username, email, password });
      isRegistering = false;
      if (!res.ok){
        restoreButton(btn);
        if (res.error.includes('Email')) setFieldError(form.querySelector('[data-field="email"]'), res.error);
        else if (res.error.includes('Tên hiển thị')) setFieldError(form.querySelector('[data-field="username"]'), res.error);
        else toast(res.error, 'error');
        return;
      }
      toast('Đã tạo tài khoản', 'success');
      go('#/home'); render();
    }, 1500);
    return;
  }

  if (kind === 'ff-order'){
    const svcId = form.dataset.svcId;
    const svc = FF_SERVICES.find(s => s.id === svcId);
    if (!svc){ toast('Không tìm thấy dịch vụ', 'error'); return; }
    const u = getCurrentUser();
    if (!u){ toast('Vui lòng đăng nhập', 'info'); go('#/login'); return; }
    if (isSuspended(u)){ toast('Tài khoản đã bị đình chỉ', 'error'); return; }
    if (!validateFFForm(form, true)) return;
    const playerId = (form.playerId.value || '').trim();
    const calc = calcFFPrice(form);
    const price = calc.price;
    if (!price || price <= 0){ toast('Vui lòng chọn đầy đủ', 'error'); return; }
    saveCurrentFFDraft(form);
    let orderFields = { playerId };
    if (svc.type === 'rankboost'){
      const mode = (form.querySelector('[name="mode"]')||{}).value || '';
      const curG = (form.querySelector('[name="currentGroup"]')||{}).value || '';
      const curD = (form.querySelector('[name="currentDivision"]')||{}).value || '';
      const tgtG = (form.querySelector('[name="targetGroup"]')||{}).value || '';
      const tgtD = (form.querySelector('[name="targetDivision"]')||{}).value || '';
      const modeLabel = (FF_MODE_HIERARCHY[mode]||{}).label || '';
      Object.assign(orderFields, {
        gameMode: mode, gameModeLabel: modeLabel,
        currentGroup: curG, currentRank: curD,
        targetGroup: tgtG, targetRank: tgtD,
        rankSteps: calc.stepsCount || 0
      });
    } else if (svc.type === 'topsung'){
      const tgt = (form.topTarget.value || '').trim();
      const found = TOP_GUN_PRICES.find(x => x.value === tgt);
      orderFields.currentRank = '—';
      orderFields.targetRank = found ? found.label : tgt;
    }
    const checkData = getData();
    if (!checkData){ toast('Không thể đọc ví.', 'error'); return; }
    const balance = checkData.wallet.balance || 0;
    if (balance < price){ showInsufficientBalanceModal(balance, price); return; }
    const btn = form.querySelector('button[type="submit"]');
    if (btn){ btn.disabled = true; btn.style.opacity = '.6'; }
    showLoadingOverlay('ĐANG XỬ LÝ ĐƠN HÀNG', 'Vui lòng chờ trong giây lát...');
    setTimeout(() => {
      const d2 = getData();
      if (!d2 || d2.wallet.balance < price){
        hideLoadingOverlay();
        if (d2) showInsufficientBalanceModal(d2.wallet.balance, price);
        if (btn){ btn.disabled = false; btn.style.opacity = ''; }
        return;
      }
      const order = createFFOrder(svc, orderFields, price);
      hideLoadingOverlay();
      if (!order){
        toast('Không thể tạo đơn.', 'error');
        if (btn){ btn.disabled = false; btn.style.opacity = ''; }
        return;
      }
      clearFormDraft(u.id);
      ffExpandedService = null;
      render();
      updateNotifBadge();
      showOrderSuccessModal(order);
      toast('Đã tạo đơn ' + fmtOrderId(order.id), 'success');
    }, 1500);
    return;
  }

  if (kind === 'card-pay'){
    if (payLocked) return;
    const u = getCurrentUser();
    if (!u){ toast('Vui lòng đăng nhập', 'info'); return; }
    if (isSuspended(u)){ toast('Tài khoản đã bị đình chỉ', 'error'); return; }
    if (!validateBasicForm(form, true)) return;
    const network = (form.querySelector('[name="network"]')||{}).value || 'Viettel';
    const denom = Number((form.querySelector('[name="denom"]')||{}).value || 0);
    if (!CARD_DENOMS.includes(denom)){ toast('Mệnh giá không hợp lệ', 'error'); return; }
    payLocked = true;
    const btn = form.querySelector('button[type="submit"]');
    const orig = btn ? btn.innerHTML : '';
    if (btn){ btn.innerHTML = `<span class="btn-spinner"></span><span>Đang xử lý...</span>`; btn.disabled = true; }
    setTimeout(() => {
      const ok = creditWallet(denom, 'Nạp thẻ ' + network + ' demo');
      if (!ok && btn){ payLocked = false; btn.disabled = false; btn.innerHTML = orig; refreshIcons(); }
    }, 500);
    return;
  }

  if (kind === 'ticket'){
    if (!validateBasicForm(form, true)) return;
    const d = getData();
    if (d){
      d.tickets.push({ id: uid('tk'), subject: form.subject.value.trim(),
        orderId: form.orderId.value.trim(), message: form.message.value.trim(), time: Date.now() });
      saveData(d);
    }
    form.reset();
    form.querySelectorAll('.field[data-field]').forEach(f => { f.dataset.touched = ''; setFieldError(f, ''); });
    toast('Đã gửi yêu cầu', 'success');
    return;
  }

  if (kind === 'edit-profile'){
    if (!validateBasicForm(form, true)) return;
    const u = getCurrentUser(); if (!u) return;
    const newName = (form.username.value || '').trim();
    const updates = {};
    const nameInput = form.querySelector('input[name="username"]');
    if (nameInput && !nameInput.disabled && newName !== u.username){
      const check = canChangeName(u);
      if (!check.ok){
        setFieldError(form.querySelector('[data-field="username"]'),
          'Bạn chỉ có thể đổi tên 1 lần mỗi 7 ngày. Còn lại: ' + fmtRemaining(check.remainingMs));
        return;
      }
      const users = getUsers();
      if (users.some(x => x.id !== u.id && String(x.username||'').toLowerCase() === newName.toLowerCase())){
        setFieldError(form.querySelector('[data-field="username"]'), 'Tên này đã được sử dụng');
        return;
      }
      updates.username = newName;
      updates.lastNameChange = Date.now();
    }
    if (!Object.keys(updates).length){ toast('Không có thay đổi', 'info'); closeModal(); return; }
    if (!updateUser(updates)){ toast('Không thể lưu', 'error'); return; }
    closeModal(); toast('Đã cập nhật hồ sơ', 'success'); render();
    return;
  }

  if (kind === 'change-password'){
    if (!validateBasicForm(form, true)) return;
    const u = getCurrentUser(); if (!u) return;
    const current = form.current.value, next = form.next.value;
    if (demoHash(current) !== u.pass){
      setFieldError(form.querySelector('[data-field="current"]'), 'Mật khẩu hiện tại không đúng');
      return;
    }
    if (next === current){ setFieldError(form.querySelector('[data-field="next"]'), 'Mật khẩu mới phải khác'); return; }
    if (!updateUser({ pass: demoHash(next) })){ toast('Không thể cập nhật', 'error'); return; }
    closeModal(); toast('Đã cập nhật mật khẩu', 'success');
    return;
  }

  if (kind === 'admin-verify-suspend'){
    if (!validateBasicForm(form, true)) return;
    const userId = form.dataset.userId;
    const pwInput = form.querySelector('[name="password"]');
    const pw = pwInput ? pwInput.value : '';
    if (!verifyAdminPassword(pw)){
      setFieldError(form.querySelector('[data-field="password"]'), 'Mật khẩu quản trị viên không đúng');
      if (pwInput) pwInput.value = '';
      return;
    }
    if (pwInput) pwInput.value = '';
    const ok = performSuspendUser(userId);
    if (!ok){ toast('Không thể đình chỉ', 'error'); return; }
    closeModal(); toast('Đã đình chỉ tài khoản', 'success'); render();
    return;
  }

  if (kind === 'admin-private-message'){ if (!validateBasicForm(form, true)) return; return; }
});

function getAllUserData(){
  return getUsers().map(u => {
    const stored = LS.get(K.data(u.id), null);
    const def = defaultData();
    let data;
    if (!stored) data = def;
    else data = {
      orders: stored.orders || [],
      notifications: stored.notifications || [],
      tickets: stored.tickets || [],
      favorites: Object.assign({}, def.favorites, stored.favorites || {}),
      wallet: Object.assign({}, def.wallet, stored.wallet || {}),
      settings: Object.assign({}, def.settings, stored.settings || {}),
      announcementReads: stored.announcementReads || {}
    };
    if (typeof data.wallet.totalDeposited !== 'number'){
      data.wallet.totalDeposited = (data.wallet.transactions || [])
        .filter(t => t.amount > 0 && t.ref !== 'REFUND' && t.ref !== 'REVOKE' && t.ref !== 'ORDER' && t.ref !== 'ADMIN_GRANT')
        .reduce((s,t) => s + t.amount, 0);
    }
    return { user: u, data };
  });
}
function getAllOrders(){
  const all = [];
  getAllUserData().forEach(({user, data}) => {
    data.orders.forEach(o => all.push(Object.assign({}, o, {
      userId: user.id, userName: user.username, userEmail: user.email, userColor: user.color
    })));
  });
  return all.sort((a,b) => b.createdAt - a.createdAt);
}
function getAllTransactions(){
  const all = [];
  getAllUserData().forEach(({user, data}) => {
    data.wallet.transactions.forEach(t => all.push(Object.assign({}, t, { userId: user.id, userName: user.username })));
  });
  return all.sort((a,b) => b.time - a.time);
}
function adminStatusLabel(s){
  return { pending:'Chờ xử lý', awaiting_account:'Chờ bàn giao', progress:'Đang xử lý', completed:'Hoàn thành', cancelled:'Đã hủy' }[s] || s;
}
function adminStatusClass(s){
  return { pending:'pending', awaiting_account:'awaiting', progress:'progress', completed:'completed', cancelled:'cancelled' }[s] || 'pending';
}
function adminBadge(s){ return `<span class="adm-st ${adminStatusClass(s)}">${adminStatusLabel(s)}</span>`; }
function adminUpdateOrderStatus(orderId, newStatus){
  const all = getAllUserData();
  for (const {user, data} of all){
    const o = data.orders.find(x => x.id === orderId);
    if (o){
      if (o.status === newStatus) return true;
      const oldStatus = o.status;
      o.status = newStatus;
      o.updatedAt = Date.now();
      if (newStatus === 'cancelled' && oldStatus !== 'cancelled' && !o.refunded){
        const refund = o.total || 0;
        if (refund > 0){
          o.refunded = true;
          data.wallet.balance += refund;
          data.wallet.transactions.unshift({
            id: uid('t'), label: 'Hoàn tiền đơn ' + fmtOrderId(o.id),
            amount: refund, time: Date.now(), ref: 'REFUND', orderId: o.id
          });
        }
      }
      data.notifications.unshift({
        id: uid('n'), title: 'Đơn hàng được cập nhật',
        body: 'Đơn ' + fmtOrderId(o.id) + ' đã được cập nhật sang trạng thái: ' + adminStatusLabel(newStatus) + '.',
        time: Date.now(), read: false,
        type: newStatus === 'completed' ? 'order-completed' : 'order-status',
        orderId: o.id
      });
      if (data.notifications.length > 200) data.notifications.length = 200;
      return LS.set(K.data(user.id), data);
    }
  }
  return false;
}
function getAdminActivity(limit){
  const all = [];
  getAllUserData().forEach(({user, data}) => {
    all.push({ time: user.createdAt, type: 'register', icon: 'user',
      text: `<strong>${esc(user.username)}</strong> đăng ký tài khoản`, userName: user.username });
    data.orders.forEach(o => {
      all.push({ time: o.createdAt, type: 'order', icon: 'receipt',
        text: `<strong>${esc(user.username)}</strong> tạo đơn <strong>${esc(fmtOrderId(o.id))}</strong>`,
        userName: user.username, orderId: o.id });
    });
    data.wallet.transactions.forEach(t => {
      const isIn = t.amount > 0;
      const isRefund = t.ref === 'REFUND';
      const isAdminGrant = t.ref === 'ADMIN_GRANT';
      let text, icon;
      if (isAdminGrant){ text = `Admin cộng <strong>${fmtCoins(t.amount)}</strong> cho <strong>${esc(user.username)}</strong>`; icon = 'key'; }
      else if (isRefund){ text = `Hoàn tiền <strong>${fmtCoins(t.amount)}</strong> cho <strong>${esc(user.username)}</strong>`; icon = 'rotate-ccw'; }
      else if (isIn){ text = `<strong>${esc(user.username)}</strong> nạp <strong>${fmtCoins(t.amount)}</strong>`; icon = 'coins'; }
      else { text = `<strong>${esc(user.username)}</strong> thanh toán <strong>${fmtCoins(Math.abs(t.amount))}</strong>`; icon = 'receipt'; }
      all.push({ time: t.time, type: isAdminGrant ? 'admin-grant' : (isRefund ? 'refund' : (isIn ? 'topup' : 'payment')), icon, text, userName: user.username });
    });
  });
  getAnnouncements().forEach(a => {
    all.push({ time: a.time, type: 'announcement', icon: 'megaphone',
      text: `<strong>Quản trị viên</strong> đã gửi: <strong>${esc(a.title)}</strong>`, userName: 'Quản trị viên' });
  });
  getAuditLog().forEach(entry => {
    const target = getUsers().find(u => u.id === entry.targetUserId);
    let label = entry.action;
    let icon = 'unlock';
    if (entry.action === 'suspend_user'){ label = 'đình chỉ tài khoản'; icon = 'lock'; }
    else if (entry.action === 'unsuspend_user'){ label = 'mở khóa tài khoản'; icon = 'unlock'; }
    else if (entry.action === 'send_private_message'){ label = 'gửi tin nhắn riêng cho'; icon = 'mail'; }
    else if (entry.action === 'admin_grant_coins'){ label = 'cộng xu cho'; icon = 'key'; }
    else if (entry.action === 'upload_image'){ label = 'tải ảnh lên'; icon = 'upload'; }
    else if (entry.action === 'delete_image'){ label = 'xoá ảnh'; icon = 'trash-2'; }
    else if (entry.action === 'update_image_caption'){ label = 'cập nhật chú thích ảnh'; icon = 'edit-3'; }
    else if (entry.action === 'broadcast_message'){ label = 'gửi tin nhắn broadcast'; icon = 'megaphone'; }
    const imageActions = ['upload_image','delete_image','update_image_caption'];
    if (imageActions.indexOf(entry.action) > -1){
      all.push({ time: entry.time, type: 'audit-image', icon,
        text: `<strong>Quản trị viên</strong> ${label}: <em>${esc(entry.reason)}</em>`, userName: 'Quản trị viên' });
    } else {
      all.push({ time: entry.time, type: 'audit', icon,
        text: `<strong>Quản trị viên</strong> ${label}: <strong>${esc(target ? target.username : entry.targetUserId)}</strong>${entry.amount ? ' (+' + fmtCoins(entry.amount) + ')' : ''}`,
        userName: 'Quản trị viên' });
    }
  });
  all.sort((a,b) => b.time - a.time);
  return limit ? all.slice(0, limit) : all;
}
function performSuspendUser(userId){
  const users = getUsers();
  const i = users.findIndex(u => u.id === userId);
  if (i < 0) return false;
  if (users[i].email === ADMIN_EMAIL) return false;
  if (users[i].suspended) return true;
  users[i].suspended = true;
  users[i].suspendedAt = Date.now();
  users[i].suspendedBy = ADMIN_EMAIL;
  if (!saveUsers(users)) return false;
  logAdminAction({ action: 'suspend_user', targetUserId: userId });
  if (LS.get(K.session, null) === userId) LS.del(K.session);
  return true;
}
function performUnsuspendUser(userId){
  const users = getUsers();
  const i = users.findIndex(u => u.id === userId);
  if (i < 0) return false;
  if (!users[i].suspended) return true;
  users[i].suspended = false;
  delete users[i].suspendedAt;
  delete users[i].suspendedBy;
  if (!saveUsers(users)) return false;
  logAdminAction({ action: 'unsuspend_user', targetUserId: userId });
  return true;
}

let adminUsersFilter = { q:'', sort:'newest' };
function viewAdminUsers(){
  const allUsers = getAllUserData();
  const q = adminUsersFilter.q.trim().toLowerCase();
  let list = allUsers.filter(x => !q || x.user.username.toLowerCase().includes(q) || x.user.email.toLowerCase().includes(q));
  if (adminUsersFilter.sort === 'newest') list.sort((a,b) => b.user.createdAt - a.user.createdAt);
  else if (adminUsersFilter.sort === 'oldest') list.sort((a,b) => a.user.createdAt - b.user.createdAt);
  else if (adminUsersFilter.sort === 'orders') list.sort((a,b) => b.data.orders.length - a.data.orders.length);
  else if (adminUsersFilter.sort === 'balance') list.sort((a,b) => (b.data.wallet.balance||0) - (a.data.wallet.balance||0));

let adminTxFilter = { q:'', type:'all' };
function viewAdminWallet(){
  const allTx = getAllTransactions();
  const q = adminTxFilter.q.trim().toLowerCase();
  let list = allTx.filter(t => {
    if (adminTxFilter.type === 'topup' && !(t.amount > 0 && t.ref !== 'REFUND' && t.ref !== 'REVOKE' && t.ref !== 'ADMIN_GRANT')) return false;
    if (adminTxFilter.type === 'payment' && !(t.amount < 0 && t.ref === 'ORDER')) return false;
    if (adminTxFilter.type === 'refund' && !(t.ref === 'REFUND' || t.ref === 'REVOKE')) return false;
    if (adminTxFilter.type === 'admin_grant' && t.ref !== 'ADMIN_GRANT') return false;
    if (!q) return true;
    return String(t.userName||'').toLowerCase().includes(q) || String(t.label||'').toLowerCase().includes(q);
  });
  const totalBalance = getAllUserData().reduce((s, x) => s + (x.data.wallet.balance||0), 0);
  const totalTopup = allTx.filter(t => t.amount > 0 && t.ref !== 'REFUND' && t.ref !== 'ADMIN_GRANT').reduce((s,t) => s + t.amount, 0);
  const totalPayment = allTx.filter(t => t.amount < 0 && t.ref === 'ORDER').reduce((s,t) => s + Math.abs(t.amount), 0);
  const totalAdminGrants = allTx.filter(t => t.ref === 'ADMIN_GRANT').reduce((s,t) => s + t.amount, 0);
  const types = [['all','Tất cả'],['topup','Nạp xu'],['payment','Thanh toán'],['refund','Hoàn xu'],['admin_grant','Admin cộng']];
  return `
  <div class="adm-section" style="margin-top:2px">
    <div class="adm-section-head"><h2>Ví & giao dịch</h2></div>
    <div class="adm-stats" style="margin-bottom:18px">
      <div class="adm-stat"><div class="l">Tổng số dư</div><div class="v small">${fmtNumber(totalBalance)} xu</div></div>
      <div class="adm-stat"><div class="l">Tổng nạp</div><div class="v small">${fmtNumber(totalTopup)} xu</div></div>
      <div class="adm-stat"><div class="l">Thanh toán</div><div class="v small">${fmtNumber(totalPayment)} xu</div></div>
      <div class="adm-stat"><div class="l">Admin cộng</div><div class="v small">${fmtNumber(totalAdminGrants)} xu</div></div>
    </div>
    <div class="adm-search-input">${ic('search')}<input id="adminTxSearch" type="search" placeholder="Tìm theo người dùng hoặc mô tả..." value="${esc(adminTxFilter.q)}" autocomplete="off" /></div>
    <div class="adm-chips">${types.map(([k,l]) => `<button type="button" class="adm-chip ${adminTxFilter.type===k?'active':''}" data-action="admin-tx-filter" data-type="${k}">${l}</button>`).join('')}</div>
    ${list.length ? `<div class="adm-list">${list.map(adminTxItem).join('')}</div>` : `<div class="adm-empty">${ic('wallet')}<div class="t">Không có giao dịch</div></div>`}
  </div>`;
}
function adminTxItem(t){
  const isRefund = t.ref === 'REFUND';
  const isRevoke = t.ref === 'REVOKE';
  const isAdminGrant = t.ref === 'ADMIN_GRANT';
  const isIn = t.amount > 0;
  let type, iconName, cls;
  if (isAdminGrant){ type = 'Admin cộng'; iconName = 'key'; cls = 'admin'; }
  else if (isRefund){ type='Hoàn xu'; iconName='rotate-ccw'; cls='refund'; }
  else if (isRevoke){ type='Huỷ hoàn xu'; iconName='rotate-ccw'; cls='out'; }
  else if (isIn){ type='Nạp xu'; iconName='coins'; cls='in'; }
  else { type='Thanh toán đơn'; iconName='receipt'; cls='out'; }
  return `<div class="adm-item">
    <div class="adm-item-top" style="margin-bottom:7px">
      <div class="tx-ic ${cls}" style="width:32px;height:32px;border-radius:9px">${ic(iconName)}</div>
      <div class="adm-item-main">
        <div class="adm-item-title">${esc(t.label)}</div>
        <div class="adm-item-sub">${esc(t.userName||'—')}</div>
      </div>
      <div class="adm-item-right">
        <div class="coin-price" style="color:${isIn?'var(--gold)':'var(--muted)'}">${isIn?'+':''}${fmtNumber(t.amount)}</div>
      </div>
    </div>
    <div class="adm-meta">
      <span class="kv"><span class="k">Loại:</span><span class="v">${type}</span></span>
      <span class="kv"><span class="k">Thời gian:</span><span class="v">${fmtDateTime(t.time)}</span></span>
    </div>
  </div>`;
}

function adminSearchAll(q){
  q = String(q||'').trim().toLowerCase();
  if (!q) return { users: [], orders: [] };
  const users = getAllUserData().filter(x => x.user.username.toLowerCase().includes(q) || x.user.email.toLowerCase().includes(q)).slice(0,5).map(x => ({user:x.user,data:x.data}));
  const orders = getAllOrders().filter(o => String(o.id||'').toLowerCase().includes(q) || String(o.userName||'').toLowerCase().includes(q) || String(o.playerId||'').includes(q)).slice(0,5);
  return { users, orders };
}
function showAdminSearchResults(q){
  const box = $('#adminSearchResults'); if (!box) return;
  if (!q.trim()){ box.classList.remove('open'); box.innerHTML = ''; return; }
  const res = adminSearchAll(q);
  if (!res.users.length && !res.orders.length){
    box.innerHTML = `<div class="adm-search-empty">Không tìm thấy "${esc(q)}"</div>`;
    box.classList.add('open'); return;
  }
  let html = '';
  if (res.users.length){
    html += `<div class="adm-sug-group">Người dùng</div>` + res.users.map(x => `
      <div class="adm-sug" data-action="admin-user-detail" data-id="${esc(x.user.id)}">
        <span class="ic">${ic('user')}</span>
        <div style="flex:1;min-width:0"><div class="t">${esc(x.user.username)}</div><div class="s">${esc(x.user.email)}</div></div>
      </div>`).join('');
  }
  if (res.orders.length){
    html += `<div class="adm-sug-group">Đơn hàng</div>` + res.orders.map(o => `
      <div class="adm-sug" data-action="admin-order-detail" data-id="${esc(o.id)}">
        <span class="ic">${ic('receipt')}</span>
        <div style="flex:1;min-width:0"><div class="t">${esc(fmtOrderId(o.id))}</div><div class="s">${esc(o.userName||'—')}</div></div>
      </div>`).join('');
  }
  box.innerHTML = html; box.classList.add('open'); refreshIcons();
}

let renderToken = 0;
let lastPath = null;
function render(){
  const route = parseHash();
  const path = location.hash || '#/home';
  const changed = path !== lastPath;
  lastPath = path;

  const adminMode = isAdminSession();
  document.body.classList.toggle('admin-mode', adminMode);
  $('#topbar').classList.toggle('admin-topbar', adminMode);

  if (adminMode){
    if (route.name !== 'admin'){ go('#/admin'); return; }
    document.title = 'Quản trị — Webcuaquan';
    renderAdminChrome();
    const view = $('#view');
    view.innerHTML = viewAdmin(route);
    initCustomSelects(); refreshIcons();
    if (changed) window.scrollTo(0, 0);
    return;
  }
  if (route.name === 'admin'){ go('#/login'); return; }

  const currentUser = getCurrentUser();
  const suspendedNow = currentUser && currentUser.suspended;

  if (suspendedNow && PROTECTED.indexOf(route.name) > -1){
    document.title = 'Tài khoản bị đình chỉ — Webcuaquan';
    renderChrome();
    $('#view').innerHTML = viewSuspended();
    refreshIcons();
    if (changed) window.scrollTo(0, 0);
    return;
  }

  if (route.name !== 'freefire'){ ffExpandedService = null; }
  document.title = PAGE_TITLES[route.name] || 'Webcuaquan';
  closeSuggest();
  renderChrome();
  const view = $('#view');
  const token = ++renderToken;
  if (PROTECTED.indexOf(route.name) > -1 && !currentUser){
    view.innerHTML = authRequiredView();
    refreshIcons();
    if (changed) window.scrollTo(0, 0);
    return;
  }
  view.innerHTML = routeHTML(route);
  afterRender(route);
  refreshIcons();
  if (changed) window.scrollTo(0, 0);
  updateNotifBadge();
}
function afterRender(route){
  refreshDateDisplays();
  initCustomSelects();
  initFormValidation();
  initFFForms();
  initRankBoostCascades();
  bindNotificationButtons();
  initCarousel();
  const routeName = route ? route.name : parseHash().name;
  if (routeName !== 'freefire'){ if (_carouselTimer){ clearInterval(_carouselTimer); _carouselTimer = null; } }
}

window.addEventListener('hashchange', () => {
  closeNotificationPanel();
  closeAdminNotifPanel();
  closeModal();
  if (isDrawerOpen()) closeDrawer();
  render();
});

(async function init(){
  ensureAdminHash();

  ensureAvatarInput();
  ensureImageFileInput();
  await loadAllImagesToCache();
  render();
  refreshIcons();
  window.addEventListener('load', refreshIcons);
  setTimeout(refreshIcons, 400);
  setTimeout(refreshIcons, 1500);
})();
