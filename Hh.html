
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07060b" />
<title>Webcuaquan — Dịch vụ cày rank Free Fire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root{
  --bg:#07060b;--surface:rgba(255,255,255,.038);--surface-hi:rgba(255,255,255,.072);
  --border:rgba(255,255,255,.075);--border-hi:rgba(255,255,255,.145);
  --accent:#8b5cf6;--accent-soft:rgba(139,92,246,.14);
  --text:#f4f2fa;--muted:#9a96ad;--muted-2:#6b6779;
  --danger:#ef4444;--warn:#f59e0b;
  --r:14px;--r-lg:18px;--r-xl:22px;
  --shadow:0 18px 40px -24px rgba(0,0,0,.9);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(720px 520px at 8% -12%, rgba(139,92,246,.17), transparent 62%),
    radial-gradient(620px 520px at 102% 2%, rgba(59,130,246,.10), transparent 60%),
    radial-gradient(700px 500px at 50% 120%, rgba(124,58,237,.08), transparent 65%)}
body.no-scroll{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.18;letter-spacing:-.022em;font-weight:700}
p{margin:0}
img{max-width:100%}
::selection{background:rgba(139,92,246,.4)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px;border:3px solid transparent;background-clip:content-box}
button,.btn,.nav-item,.bn-item,.tab,.chip,.icon-btn,.fav-btn,.avatar,.pay-chip,.wallet-chip,
.rank-row,.faq-q,.contact-link,.orders-btn,.game-card,.order-card,
.row-item,.profile-avatar-wrap,.avatar-edit-btn,.modal-avatar-wrap,.modal-avatar-edit,
.notif-item,.provider,.pf-avatar,.stat,.bottomnav,.topbar,.sidebar,.notif-head,
.rank-detail-head,.section-head,.brand,.brand-mark,.brand-text,
.hero-actions,.trust-item,.feat-ic,.hero-orb,.pill,.pw-toggle,.qr-box,.rank-name,
.rank-divisions,.rank-range,.pay-tag,.insufficient-head,.logout-confirm-ic,.success-check,
.copy-btn,.contact-label,.modal-avatar-delete,.tab-reset,.cd-select-trigger,.cd-select-option,
.admin-row,.admin-stat,.adm-action,.adm-item,.adm-chip,.adm-notif-item,.adm-header-actions{
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
.mono,.copyable,input,textarea,select,.selectable{
  -webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}
input,textarea,select{-webkit-touch-callout:default}
svg.lucide{width:18px;height:18px;flex:none;stroke-width:1.9}
i[data-lucide]{display:inline-block;width:18px;height:18px;flex:none}
i.icon-fb{display:inline-grid;place-items:center;font-style:normal;font-size:13px;line-height:1;opacity:.8}
.btn svg.lucide,.btn i[data-lucide]{width:16px;height:16px}
.icon-btn svg.lucide,.icon-btn i[data-lucide]{width:19px;height:19px}
.bottomnav svg.lucide,.bottomnav i[data-lucide]{width:21px;height:21px}
.app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{flex:1;width:100%;max-width:1220px;margin:0 auto;padding:18px 16px 116px}
@media(min-width:1024px){
  .sidebar{display:flex;flex-direction:column;width:262px;flex:none;position:sticky;top:0;height:100vh;padding:22px 14px 16px;
    border-right:1px solid var(--border);background:linear-gradient(180deg,rgba(14,12,21,.85),rgba(9,8,14,.7));backdrop-filter:blur(14px)}
  .bottomnav{display:none}
  .view{padding:28px 34px 64px}
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px}
.brand-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#8b5cf6,#5b21b6);
  box-shadow:0 8px 22px -10px rgba(139,92,246,1), inset 0 1px 0 rgba(255,255,255,.25);color:#fff}
.brand-text{font-weight:800;font-size:16px;letter-spacing:.04em}
.brand-text em{font-style:normal;color:var(--accent);font-weight:800}
.sidebar .brand{margin-bottom:22px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  color:var(--muted);font-size:14px;font-weight:600;transition:.18s var(--ease);position:relative}
.nav-item:hover{background:var(--surface-hi);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(139,92,246,.18),rgba(139,92,246,.04));color:#fff}
.nav-item.active::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:0 4px 4px 0;background:var(--accent);box-shadow:0 0 12px rgba(139,92,246,.9)}
.sidebar-foot{margin-top:auto;padding:12px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--surface);font-size:11.5px;color:var(--muted-2);line-height:1.5}
.sidebar-foot strong{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:11px 16px;border-bottom:1px solid var(--border);background:rgba(7,6,11,.78);backdrop-filter:blur(18px)}
@media(min-width:1024px){.topbar{padding:12px 34px;flex-wrap:nowrap}}
.brand-mobile{display:flex;align-items:center;gap:9px}
@media(min-width:1024px){.brand-mobile{display:none}}
.brand-mobile .brand-text{font-size:15px}
.brand-mobile .brand-mark{width:32px;height:32px;border-radius:10px}
.search-wrap{position:relative;order:3;width:100%;display:flex;align-items:center}
@media(min-width:1024px){.search-wrap{order:0;width:auto;flex:1;max-width:440px}}
.search-wrap > svg.lucide,.search-wrap > i[data-lucide]{position:absolute;left:13px;color:var(--muted-2);width:17px;height:17px;pointer-events:none}
.search-input{width:100%;background:rgba(255,255,255,.045);border:1px solid var(--border);border-radius:12px;
  padding:11px 14px 11px 40px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:.18s var(--ease)}
.search-input::placeholder{color:var(--muted-2)}
.search-input:focus{border-color:rgba(139,92,246,.55);background:rgba(255,255,255,.07);box-shadow:0 0 0 3px rgba(139,92,246,.13)}
.suggest{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:90;background:rgba(16,13,24,.97);
  border:1px solid var(--border-hi);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(20px);
  padding:8px;display:none;max-height:60vh;overflow:auto}
.suggest.open{display:block;animation:pop .16s var(--ease)}
.sug-group{padding:6px 8px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);font-weight:700}
.sug-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;transition:.15s;cursor:pointer}
.sug-item:hover{background:var(--surface-hi)}
.sug-item .sug-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:800;color:#fff}
.sug-item .sug-t{font-size:13.5px;font-weight:600}
.sug-item .sug-s{font-size:11.5px;color:var(--muted-2)}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{position:relative;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--border);color:var(--muted);transition:.18s var(--ease)}
.icon-btn:hover{background:var(--surface-hi);color:var(--text);border-color:var(--border-hi)}
.icon-btn:active{transform:scale(.94)}
.badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.wallet-chip{display:none;align-items:center;gap:8px;height:38px;padding:0 13px;border-radius:11px;
  background:linear-gradient(135deg,rgba(139,92,246,.16),rgba(59,130,246,.08));
  border:1px solid rgba(139,92,246,.28);font-size:13px;font-weight:700;transition:.18s var(--ease)}
.wallet-chip:hover{border-color:rgba(139,92,246,.55)}
@media(min-width:520px){.wallet-chip{display:flex}}
.wallet-chip svg.lucide,.wallet-chip i[data-lucide]{width:16px;height:16px;color:var(--accent)}
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
  font-weight:800;font-size:13.5px;color:#fff;letter-spacing:.02em;border:1px solid var(--border-hi);
  transition:.18s var(--ease);overflow:hidden}
.avatar:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px rgba(0,0,0,.9)}
.avatar-img{width:100%;height:100%;object-fit:cover;display:block}
.pay-chip{display:flex;align-items:center;justify-content:center;gap:0;height:38px;width:38px;padding:0;border-radius:11px;
  background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(59,130,246,.14));
  border:1px solid rgba(139,92,246,.42);color:#fff;font-size:13px;font-weight:800;
  transition:.18s var(--ease);flex:none}
.pay-chip:hover{border-color:rgba(139,92,246,.75);
  background:linear-gradient(135deg,rgba(139,92,246,.38),rgba(59,130,246,.2));
  transform:translateY(-1px);box-shadow:0 8px 22px -10px rgba(139,92,246,.9)}
.pay-chip:active{transform:scale(.95)}
.pay-chip svg.lucide,.pay-chip i[data-lucide]{width:17px;height:17px;color:#d6c7ff}
.pay-chip span{display:none}
@media(min-width:480px){.pay-chip{width:auto;padding:0 12px;gap:6px}.pay-chip span{display:inline}}
.notif-panel{position:fixed;top:64px;right:12px;left:12px;z-index:95;background:rgba(16,13,24,.98);
  border:1px solid var(--border-hi);border-radius:var(--r-lg);box-shadow:var(--shadow);backdrop-filter:blur(20px);
  display:none;overflow:hidden}
.notif-panel.open{display:block;animation:pop .18s var(--ease)}
@media(min-width:640px){.notif-panel{left:auto;width:360px;right:20px}}
@media(min-width:1024px){.notif-panel{top:70px;right:34px}}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--border)}
.notif-head h4{font-size:14px}
.notif-list{max-height:340px;overflow:auto}
.notif-item{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.045);transition:.15s}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--surface)}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}
.notif-item.read .notif-dot{background:rgba(255,255,255,.15)}
.notif-item .n-title{font-size:13.5px;font-weight:600}
.notif-item .n-body{font-size:12.5px;color:var(--muted);margin-top:2px}
.notif-item .n-time{font-size:11px;color:var(--muted-2);margin-top:5px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:70;display:flex;justify-content:space-around;
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:rgba(10,8,15,.94);backdrop-filter:blur(20px);
  border-top:1px solid var(--border)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;
  color:var(--muted-2);font-size:10px;font-weight:700;letter-spacing:.01em;transition:.18s var(--ease)}
.bn-item.active{color:var(--accent)}
.bn-item.active svg.lucide,.bn-item.active i[data-lucide]{filter:drop-shadow(0 0 8px rgba(139,92,246,.7))}
.bn-item:active{transform:scale(.93)}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  backdrop-filter:blur(10px);transition:.22s var(--ease)}
.card.pad{padding:16px}
.stretched{position:absolute;inset:0;z-index:1;border-radius:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;
  border-radius:12px;padding:11px 17px;font-weight:700;font-size:14px;color:var(--text);background:transparent;
  transition:.18s var(--ease);white-space:nowrap;letter-spacing:-.01em}
.btn:active{transform:scale(.975)}
.btn-primary{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;
  box-shadow:0 10px 26px -12px rgba(139,92,246,1),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 16px 32px -12px rgba(139,92,246,1)}
.btn-ghost{border-color:var(--border-hi);background:rgba(255,255,255,.028);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.22)}
.btn-danger{border-color:rgba(239,68,68,.32);background:rgba(239,68,68,.09);color:#ff9b9b}
.btn-danger:hover{background:rgba(239,68,68,.16)}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.4;filter:grayscale(.4);cursor:not-allowed;pointer-events:none;box-shadow:none;transform:none}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;
  background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.24);font-size:11.5px;font-weight:700;
  color:#c4b1ff;letter-spacing:.02em}
.pill svg.lucide,.pill i[data-lucide]{width:14px;height:14px}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.tiny{font-size:11.5px;color:var(--muted-2)}
.price{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.02em}
.grad{background:linear-gradient(100deg,#a78bfa,#8b5cf6 40%,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;letter-spacing:.02em}
.link{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--accent)}
.link svg.lucide,.link i[data-lucide]{width:14px;height:14px}
.muted{color:var(--muted)}
.copy-inline{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0}
.copy-inline .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.copy-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:4px;
  color:var(--muted-2);display:grid;place-items:center;transition:.15s var(--ease);flex:none}
.copy-btn:hover{color:var(--accent);border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.1)}
.copy-btn:active{transform:scale(.92)}
.copy-btn svg.lucide,.copy-btn i[data-lucide]{width:13px;height:13px}
.section{margin-top:36px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:15px}
.section-head h2{font-size:19px;color:#fff}
.section-head p{font-size:13px;color:var(--muted);margin-top:3px}
.grid{display:grid;gap:13px}
.grid-games{grid-template-columns:repeat(auto-fill,minmax(152px,1fr))}
.grid-feat{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.home-date{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:0 4px;font-size:12.5px;
  font-weight:600;color:var(--muted-2);letter-spacing:.01em}
.home-date svg.lucide,.home-date i[data-lucide]{width:14px;height:14px;color:var(--accent);opacity:.75}
.home-date .home-date-text{color:var(--muted)}
.game-card{overflow:hidden;padding:10px}
.game-card:hover{transform:translateY(-3px);border-color:var(--border-hi);box-shadow:0 22px 40px -26px rgba(139,92,246,.7)}
.game-art{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--c1),var(--c2))}
.game-art::before{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 85% at 18% 0%, rgba(255,255,255,.28), transparent 56%),linear-gradient(180deg,transparent 38%,rgba(0,0,0,.58))}
.game-art::after{content:'';position:absolute;inset:0;opacity:.45;
  background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);
  background-size:20px 20px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 80%);mask-image:linear-gradient(180deg,#000,transparent 80%)}
.game-art span{position:relative;z-index:1;font-weight:800;font-size:24px;letter-spacing:.05em;color:rgba(255,255,255,.94);text-shadow:0 6px 22px rgba(0,0,0,.55)}
.game-body{padding:11px 5px 5px}
.game-name{font-size:14.5px;font-weight:700;padding-right:28px;color:#fff}
.fav-btn{position:relative;z-index:2;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:rgba(0,0,0,.28);border:1px solid var(--border);color:var(--muted-2);transition:.18s var(--ease);flex:none}
.fav-btn:hover{color:#fff;border-color:var(--border-hi);background:rgba(0,0,0,.45)}
.fav-btn.on{color:#f472b6;border-color:rgba(244,114,182,.4);background:rgba(244,114,182,.12)}
.fav-btn.on svg.lucide,.fav-btn.on i[data-lucide]{fill:#f472b6}
.fav-btn svg.lucide,.fav-btn i[data-lucide]{width:15px;height:15px}
.hero{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:var(--r-xl);padding:36px 20px 26px;text-align:center;
  background:linear-gradient(160deg,rgba(139,92,246,.15),rgba(59,130,246,.055) 44%,transparent 72%),rgba(255,255,255,.018)}
@media(min-width:860px){.hero{padding:58px 52px 42px;text-align:left}}
.hero-orb{position:absolute;width:440px;height:440px;right:-150px;top:-200px;pointer-events:none;
  background:radial-gradient(circle,rgba(139,92,246,.4),transparent 66%);filter:blur(24px)}
.hero h1{font-size:clamp(30px,7.4vw,54px);font-weight:800;letter-spacing:-.035em;margin:16px 0 12px;max-width:660px;position:relative}
@media(min-width:860px){.hero h1{margin-left:0;margin-right:0}}
.hero-sub{font-size:15.5px;color:var(--muted);max-width:460px;position:relative}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px;position:relative}
@media(min-width:860px){.hero-actions{justify-content:flex-start}}
.hero > .pill{position:relative}
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:30px;position:relative}
@media(min-width:720px){.trust{grid-template-columns:repeat(4,1fr);gap:12px}}
.trust-item{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:12px;
  background:rgba(255,255,255,.032);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted)}
.trust-item svg.lucide,.trust-item i[data-lucide]{color:var(--accent);width:16px;height:16px}
.feat{padding:17px;display:flex;flex-direction:column;gap:10px}
.feat-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);border:1px solid rgba(139,92,246,.24);color:#b79bff}
.feat h3{font-size:14.5px}
.feat p{font-size:12.5px;color:var(--muted);line-height:1.55}
.cta{position:relative;overflow:hidden;margin-top:40px;border-radius:var(--r-xl);padding:34px 22px;text-align:center;
  border:1px solid rgba(139,92,246,.28);background:linear-gradient(140deg,rgba(139,92,246,.2),rgba(59,130,246,.07) 60%,transparent)}
.cta h2{font-size:clamp(22px,5vw,30px);font-weight:800;letter-spacing:-.03em}
.cta p{color:var(--muted);margin-top:8px;font-size:14px}
.cta .btn{margin-top:20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.label{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.01em}
.input,select,textarea{width:100%;background:rgba(255,255,255,.042);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:.18s var(--ease);appearance:none}
select{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%239a96ad' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M4 6l4 4 4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:38px}
select option{background:#141019;color:#fff}
textarea{min-height:92px;resize:vertical;line-height:1.55}
.input::placeholder,textarea::placeholder{color:var(--muted-2)}
.input:focus,select:focus,textarea:focus{border-color:rgba(139,92,246,.55);background:rgba(255,255,255,.065);box-shadow:0 0 0 3px rgba(139,92,246,.13)}
.input[disabled],select[disabled]{opacity:.55;cursor:not-allowed}
.field-error{display:none;color:#ff9b9b;font-size:11.5px;margin-top:4px;font-weight:600;line-height:1.4}
.field-error.show{display:block}
.field.invalid .input,.field.invalid .cd-select-trigger,.field.invalid textarea{
  border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.045)}
.field.invalid .input:focus,.field.invalid .cd-select-trigger:focus,.field.invalid textarea:focus{
  box-shadow:0 0 0 3px rgba(239,68,68,.15);border-color:rgba(239,68,68,.7)}
.field.invalid .label{color:#ffb3b3}
.cd-select{position:relative;width:100%}
.cd-select-native{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;top:0;left:0;border:0;padding:0}
.cd-select-trigger{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 14px;
  background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.1);border-radius:12px;
  color:var(--text);font-size:14px;font-family:inherit;text-align:left;cursor:pointer;transition:.18s var(--ease)}
.cd-select-trigger:hover{border-color:var(--border-hi);background:rgba(0,0,0,.32)}
.cd-select.open .cd-select-trigger{border-color:rgba(139,92,246,.6);background:rgba(0,0,0,.4);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.cd-select-value{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#fff}
.cd-select-value.placeholder{color:var(--muted-2);font-weight:500}
.cd-select-trigger svg.lucide,.cd-select-trigger i[data-lucide]{width:16px;height:16px;color:var(--accent);flex:none;transition:transform .25s var(--ease)}
.cd-select.open .cd-select-trigger svg.lucide,.cd-select.open .cd-select-trigger i[data-lucide]{transform:rotate(180deg)}
.cd-select-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;background:rgba(20,17,28,.99);
  border:1px solid rgba(139,92,246,.32);border-radius:12px;padding:6px;
  box-shadow:0 22px 50px -20px rgba(0,0,0,1), 0 0 24px -10px rgba(139,92,246,.6);backdrop-filter:blur(18px);
  max-height:260px;overflow:auto;display:none;animation:cdOpen .18s var(--ease);-webkit-overflow-scrolling:touch}
.cd-select.open .cd-select-menu{display:block}
@keyframes cdOpen{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.cd-select-option{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:11px 13px;
  border-radius:9px;background:transparent;border:none;color:var(--text);font-size:13.5px;font-weight:600;
  font-family:inherit;text-align:left;cursor:pointer;transition:.15s var(--ease)}
.cd-select-option:hover{background:rgba(255,255,255,.06)}
.cd-select-option.selected{background:linear-gradient(90deg,rgba(139,92,246,.22),rgba(139,92,246,.06));color:#fff}
.cd-select-option.selected::after{content:'✓';color:var(--accent);font-weight:800;font-size:14px;margin-left:auto}
.pw-wrap{position:relative;display:block}
.pw-wrap .input{padding-right:46px}
.pw-toggle{position:absolute;right:6px;top:14px;width:34px;height:34px;border-radius:9px;
  background:transparent;border:none;display:grid;place-items:center;color:var(--muted-2);transition:.15s var(--ease)}
.pw-toggle:hover{color:var(--text);background:rgba(255,255,255,.06)}
.pw-toggle:active{transform:scale(.92)}
.pw-toggle svg.lucide,.pw-toggle i[data-lucide]{width:17px;height:17px}
.check{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.028);cursor:pointer;transition:.18s var(--ease);margin-bottom:9px}
.check:hover{border-color:var(--border-hi);background:rgba(255,255,255,.05)}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:1px 0 0;flex:none;cursor:pointer}
.check .c-t{font-size:13.5px;font-weight:600}
.check .c-s{font-size:11.5px;color:var(--muted-2);margin-top:2px}
.info-box{display:flex;gap:11px;padding:13px 14px;border-radius:var(--r);background:rgba(59,130,246,.075);
  border:1px solid rgba(59,130,246,.24);font-size:12.5px;color:#bcd4fb;line-height:1.55;margin:4px 0 16px}
.info-box svg.lucide,.info-box i[data-lucide]{color:#7cb0f7;flex:none;margin-top:1px;width:17px;height:17px}
.info-box.warn{background:rgba(245,158,11,.075);border-color:rgba(245,158,11,.24);color:#f3d59a}
.info-box.warn svg.lucide,.info-box.warn i[data-lucide]{color:#f0b64a}
.summary{border-radius:var(--r);border:1px solid var(--border);background:rgba(255,255,255,.028);padding:15px;margin-top:6px}
.price-row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--muted);gap:12px}
.price-row span:last-child{color:var(--text);font-weight:600;text-align:right}
.price-row.total{border-top:1px dashed var(--border-hi);margin-top:8px;padding-top:12px;font-size:15px;color:var(--text);font-weight:800}
.price-row.total span:last-child{color:#c4b1ff;font-size:18px;font-weight:800}
.order-card{padding:15px;display:flex;flex-direction:column;gap:12px}
.order-card:hover{border-color:var(--border-hi)}
.order-main{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.order-main h3{font-size:14.5px}
.order-foot{align-items:center}
.status{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:11px;
  font-weight:800;letter-spacing:.03em;text-transform:uppercase;flex:none}
.status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pending{background:rgba(245,158,11,.13);color:#fbbf24;border:1px solid rgba(245,158,11,.28)}
.st-progress{background:rgba(59,130,246,.13);color:#7cb0f7;border:1px solid rgba(59,130,246,.3)}
.st-completed{background:rgba(34,197,94,.13);color:#5ee08a;border:1px solid rgba(34,197,94,.28)}
.st-cancelled{background:rgba(239,68,68,.12);color:#ff9b9b;border:1px solid rgba(239,68,68,.26)}
.st-awaiting{background:rgba(245,158,11,.13);color:#fbbf24;border:1px solid rgba(245,158,11,.32)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;border-radius:14px;background:rgba(255,255,255,.032);
  border:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;white-space:nowrap;padding:9px 14px;border-radius:10px;border:none;background:transparent;
  color:var(--muted);font-size:12.5px;font-weight:700;transition:.18s var(--ease)}
.tab:hover{color:var(--text)}
.tab.active{background:linear-gradient(135deg,rgba(139,92,246,.9),rgba(109,40,217,.9));color:#fff;box-shadow:0 8px 20px -12px rgba(139,92,246,1)}
.tab-reset{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--accent);
  background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.28);padding:5px 10px;border-radius:8px;transition:.18s var(--ease)}
.tab-reset:hover{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.55)}
.tab-reset svg.lucide,.tab-reset i[data-lucide]{width:12px;height:12px}
.tl{position:relative;padding-left:26px;margin-top:6px}
.tl::before{content:'';position:absolute;left:6px;top:9px;bottom:14px;width:2px;background:rgba(255,255,255,.09);border-radius:2px}
.tl-item{position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:#16121f;
  border:2px solid #332c44;transition:.3s var(--ease)}
.tl-item.done .tl-dot{background:var(--accent);border-color:rgba(139,92,246,.5);box-shadow:0 0 0 4px rgba(139,92,246,.13)}
.tl-item.current .tl-dot{animation:pulse 1.8s infinite}
.tl-title{font-size:13.5px;font-weight:700;color:var(--muted)}
.tl-item.done .tl-title{color:var(--text)}
.tl-time{font-size:11.5px;color:var(--muted-2);margin-top:2px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(139,92,246,.5)}70%{box-shadow:0 0 0 9px rgba(139,92,246,0)}100%{box-shadow:0 0 0 0 rgba(139,92,246,0)}}
.provider{display:flex;gap:13px;align-items:center;padding:15px}
.p-avatar{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:800;
  font-size:17px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.p-stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.p-stats span{display:inline-flex;align-items:center;gap:5px}
.p-stats svg.lucide,.p-stats i[data-lucide]{width:13px;height:13px;color:var(--muted-2)}
.p-tag{font-size:11.5px;font-weight:600;color:#c4b1ff;margin-left:4px}
.balance-card{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:26px 22px;
  border:1px solid rgba(139,92,246,.3);background:linear-gradient(140deg,rgba(139,92,246,.24),rgba(59,130,246,.08) 62%,transparent)}
.balance-card::after{content:'';position:absolute;width:280px;height:280px;right:-110px;top:-130px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.4),transparent 66%)}
.balance-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.balance-value{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:-.035em;margin-top:8px;position:relative}
.tx{display:flex;align-items:center;gap:13px;padding:14px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--surface);transition:.18s var(--ease)}
.tx:hover{border-color:var(--border-hi)}
.tx-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.05);color:var(--muted)}
.tx-ic.in{background:rgba(34,197,94,.13);color:#5ee08a}
.tx-ic.out{background:rgba(239,68,68,.12);color:#ff9b9b}
.tx-ic.refund{background:rgba(139,92,246,.14);color:#c4b1ff}
.profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 18px 22px}
.profile-avatar-wrap{position:relative;width:112px;height:112px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(139,92,246,.24),rgba(59,130,246,.12));
  border:2px solid rgba(139,92,246,.4);box-shadow:0 14px 40px -18px rgba(139,92,246,.9);
  overflow:hidden;cursor:pointer;transition:.2s var(--ease)}
.profile-avatar-wrap:hover{border-color:rgba(139,92,246,.75);transform:translateY(-1px);box-shadow:0 18px 50px -18px rgba(139,92,246,1)}
.profile-avatar-img{width:100%;height:100%;object-fit:cover;display:block}
.profile-avatar-initial{width:100%;height:100%;display:grid;place-items:center;font-weight:800;font-size:38px;color:#fff;letter-spacing:-.02em}
.profile-avatar-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);opacity:0;transition:.2s var(--ease);color:#fff}
.profile-avatar-overlay svg.lucide,.profile-avatar-overlay i[data-lucide]{width:26px;height:26px}
.profile-avatar-wrap:hover .profile-avatar-overlay{opacity:1}
.avatar-edit-btn{margin-top:10px;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px;
  background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.4);color:#c4b1ff;font-size:12.5px;font-weight:700;letter-spacing:-.01em;transition:.18s var(--ease)}
.avatar-edit-btn:hover{background:rgba(139,92,246,.24);border-color:rgba(139,92,246,.7);color:#fff;transform:translateY(-1px)}
.avatar-edit-btn:active{transform:scale(.97)}
.avatar-edit-btn svg.lucide,.avatar-edit-btn i[data-lucide]{width:14px;height:14px}
.profile-name{font-size:22px;font-weight:800;letter-spacing:-.025em;color:#fff;margin-top:14px;line-height:1.2}
.profile-username{font-size:13.5px;color:#c4b1ff;font-weight:600;letter-spacing:.01em;margin-top:2px}
.profile-since{font-size:11.5px;color:var(--muted-2);margin-top:8px}
.profile-edit-btn{margin-top:16px;width:100%;max-width:320px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px;margin-top:18px}
.stat{padding:13px 10px;border-radius:var(--r);border:1px solid var(--border);background:rgba(255,255,255,.03);text-align:center}
.stat .v{font-size:17px;font-weight:800;letter-spacing:-.02em;color:#fff}
.stat .l{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;font-weight:700}
.row-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--surface);transition:.18s var(--ease);color:#fff;text-align:left;width:100%}
.row-item:hover{border-color:var(--border-hi);background:var(--surface-hi)}
.row-item .ri-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06);color:#c4b1ff}
.row-item .ri-t{font-size:14px;font-weight:700;color:#fff;display:block}
.row-item .ri-s{font-size:11.5px;color:var(--muted);margin-top:2px;display:block}
.row-item > svg.lucide,.row-item > i[data-lucide]{color:var(--muted-2);flex:none}
.row-item:hover > svg.lucide,.row-item:hover > i[data-lucide]{color:var(--accent)}
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid var(--border);flex:none;transition:.2s var(--ease)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#8c88a0;transition:.22s var(--ease)}
.switch.on{background:rgba(139,92,246,.3);border-color:rgba(139,92,246,.5)}
.switch.on::after{left:20px;background:var(--accent);box-shadow:0 0 12px rgba(139,92,246,.9)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:52px 22px;border-radius:var(--r-xl);
  border:1px dashed var(--border-hi);background:rgba(255,255,255,.014)}
.empty-ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;margin-bottom:10px;background:var(--accent-soft);
  border:1px solid rgba(139,92,246,.22);color:#b79bff}
.empty-ic svg.lucide,.empty-ic i[data-lucide]{width:26px;height:26px}
.empty h3{font-size:16px}
.empty p{font-size:13px;color:var(--muted);max-width:300px}
.empty .btn{margin-top:14px}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.045),rgba(255,255,255,.1),rgba(255,255,255,.045));background-size:200% 100%;animation:shimmer 1.35s infinite;border-radius:12px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:400;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px);pointer-events:none}
@media(min-width:1024px){#toasts{left:auto;right:26px;bottom:26px;transform:none}}
.toast{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:14px;background:rgba(18,15,26,.97);
  border:1px solid var(--border-hi);backdrop-filter:blur(18px);box-shadow:0 20px 44px -22px rgba(0,0,0,1);
  font-size:13.5px;font-weight:600;animation:toastIn .3s var(--ease)}
.toast.out{animation:toastOut .26s var(--ease) forwards}
.toast svg.lucide,.toast i[data-lucide]{flex:none;width:18px;height:18px}
.toast-success svg.lucide,.toast-success i[data-lucide]{color:#5ee08a}
.toast-error svg.lucide,.toast-error i[data-lucide]{color:#ff9b9b}
.toast-info svg.lucide,.toast-info i[data-lucide]{color:#7cb0f7}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
.modal-backdrop{position:fixed;inset:0;z-index:300;background:rgba(4,3,8,.72);backdrop-filter:blur(6px);
  display:grid;place-items:end center;padding:0;animation:fadeIn .2s var(--ease)}
@media(min-width:640px){.modal-backdrop{place-items:center;padding:20px}}
.modal{width:100%;max-width:440px;background:rgba(17,14,25,.99);border:1px solid var(--border-hi);
  border-radius:22px 22px 0 0;padding:22px;animation:slideUp .28s var(--ease);max-height:88vh;overflow:auto}
@media(min-width:640px){.modal{border-radius:22px;animation:pop .22s var(--ease)}}
@keyframes slideUp{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.footer{margin-top:auto;border-top:1px solid var(--border);background:rgba(9,8,14,.55);position:relative;z-index:1}
.footer-inner{max-width:1220px;margin:0 auto;padding:30px 20px 40px;display:flex;flex-direction:column;gap:22px}
@media(min-width:768px){.footer-inner{flex-direction:row;justify-content:space-between;align-items:flex-start;padding:36px 34px 44px}}
.footer-brand p{font-size:13px;color:var(--muted);margin-top:10px;max-width:260px}
.footer-links{display:flex;flex-wrap:wrap;gap:9px 22px}
.footer-links a{font-size:13px;color:var(--muted);font-weight:600;transition:.18s}
.footer-links a:hover{color:var(--accent)}
.footer-bottom{font-size:11.5px;color:var(--muted-2);border-top:1px solid var(--border);padding-top:18px;line-height:1.6}
@media(min-width:768px){.footer-bottom{grid-column:1/-1}}
.auth-wrap{max-width:430px;margin:12px auto 0}
.auth-card{padding:26px 22px}
@media(min-width:640px){.auth-card{padding:32px 30px}}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted-2);font-size:11.5px;font-weight:700;letter-spacing:.06em}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.faq-item{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);overflow:hidden;transition:.2s var(--ease)}
.faq-item:hover{border-color:var(--border-hi)}
.faq-q{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px;font-size:13.5px;
  font-weight:700;cursor:pointer;width:100%;background:none;border:none;color:var(--text);text-align:left}
.faq-q svg.lucide,.faq-q i[data-lucide]{color:var(--muted);transition:.25s var(--ease);flex:none}
.faq-item.open .faq-q svg.lucide,.faq-item.open .faq-q i[data-lucide]{transform:rotate(180deg);color:var(--accent)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s var(--ease)}
.faq-a p{padding:0 15px 15px;font-size:13px;color:var(--muted);line-height:1.65}
.faq-item.open .faq-a{max-height:280px}
.banner{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:30px 22px;margin-bottom:22px;border:1px solid var(--border)}
.banner::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.9}
.banner::after{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 100% at 12% 0%,rgba(255,255,255,.28),transparent 58%),linear-gradient(180deg,transparent 30%,rgba(0,0,0,.62))}
.banner-in{position:relative;z-index:1}
.banner h1{font-size:clamp(24px,6vw,38px);font-weight:800;letter-spacing:-.03em;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.banner p{color:rgba(255,255,255,.85);font-size:13.5px;margin-top:8px;max-width:520px}
.banner-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.bstat{display:flex;flex-direction:column;padding:10px 15px;border-radius:13px;background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px)}
.bstat .v{font-size:15px;font-weight:800}
.bstat .l{font-size:10.5px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-top:2px}
.success-screen{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 20px;gap:8px}
.success-ic{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(34,197,94,.24),rgba(139,92,246,.2));border:1px solid rgba(34,197,94,.36);
  color:#5ee08a;animation:pop .4s var(--ease)}
.success-ic svg.lucide,.success-ic i[data-lucide]{width:34px;height:34px}
.view > *{animation:fadeUp .38s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.notice{display:flex;gap:10px;padding:12px 13px;border-radius:var(--r);font-size:11.5px;line-height:1.55;
  background:rgba(255,255,255,.026);border:1px solid var(--border);color:var(--muted-2);margin-top:14px}
.notice svg.lucide,.notice i[data-lucide]{flex:none;width:15px;height:15px;margin-top:1px;color:var(--muted-2)}
.rank-item{margin-bottom:10px}
.rank-item:last-child{margin-bottom:0}
.rank-row{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);cursor:pointer;transition:.18s var(--ease)}
.rank-row:hover{border-color:var(--border-hi);background:var(--surface-hi);transform:translateY(-1px)}
.rank-row.expanded{border-color:rgba(139,92,246,.55);background:linear-gradient(135deg,rgba(139,92,246,.14),rgba(139,92,246,.03));border-radius:var(--r) var(--r) 0 0;transform:none}
.svc-avatar{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-weight:800;font-size:14px;color:#fff;letter-spacing:.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.01em;line-height:1.2}
.rank-divisions{font-size:11.5px;color:var(--muted-2);margin-top:4px;letter-spacing:.01em;line-height:1.35}
.rank-price{flex:none;text-align:right;font-size:15px;font-weight:800;color:#c4b1ff;letter-spacing:-.01em;line-height:1.15}
.rank-price small{display:block;font-size:9.5px;color:var(--muted-2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.rank-detail{padding:16px;background:rgba(139,92,246,.05);border:1px solid rgba(139,92,246,.4);border-top:none;border-radius:0 0 var(--r) var(--r);animation:rankExpand .25s var(--ease)}
@keyframes rankExpand{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.rank-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:13px;margin-bottom:14px;border-bottom:1px dashed var(--border-hi)}
.rank-detail-name{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.01em}
.rank-detail-sub{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.01em}
.rank-detail-price{font-size:17px;font-weight:800;color:#c4b1ff;flex:none;letter-spacing:-.01em}
.rank-detail .field:last-of-type{margin-bottom:16px}
.rank-detail .input{background:rgba(0,0,0,.24);border-color:rgba(255,255,255,.1)}
.rank-detail .input:focus{background:rgba(0,0,0,.35)}
.pay-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(245,158,11,.12);
  border:1px solid rgba(245,158,11,.34);color:#f3d59a;font-size:11px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.pay-tag svg.lucide,.pay-tag i[data-lucide]{width:12px;height:12px}
.qr-box{width:180px;height:180px;margin:6px auto 14px;padding:10px;background:#fff;border-radius:14px;
  box-shadow:0 8px 24px -10px rgba(0,0,0,.7);position:relative}
.qr-box::after{content:'DEMO';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);
  font-weight:800;font-size:13px;letter-spacing:.16em;color:rgba(139,92,246,.75);background:rgba(255,255,255,.85);
  padding:3px 10px;border-radius:6px;border:1.5px dashed rgba(139,92,246,.55);pointer-events:none}
.bank-info{display:grid;gap:6px;padding:12px 14px;border-radius:var(--r);background:rgba(255,255,255,.028);border:1px solid var(--border);font-size:12.5px;margin-bottom:14px}
.bank-info .bi-row{display:flex;justify-content:space-between;gap:10px}
.bank-info .bi-row span:first-child{color:var(--muted-2)}
.bank-info .bi-row span:last-child{color:var(--text);font-weight:700}
.pay-amount-label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
.pay-amount-input{position:relative;margin-bottom:10px}
.pay-amount-input .input{font-size:16px;font-weight:700;letter-spacing:-.01em;padding-right:52px}
.pay-amount-input .suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:13px;font-weight:700;pointer-events:none}
.pay-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.pay-quick .chip{padding:9px 6px;font-size:11.5px;text-align:center;justify-content:center;display:flex;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);font-weight:700;transition:.18s var(--ease)}
.pay-quick .chip:hover{border-color:var(--border-hi);color:var(--text)}
.pay-quick .chip.active{background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.45);color:#c4b1ff}
.pay-ref{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-radius:var(--r);background:rgba(139,92,246,.08);border:1px dashed rgba(139,92,246,.4);margin-bottom:16px}
.pay-ref .pr-l{font-size:11px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.pay-ref .pr-v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:800;color:#c4b1ff;letter-spacing:.04em}
.pay-ref button{background:none;border:none;color:var(--muted);padding:4px;transition:.15s}
.pay-ref button:hover{color:var(--accent)}
.pay-foot-note{display:flex;gap:8px;align-items:flex-start;font-size:11px;color:var(--muted-2);margin-top:14px;line-height:1.55}
.pay-foot-note svg.lucide,.pay-foot-note i[data-lucide]{width:13px;height:13px;flex:none;margin-top:1px}
.loading-overlay{position:fixed;inset:0;z-index:500;background:rgba(4,3,8,.85);backdrop-filter:blur(10px);display:grid;place-items:center;padding:20px;animation:fadeIn .22s var(--ease)}
.loading-box{display:flex;flex-direction:column;align-items:center;gap:18px;padding:34px 42px;background:rgba(17,14,25,.98);
  border:1px solid rgba(139,92,246,.4);border-radius:22px;box-shadow:0 30px 80px -30px rgba(139,92,246,.7), var(--shadow);
  animation:pop .28s var(--ease);text-align:center}
.loading-spinner{width:52px;height:52px;position:relative;border-radius:50%;border:3px solid rgba(139,92,246,.16);border-top-color:var(--accent);animation:spin .85s linear infinite}
.loading-spinner::after{content:'';position:absolute;inset:8px;border-radius:50%;border:2px solid transparent;border-bottom-color:rgba(96,165,250,.85);animation:spin 1.15s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14.5px;font-weight:800;color:var(--text);letter-spacing:-.01em}
.order-success-wrap{text-align:center}
.success-check{width:72px;height:72px;margin:2px auto 16px;border-radius:22px;background:linear-gradient(135deg, rgba(34,197,94,.24), rgba(139,92,246,.22));
  border:1px solid rgba(34,197,94,.44);display:grid;place-items:center;color:#5ee08a;position:relative;animation:successPop .55s cubic-bezier(.22,1.3,.36,1) both}
.success-check::before{content:'';position:absolute;inset:-8px;border-radius:28px;background:radial-gradient(circle, rgba(34,197,94,.4), transparent 68%);
  opacity:0;animation:successGlow 1.3s ease-out .12s;pointer-events:none}
.success-check svg.lucide,.success-check i[data-lucide]{width:34px;height:34px}
@keyframes successPop{0%{transform:scale(0) rotate(-90deg);opacity:0}60%{transform:scale(1.08) rotate(0);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes successGlow{0%{opacity:0;transform:scale(.7)}50%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
.order-success-title{font-size:18px;font-weight:800;letter-spacing:-.02em;color:#5ee08a;line-height:1.25;margin-bottom:6px;animation:fadeUp .4s var(--ease) .1s both}
.order-success-sub{font-size:12.5px;color:var(--muted);margin-bottom:18px;animation:fadeUp .4s var(--ease) .16s both}
.order-info-box{display:grid;gap:8px;padding:14px 15px;background:rgba(255,255,255,.028);border:1px solid var(--border);border-radius:var(--r);text-align:left;margin-bottom:14px;animation:fadeUp .4s var(--ease) .22s both}
.order-info-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;align-items:center}
.order-info-row .k{color:var(--muted-2);flex:none}
.order-info-row .v{color:var(--text);font-weight:700;text-align:right;word-break:break-word;min-width:0}
.order-info-row.highlight .v{color:#c4b1ff;font-size:14.5px}
.order-info-row.status-row .v{color:#fbbf24}
.order-contact-note{font-size:12.5px;color:var(--muted);line-height:1.6;text-align:left;margin-bottom:14px;padding:0 2px;animation:fadeUp .4s var(--ease) .3s both}
.contact-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:800;margin-bottom:10px;text-align:left;animation:fadeUp .4s var(--ease) .34s both}
.contact-links{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;animation:fadeUp .4s var(--ease) .38s both}
.contact-link{flex:1;min-width:120px;display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:12px;
  background:rgba(255,255,255,.045);border:1px solid var(--border-hi);color:var(--text);font-weight:700;font-size:14px;letter-spacing:-.01em;transition:.18s var(--ease);text-decoration:none}
.contact-link:hover{background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.5);color:#c4b1ff;transform:translateY(-1px)}
.contact-link:active{transform:scale(.97)}
.orders-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 18px;border-radius:13px;
  background:rgba(255,255,255,.05);border:1px solid var(--border-hi);color:var(--text);font-weight:700;font-size:14px;
  transition:.18s var(--ease);text-decoration:none;margin-bottom:14px;animation:fadeUp .4s var(--ease) .44s both}
.orders-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.24)}
.orders-btn:active{transform:scale(.98)}
.orders-btn svg.lucide,.orders-btn i[data-lucide]{width:17px;height:17px}
.security-notice{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:var(--r);background:rgba(59,130,246,.06);
  border:1px solid rgba(59,130,246,.22);font-size:11.5px;color:#bcd4fb;line-height:1.55;text-align:left;animation:fadeUp .4s var(--ease) .5s both}
.security-notice svg.lucide,.security-notice i[data-lucide]{width:14px;height:14px;color:#7cb0f7;flex:none;margin-top:1px}
.insufficient-wrap{text-align:left}
.insufficient-head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.insufficient-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.36);color:#ff9b9b;animation:pop .4s var(--ease)}
.insufficient-ic svg.lucide,.insufficient-ic i[data-lucide]{width:22px;height:22px}
.insufficient-title{font-size:17px;font-weight:800;color:#ff9b9b;letter-spacing:-.015em;line-height:1.2}
.insufficient-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.insufficient-msg{font-size:13.5px;color:var(--text);line-height:1.6;margin-bottom:16px;padding:12px 14px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:var(--r)}
.insufficient-msg strong{color:#ffb3b3;font-weight:800}
.modal-avatar-block{display:flex;flex-direction:column;align-items:center;margin-bottom:18px}
.modal-avatar-wrap{width:88px;height:88px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(139,92,246,.24),rgba(59,130,246,.12));
  border:2px solid rgba(139,92,246,.4);overflow:hidden;cursor:pointer;transition:.2s var(--ease);position:relative}
.modal-avatar-wrap:hover{border-color:rgba(139,92,246,.75)}
.modal-avatar-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.modal-avatar-initial{width:100%;height:100%;display:grid;place-items:center;font-weight:800;font-size:30px;color:#fff}
.modal-avatar-edit{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--accent);background:none;border:none;padding:4px 8px;border-radius:8px;transition:.15s var(--ease)}
.modal-avatar-edit:hover{background:rgba(139,92,246,.12)}
.modal-avatar-delete{color:#ff9b9b;margin-top:4px}
.modal-avatar-delete:hover{background:rgba(239,68,68,.12);color:#ffb3b3}
.cooldown-hint{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:rgba(245,158,11,.08);
  border:1px solid rgba(245,158,11,.28);font-size:11.5px;color:#f3d59a;line-height:1.5;margin-top:6px}
.cooldown-hint svg.lucide,.cooldown-hint i[data-lucide]{width:14px;height:14px;color:#f0b64a;flex:none;margin-top:1px}
.logout-confirm{text-align:center}
.logout-confirm-ic{width:60px;height:60px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#ff9b9b}
.logout-confirm-ic svg.lucide,.logout-confirm-ic i[data-lucide]{width:26px;height:26px}
.logout-confirm h3{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.25}
.logout-confirm p{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.55}
.logout-confirm p strong{color:#c4b1ff;font-weight:800}
.logout-confirm-actions{display:flex;gap:10px;margin-top:22px}
.logout-confirm-actions .btn{flex:1}

/* ========== ADMIN REDESIGN ========== */
body.admin-mode{
  --accent:#6366f1;
  --accent-soft:rgba(99,102,241,.14);
  --adm-surface:rgba(255,255,255,.028);
  --adm-surface-hi:rgba(255,255,255,.05);
  --adm-border:rgba(255,255,255,.07);
  --adm-border-hi:rgba(255,255,255,.13);
  --adm-accent-soft:rgba(99,102,241,.12);
  --adm-accent-border:rgba(99,102,241,.35);
}
body.admin-mode::before{
  background:radial-gradient(720px 520px at 8% -12%, rgba(99,102,241,.14), transparent 62%),
    radial-gradient(620px 520px at 102% 2%, rgba(59,130,246,.08), transparent 60%);
}
body.admin-mode .sidebar{
  background:linear-gradient(180deg,rgba(13,12,20,.9),rgba(8,7,12,.82));
}
body.admin-mode .nav-item.active{
  background:linear-gradient(90deg,rgba(99,102,241,.16),rgba(99,102,241,.03));color:#fff;
}
body.admin-mode .nav-item.active::before{background:#6366f1;box-shadow:0 0 12px rgba(99,102,241,.9)}
body.admin-mode .bn-item.active{color:#818cf8}
body.admin-mode .bn-item.active svg.lucide,
body.admin-mode .bn-item.active i[data-lucide]{filter:drop-shadow(0 0 8px rgba(99,102,241,.7))}

/* Admin topbar */
.topbar.admin-topbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px 12px;
  align-items:center;
  padding:12px 16px;
}
@media(min-width:900px){
  .topbar.admin-topbar{grid-template-columns:auto 1fr auto;padding:12px 28px;gap:20px;flex-wrap:nowrap}
}
.adm-brand{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.adm-brand .name{font-weight:800;font-size:13px;letter-spacing:.13em;color:#fff}
.adm-brand .sub{font-size:10.5px;color:var(--muted-2);letter-spacing:.05em;font-weight:600;margin-top:3px}
.adm-search{position:relative;grid-column:1/-1;order:3;display:flex;align-items:center}
@media(min-width:900px){.adm-search{grid-column:auto;order:0;max-width:520px;width:100%}}
.adm-search > svg.lucide,.adm-search > i[data-lucide]{
  position:absolute;left:12px;width:15px;height:15px;color:var(--muted-2);pointer-events:none;
}
.adm-search input{
  width:100%;background:rgba(255,255,255,.035);border:1px solid var(--adm-border);border-radius:10px;
  padding:9px 12px 9px 34px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:.18s ease;
}
.adm-search input::placeholder{color:var(--muted-2)}
.adm-search input:focus{
  border-color:var(--adm-accent-border);background:rgba(255,255,255,.055);
  box-shadow:0 0 0 3px rgba(99,102,241,.12);
}
.adm-search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:90;
  background:rgba(16,14,22,.99);border:1px solid var(--adm-border-hi);border-radius:12px;
  box-shadow:0 20px 46px -20px rgba(0,0,0,1);padding:6px;max-height:60vh;overflow:auto;display:none;
}
.adm-search-results.open{display:block;animation:pop .16s var(--ease)}
.adm-search-empty{padding:22px 14px;text-align:center;font-size:12.5px;color:var(--muted-2)}
.adm-sug-group{padding:7px 10px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-2);font-weight:800}
.adm-sug{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:.15s}
.adm-sug:hover{background:rgba(255,255,255,.05)}
.adm-sug .ic{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--adm-accent-soft);color:#a5b4fc;
}
.adm-sug .ic svg.lucide,.adm-sug .ic i[data-lucide]{width:14px;height:14px}
.adm-sug .t{font-size:13px;font-weight:600;color:#fff;line-height:1.25}
.adm-sug .s{font-size:11px;color:var(--muted-2);margin-top:2px}
.adm-header-actions{display:flex;align-items:center;gap:8px;justify-self:end}
.adm-avatar{
  width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#4338ca);
  color:#fff;font-weight:800;font-size:11.5px;display:grid;place-items:center;letter-spacing:.04em;flex:none;
}
.adm-role{display:none;font-size:11.5px;color:var(--muted);font-weight:600;padding-right:4px}
@media(min-width:640px){.adm-role{display:inline}}
body.admin-mode .icon-btn{background:rgba(255,255,255,.028);border-color:var(--adm-border)}
body.admin-mode .icon-btn:hover{background:rgba(255,255,255,.055);border-color:var(--adm-border-hi)}

/* Admin heading */
.adm-h2{
  font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:12px;
}
.adm-section{margin-bottom:26px}
.adm-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.adm-section-head h2{font-size:14.5px;font-weight:800;color:#fff;letter-spacing:-.01em}
.adm-section-head .link{
  font-size:12px;font-weight:700;color:#a5b4fc;display:inline-flex;align-items:center;gap:4px;
  background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:6px;transition:.15s;
}
.adm-section-head .link:hover{background:rgba(99,102,241,.12)}
.adm-section-head .link svg.lucide,.adm-section-head .link i[data-lucide]{width:13px;height:13px}

/* Admin stat cards */
.adm-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.adm-stats{grid-template-columns:repeat(4,1fr);gap:12px}}
.adm-stat{padding:14px;background:var(--adm-surface);border:1px solid var(--adm-border);border-radius:12px;transition:.18s ease}
.adm-stat:hover{border-color:var(--adm-border-hi)}
.adm-stat .l{
  font-size:10.5px;font-weight:800;color:var(--muted-2);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:8px;line-height:1.3;
}
.adm-stat .v{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.15;word-break:break-word}
.adm-stat .v.small{font-size:13.5px}
.adm-stat .d{font-size:11px;color:var(--muted-2);margin-top:5px}

/* Admin action list */
.adm-actions{display:flex;flex-direction:column;gap:8px}

  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--adm-surface);border:1px solid var(--adm-border);border-radius:12px;
  cursor:pointer;transition:.18s ease;text-align:left;color:inherit;font-family:inherit;width:100%;
}
.adm-action:hover{background:var(--adm-surface-hi);border-color:var(--adm-border-hi)}
.adm-action .ic{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:var(--adm-accent-soft);color:#a5b4fc;flex:none;
}
.adm-action .ic svg.lucide,.adm-action .ic i[data-lucide]{width:16px;height:16px}
.adm-action .body{flex:1;min-width:0}
.adm-action .title{font-size:13.5px;font-weight:700;color:#fff;line-height:1.25}
.adm-action .sub{font-size:11.5px;color:var(--muted-2);margin-top:2px}

/* Admin activity timeline */

.adm-act:last-child{border-bottom:none}

  font-size:11px;color:var(--muted-2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;

/* Admin item list */
.adm-list{display:flex;flex-direction:column;gap:8px}

.adm-item-sub{font-size:12px;color:var(--muted);margin-top:3px;word-break:break-word}
.adm-item-right{flex:none;text-align:right}
.adm-meta{

/* Admin status badge */
.adm-st{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;

<script>
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtVND = n => Number(n || 0).toLocaleString('vi-VN') + ' VND';
const fmtDate = ts => new Date(ts).toLocaleDateString('vi-VN', { day:'2-digit', month:'short', year:'numeric' });
const fmtDateTime = ts => new Date(ts).toLocaleString('vi-VN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
function timeAgo(ts){
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'vừa xong';
  if (s < 3600) return Math.floor(s/60) + ' phút trước';
  if (s < 86400) return Math.floor(s/3600) + ' giờ trước';
  return Math.floor(s/86400) + ' ngày trước';
}
function fmtClock(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function hashCode(str){ let h = 0; for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) | 0; return Math.abs(h); }
const uid = p => (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function fmtOrderId(id){ const s = String(id || ''); return s.startsWith('WQ') ? '#' + s : s; }
function handleFromUsername(name){ return '@' + String(name || '').trim().toLowerCase().replace(/\s+/g, ''); }

const VN_DAYS = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
function getVietnameseDate(d){
  d = d || new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yyyy = d.getFullYear();
  return VN_DAYS[d.getDay()] + ', ngày ' + dd + '/' + mm + '/' + yyyy;
}
function currentDateKey(){ const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
let _lastDateKey = currentDateKey();
function refreshDateDisplays(){
  const els = document.querySelectorAll('[data-date-display]');
  if (!els.length) return;
  const s = getVietnameseDate();
  els.forEach(el => { if (el.textContent !== s) el.textContent = s; });
}
setInterval(() => {
  const k = currentDateKey();
  if (k !== _lastDateKey){
    _lastDateKey = k;
    const els = document.querySelectorAll('[data-date-display]');
    if (els.length){
      const s = getVietnameseDate();
      els.forEach(el => { el.textContent = s; });
    }
  }
}, 20000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden){ _lastDateKey = currentDateKey(); refreshDateDisplays(); }
});

const NAME_CHANGE_COOLDOWN = 7 * 24 * 60 * 60 * 1000;
function canChangeName(user){
  if (!user || !user.lastNameChange) return { ok: true };
  const elapsed = Date.now() - user.lastNameChange;
  if (elapsed >= NAME_CHANGE_COOLDOWN) return { ok: true };
  return { ok: false, remainingMs: NAME_CHANGE_COOLDOWN - elapsed };
}
function fmtRemaining(ms){
  if (ms <= 0) return '0 phút';
  const totalMin = Math.floor(ms / 60000);
  const d = Math.floor(totalMin / (24 * 60));
  const h = Math.floor((totalMin % (24 * 60)) / 60);
  const m = totalMin % 60;
  if (d > 0) return `${d} ngày ${h} giờ`;
  if (h > 0) return `${h} giờ ${m} phút`;
  return `${m} phút`;
}

const FALLBACK = {
  'home':'⌂','gamepad-2':'▣','receipt':'▤','wallet':'▭','heart':'♡','user':'○','settings':'⚙',
  'bell':'◔','search':'⌕','log-out':'⇥','chevron-right':'›','chevron-left':'‹','chevron-down':'⌄',
  'star':'★','shield-check':'✓','zap':'⚡','clock':'◷','check-circle':'✓','check':'✓','alert-circle':'!','info':'i',
  'plus':'+','message-circle':'◌','help-circle':'?','arrow-right':'→','filter':'≡','trophy':'♛','sparkles':'✦',
  'lock':'🔒','headphones':'♫','ticket':'▤','award':'◈','trending-up':'↗','activity':'∿','x':'×',
  'copy':'⧉','edit-3':'✎','rotate-ccw':'↺','send':'➤','eye':'◉','eye-off':'◍','camera':'◉','image':'▣',
  'key':'🔑','calendar':'▦','globe':'◍','layout-grid':'▦','users':'⛃'
};
function refreshIcons(){
  if (window.lucide && typeof window.lucide.createIcons === 'function'){
    try { window.lucide.createIcons(); return; } catch(e){}
  }
  $$('i[data-lucide]').forEach(el => {
    if (el.dataset.fb) return;
    el.dataset.fb = '1';
    el.classList.add('icon-fb');
    el.textContent = FALLBACK[el.dataset.lucide] || '•';
  });
}
const ic = (name, cls) => `<i data-lucide="${name}"${cls ? ` class="${cls}"` : ''}></i>`;

const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const K = { users:'tb_users', session:'tb_session', adminSession:'tb_admin_session', data: id => 'tb_data_' + id };
const ADMIN_EMAIL = 'quan810@gmail.com';
const ADMIN_PASSWORD = '123456';
function isAdminSession(){ return LS.get(K.adminSession, false) === true; }
function setAdminSession(v){ if (v) LS.set(K.adminSession, true); else LS.del(K.adminSession); }

function demoHash(s){
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return 'demo$' + (h >>> 0).toString(16);
}
const AV_COLORS = ['linear-gradient(135deg,#8b5cf6,#6d28d9)','linear-gradient(135deg,#3b82f6,#1d4ed8)','linear-gradient(135deg,#06b6d4,#0e7490)','linear-gradient(135deg,#ec4899,#9d174d)','linear-gradient(135deg,#f59e0b,#b45309)','linear-gradient(135deg,#22c55e,#15803d)'];
const pickColor = () => AV_COLORS[Math.floor(Math.random() * AV_COLORS.length)];
function defaultData(){
  return {
    orders: [], favorites: { games: [], services: [], providers: [] }, notifications: [],
    wallet: { balance: 0, transactions: [] },
    settings: {
      emailNotif: true, pushNotif: true, orderUpdates: true, marketing: false,
      language: 'vi', theme: 'dark', publicProfile: false, showStats: true,
      twoFactor: false, loginAlerts: true
    },
    tickets: []
  };
}
function getUsers(){ return LS.get(K.users, []); }
function saveUsers(list){ return LS.set(K.users, list); }
function getCurrentUser(){
  const id = LS.get(K.session, null);
  if (!id) return null;
  return getUsers().find(u => u.id === id) || null;
}
function getData(){
  const u = getCurrentUser();
  if (!u) return null;
  const stored = LS.get(K.data(u.id), null);
  const def = defaultData();
  if (!stored) return def;
  return {
    orders: stored.orders || [],
    notifications: stored.notifications || [],
    tickets: stored.tickets || [],
    favorites: Object.assign({}, def.favorites, stored.favorites || {}),
    wallet: Object.assign({}, def.wallet, stored.wallet || {}),
    settings: Object.assign({}, def.settings, stored.settings || {})
  };
}
function saveData(d){
  const u = getCurrentUser();
  if (!u) return false;
  return LS.set(K.data(u.id), d);
}
function registerUser({ username, email, password }){
  const users = getUsers();
  email = String(email || '').trim().toLowerCase();
  const uname = String(username || '').trim();
  if (uname.length < 3) return { ok:false, error:'Tên hiển thị phải có ít nhất 3 ký tự.' };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return { ok:false, error:'Vui lòng nhập địa chỉ email hợp lệ.' };
  if (String(password).length < 6) return { ok:false, error:'Mật khẩu phải có ít nhất 6 ký tự.' };
  if (email === ADMIN_EMAIL) return { ok:false, error:'Email này không thể đăng ký.' };
  if (users.some(u => u.email === email)) return { ok:false, error:'Email này đã được đăng ký.' };
  if (users.some(u => String(u.username || '').toLowerCase() === uname.toLowerCase()))
    return { ok:false, error:'Tên hiển thị này đã được sử dụng. Vui lòng chọn tên khác.' };
  const user = { id: uid('u'), username: uname, email, pass: demoHash(password),
    createdAt: Date.now(), color: pickColor(), avatar: null, lastNameChange: Date.now() };
  users.push(user);
  if (!saveUsers(users)) return { ok:false, error:'Không thể lưu tài khoản. Bộ nhớ trình duyệt đầy.' };
  LS.set(K.session, user.id);
  setAdminSession(false);
  const d = defaultData();
  d.notifications.push({ id: uid('n'), title: 'Chào mừng đến Webcuaquan',
    body: 'Tài khoản của bạn đã sẵn sàng. Nạp tiền vào ví và đặt đơn Free Fire đầu tiên.',
    time: Date.now(), read: false, type: 'info' });
  LS.set(K.data(user.id), d);
  return { ok:true, user };
}
function loginUser(email, password){
  email = String(email || '').trim().toLowerCase();
  if (email === ADMIN_EMAIL && String(password) === ADMIN_PASSWORD){
    setAdminSession(true);
    LS.del(K.session);
    return { ok:true, isAdmin:true };
  }
  const users = getUsers();
  const user = users.find(u => u.email === email);
  if (!user) return { ok:false, error:'Không tìm thấy tài khoản với email này.' };
  if (user.pass !== demoHash(password)) return { ok:false, error:'Mật khẩu không đúng.' };
  setAdminSession(false);
  LS.set(K.session, user.id);
  return { ok:true, user };
}
function logoutUser(){ LS.del(K.session); }
function updateUser(patch){
  const u = getCurrentUser();
  if (!u) return false;
  const users = getUsers();
  const i = users.findIndex(x => x.id === u.id);
  if (i < 0) return false;
  users[i] = Object.assign({}, users[i], patch);
  return saveUsers(users);
}

function calcRankPrice(curIdx, tgtIdx){

  for (let i = curIdx; i < tgtIdx; i++) total += FF_RANK_STEP_PRICES[i];

function makeOrderId(){
  const d = getData();
  const existing = new Set((d && d.orders ? d.orders : []).map(o => String(o.id)));
  for (let i = 0; i < 300; i++){
    const num = Math.floor(10000 + Math.random() * 90000);
    const id = 'WQ' + num;
    if (!existing.has(id)) return id;
  }
  return 'WQ' + Date.now().toString().slice(-5);
}

function genRefCode(){ return 'NAP-' + Date.now().toString(36).toUpperCase().slice(-6); }
function fakeQR(seed, size){
  size = size || 21;
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = ((h << 5) - h + seed.charCodeAt(i)) | 0;
  const rand = (x, y) => {
    let v = (h ^ Math.imul(x, 73856093) ^ Math.imul(y, 19349663)) | 0;
    v = Math.imul(v, 2654435761) | 0;
    return ((v >>> 0) % 100) < 48;
  };
  const isFinder = (x, y) => (x < 7 && y < 7) || (x >= size - 7 && y < 7) || (x < 7 && y >= size - 7);
  const finder = (ox, oy) => {
    let s = '';
    for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++){
      const outer = x === 0 || y === 0 || x === 6 || y === 6;
      const inner = x >= 2 && x <= 4 && y >= 2 && y <= 4;
      if (outer || inner) s += `<rect x="${ox+x}" y="${oy+y}" width="1" height="1"/>`;
    }
    return s;
  };
  let cells = finder(0,0) + finder(size-7,0) + finder(0,size-7);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++){
    if (isFinder(x, y)) continue;
    if (rand(x, y)) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
    <rect width="${size}" height="${size}" fill="#fff"/><g fill="#000">${cells}</g></svg>`;
}

  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read-failed'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('img-load-failed'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h){ if (w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if (h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(c.toDataURL('image/jpeg', quality)); } catch(err){ reject(err); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handleAvatarFile(e){
  const file = e.target.files && e.target.files[0];
  if (avatarFileInput) avatarFileInput.value = '';
  if (!file) return;
  if (!file.type || !file.type.startsWith('image/')){ toast('Vui lòng chọn file ảnh', 'error'); return; }
  if (file.size > 5 * 1024 * 1024){ toast('Ảnh phải nhỏ hơn 5MB', 'error'); return; }

/* Update order status - keeps customer view synchronized */
function adminUpdateOrderStatus(orderId, newStatus){
  const all = getAllUserData();
  for (const {user, data} of all){
    const o = data.orders.find(x => x.id === orderId);
    if (o){
      if (o.status === newStatus) return true;
      const oldStatus = o.status;
      o.status = newStatus;
      o.updatedAt = Date.now();
      /* Handle refund if admin cancels an order that was paid */
      if (newStatus === 'cancelled' && oldStatus !== 'cancelled' && !o.refunded){
        const refund = o.total || 0;
        if (refund > 0){
          o.refunded = true;
          data.wallet.balance += refund;
          data.wallet.transactions.unshift({
            id: uid('t'),
            label: 'Hoàn tiền đơn ' + fmtOrderId(o.id),
            amount: refund,
            time: Date.now(),
            ref: 'REFUND'
          });
        }
      }
      /* If admin un-cancels, revoke refund (safety) */
      if (oldStatus === 'cancelled' && newStatus !== 'cancelled' && o.refunded){
        const refund = o.total || 0;
        if (refund > 0 && data.wallet.balance >= refund){
          data.wallet.balance -= refund;
          data.wallet.transactions.unshift({
            id: uid('t'),
            label: 'Huỷ hoàn tiền đơn ' + fmtOrderId(o.id),
            amount: -refund,
            time: Date.now(),
            ref: 'REVOKE'
          });
          o.refunded = false;
        }
      }
      data.notifications.unshift({
        id: uid('n'),
        title: 'Đơn hàng được cập nhật',
        body: 'Đơn ' + fmtOrderId(o.id) + ' đã được cập nhật sang trạng thái: ' + adminStatusLabel(newStatus) + '.',
        time: Date.now(), read: false, type: 'info'
      });
      const saved = LS.set(K.data(user.id), data);
      return saved;
    }
  }
  return false;
}

/* Build unified activity feed from all users */
function getAdminActivity(limit){
  const all = [];
  getAllUserData().forEach(({user, data}) => {
    all.push({
      time: user.createdAt,
      type: 'register',
      icon: 'user',
      text: `<strong>${esc(user.username)}</strong> đăng ký tài khoản`,
      userName: user.username
    });
    data.orders.forEach(o => {
      all.push({
        time: o.createdAt,
        type: 'order',
        icon: 'receipt',
        text: `<strong>${esc(user.username)}</strong> tạo đơn <strong>${esc(fmtOrderId(o.id))}</strong>`,
        userName: user.username,
        orderId: o.id
      });
      if (o.status === 'completed' && o.updatedAt && o.updatedAt > o.createdAt + 1000){
        all.push({
          time: o.updatedAt,
          type: 'order-done',
          icon: 'check-circle',
          text: `Đơn <strong>${esc(fmtOrderId(o.id))}</strong> đã hoàn thành`,
          userName: user.username,
          orderId: o.id
        });
      }
    });
    data.wallet.transactions.forEach(t => {
      const isRefund = t.ref === 'REFUND';
      const isRevoke = t.ref === 'REVOKE';
      const isIn = t.amount > 0;
      let text;
      let icon;
      if (isRefund) { text = `Hoàn tiền <strong>${fmtVND(t.amount)}</strong> cho <strong>${esc(user.username)}</strong>`; icon = 'rotate-ccw'; }
      else if (isRevoke) { text = `Huỷ hoàn tiền <strong>${fmtVND(Math.abs(t.amount))}</strong> cho <strong>${esc(user.username)}</strong>`; icon = 'rotate-ccw'; }
      else if (isIn) { text = `<strong>${esc(user.username)}</strong> nạp <strong>${fmtVND(t.amount)}</strong>`; icon = 'plus'; }
      else { text = `<strong>${esc(user.username)}</strong> thanh toán <strong>${fmtVND(Math.abs(t.amount))}</strong>`; icon = 'receipt'; }
      all.push({
        time: t.time,
        type: isRefund ? 'refund' : (isIn ? 'topup' : 'payment'),
        icon,
        text,
        userName: user.username
      });
    });
  });
  all.sort((a,b) => b.time - a.time);
  return limit ? all.slice(0, limit) : all;
}

let adminUsersFilter = { q:'', sort:'newest' };
function viewAdminUsers(){
  const allUsers = getAllUserData();
  const q = adminUsersFilter.q.trim().toLowerCase();
  let list = allUsers.filter(x => {
    if (!q) return true;
    return x.user.username.toLowerCase().includes(q) || x.user.email.toLowerCase().includes(q);
  });
  if (adminUsersFilter.sort === 'newest') list.sort((a,b) => b.user.createdAt - a.user.createdAt);
  else if (adminUsersFilter.sort === 'oldest') list.sort((a,b) => a.user.createdAt - b.user.createdAt);
  else if (adminUsersFilter.sort === 'orders') list.sort((a,b) => b.data.orders.length - a.data.orders.length);
  else if (adminUsersFilter.sort === 'balance') list.sort((a,b) => (b.data.wallet.balance||0) - (a.data.wallet.balance||0));

  const sorts = [
    ['newest','Mới nhất'],['oldest','Cũ nhất'],['orders','Nhiều đơn'],['balance','Số dư cao']

  return `
