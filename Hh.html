let adminTxFilter = { q:'', type:'all' };
function viewAdminWallet(){
  const allTx = getAllTransactions();
  const q = adminTxFilter.q.trim().toLowerCase();
  let list = allTx.filter(t => {
    if (adminTxFilter.type === 'topup' && !(t.amount > 0 && t.ref !== 'REFUND' && t.ref !== 'REVOKE')) return false;
    if (adminTxFilter.type === 'payment' && !(t.amount < 0 && t.ref === 'ORDER')) return false;
    if (adminTxFilter.type === 'refund' && !(t.ref === 'REFUND' || t.ref === 'REVOKE')) return false;
    if (!q) return true;
    return String(t.userName||'').toLowerCase().includes(q) || String(t.label||'').toLowerCase().includes(q);
  });

  const totalBalance = getAllUserData().reduce((s, x) => s + (x.data.wallet.balance || 0), 0);
  const totalTopup = allTx.filter(t => t.amount > 0 && t.ref !== 'REFUND').reduce((s, t) => s + t.amount, 0);
  const totalPayment = allTx.filter(t => t.amount < 0 && t.ref === 'ORDER').reduce((s, t) => s + Math.abs(t.amount), 0);
  const totalRefund = allTx.filter(t => t.ref === 'REFUND').reduce((s, t) => s + t.amount, 0);

  const types = [
    ['all','Tất cả'],
    ['topup','Nạp tiền'],
    ['payment','Thanh toán đơn'],
    ['refund','Hoàn tiền']
  ];
  return `
  <div class="adm-section" style="margin-top:2px">
    <div class="adm-section-head"><h2>Ví & giao dịch</h2></div>

    <div class="adm-stats" style="margin-bottom:22px">
      <div class="adm-stat"><div class="l">Tổng số dư ví</div><div class="v small">${fmtVND(totalBalance)}</div></div>
      <div class="adm-stat"><div class="l">Tổng nạp</div><div class="v small">${fmtVND(totalTopup)}</div></div>
      <div class="adm-stat"><div class="l">Thanh toán dịch vụ</div><div class="v small">${fmtVND(totalPayment)}</div></div>
      <div class="adm-stat"><div class="l">Hoàn tiền</div><div class="v small">${fmtVND(totalRefund)}</div></div>
    </div>

    <div class="adm-search-input">
      ${ic('search')}
      <input id="adminTxSearch" type="search" placeholder="Tìm theo người dùng hoặc mô tả..." value="${esc(adminTxFilter.q)}" autocomplete="off" />
    </div>

    <div class="adm-chips">
      ${types.map(([k,l]) => {
        const count = k === 'all' ? allTx.length : allTx.filter(t => {
          if (k === 'topup') return t.amount > 0 && t.ref !== 'REFUND' && t.ref !== 'REVOKE';
          if (k === 'payment') return t.amount < 0 && t.ref === 'ORDER';
          if (k === 'refund') return t.ref === 'REFUND' || t.ref === 'REVOKE';
          return true;
        }).length;
        return `<button class="adm-chip ${adminTxFilter.type===k?'active':''}" data-action="admin-tx-filter" data-type="${k}">${l}${count?' · '+count:''}</button>`;
      }).join('')}
    </div>

    ${list.length ? `<div class="adm-list">${list.map(adminTxItem).join('')}</div>` : `<div class="adm-empty">${ic('wallet')}<div class="t">Không có giao dịch</div><div class="s">Chưa có giao dịch nào phù hợp.</div></div>`}
  </div>
  <div class="notice">${ic('info')}<span>Ví chỉ dùng để thanh toán dịch vụ. Không hỗ trợ rút tiền. Mọi hoàn tiền do quản trị viên xử lý khi huỷ đơn.</span></div>
  `;
}

function adminTxItem(t){
  const isRefund = t.ref === 'REFUND';
  const isRevoke = t.ref === 'REVOKE';
  const isIn = t.amount > 0;
  let type, iconName, cls;
  if (isRefund) { type = 'Hoàn tiền'; iconName = 'rotate-ccw'; cls = 'refund'; }
  else if (isRevoke) { type = 'Huỷ hoàn tiền'; iconName = 'rotate-ccw'; cls = 'out'; }
  else if (isIn) { type = 'Nạp tiền'; iconName = 'plus'; cls = 'in'; }
  else { type = 'Thanh toán đơn'; iconName = 'receipt'; cls = 'out'; }
  return `
    <div class="adm-item">
      <div class="adm-item-top" style="margin-bottom:8px">
        <div class="tx-ic ${cls}" style="width:36px;height:36px;border-radius:10px">${ic(iconName)}</div>
        <div class="adm-item-main">
          <div class="adm-item-title">${esc(t.label)}</div>
          <div class="adm-item-sub">${esc(t.userName || '—')}</div>
        </div>
        <div class="adm-item-right">
          <div class="price" style="font-size:14px;color:${isIn ? '#86efac' : '#fca5a5'}">${isIn?'+':''}${fmtVND(t.amount)}</div>
        </div>
      </div>
      <div class="adm-meta">
        <span class="kv"><span class="k">Loại:</span><span class="v">${type}</span></span>
        <span class="kv"><span class="k">Thời gian:</span><span class="v">${fmtDateTime(t.time)}</span></span>
        <span class="kv"><span class="k">Trạng thái:</span><span class="v" style="color:#86efac">Đã duyệt</span></span>
      </div>
    </div>`;
}

/* =========================================================
   ADMIN GLOBAL SEARCH
   ========================================================= */
function adminSearchAll(q){
  q = String(q || '').trim().toLowerCase();
  if (!q) return { users: [], orders: [] };
  const users = getAllUserData().filter(x => {
    return x.user.username.toLowerCase().includes(q) || x.user.email.toLowerCase().includes(q);
  }).slice(0, 5).map(x => ({ user: x.user, data: x.data }));
  const orders = getAllOrders().filter(o => {
    return String(o.id||'').toLowerCase().includes(q) ||
           String(o.userName||'').toLowerCase().includes(q) ||
           String(o.playerId||'').includes(q);
  }).slice(0, 5);
  return { users, orders };
}

function showAdminSearchResults(q){
  const box = $('#adminSearchResults');
  if (!box) return;
  if (!q.trim()){ box.classList.remove('open'); box.innerHTML = ''; return; }
  const res = adminSearchAll(q);
  if (!res.users.length && !res.orders.length){
    box.innerHTML = `<div class="adm-search-empty">Không tìm thấy kết quả cho "${esc(q)}"</div>`;
    box.classList.add('open');
    return;
  }
  let html = '';
  if (res.users.length){
    html += `<div class="adm-sug-group">Người dùng</div>`;
    html += res.users.map(x => `
      <div class="adm-sug" data-action="admin-user-detail" data-id="${esc(x.user.id)}">
        <span class="ic">${ic('user')}</span>
        <div style="flex:1;min-width:0">
          <div class="t">${esc(x.user.username)}</div>
          <div class="s">${esc(x.user.email)} · ${x.data.orders.length} đơn</div>
        </div>
      </div>`).join('');
  }
  if (res.orders.length){
    html += `<div class="adm-sug-group">Đơn hàng</div>`;
    html += res.orders.map(o => `
      <div class="adm-sug" data-action="admin-order-detail" data-id="${esc(o.id)}">
        <span class="ic">${ic('receipt')}</span>
        <div style="flex:1;min-width:0">
          <div class="t">${esc(fmtOrderId(o.id))}</div>
          <div class="s">${esc(o.userName || '—')} · UID ${esc(o.playerId||'—')}</div>
        </div>
      </div>`).join('');
  }
  box.innerHTML = html;
  box.classList.add('open');
  refreshIcons();
}

  const cls = isRefund ? 'refund' : (isIn ? 'in' : 'out');
  return `<div class="tx">

      <div class="ri-t">${esc(t.label)}</div>

const PROTECTED = ['orders','order','order-success','wallet','favorites','profile','settings','notifications'];

let renderToken = 0;
let lastPath = null;

function render(){
  const route = parseHash();
  const path = location.hash || '#/home';
  const changed = path !== lastPath;
  lastPath = path;

  const adminMode = isAdminSession();
  document.body.classList.toggle('admin-mode', adminMode);
  $('#topbar').classList.toggle('admin-topbar', adminMode);

  /* ADMIN ROUTING */
  if (adminMode){
    if (route.name !== 'admin'){
      go('#/admin');
      return;
    }
    document.title = 'Quản trị — Webcuaquan';
    renderAdminChrome();
    const view = $('#view');
    view.innerHTML = viewAdmin(route);
    initCustomSelects();
    refreshIcons();
    if (changed) window.scrollTo(0, 0);
    return;
  }
  if (route.name === 'admin'){
    go('#/login');
    return;
  }

  if (route.name !== 'freefire'){ ffExpandedService = null; }
  document.title = PAGE_TITLES[route.name] || 'Webcuaquan';
  closeSuggest();
  closeAdminNotifPanel();
  renderChrome();
  const view = $('#view');
  const token = ++renderToken;
  if (PROTECTED.indexOf(route.name) > -1 && !getCurrentUser()){
    view.innerHTML = authRequiredView();
    refreshIcons();
    if (changed) window.scrollTo(0, 0);
    return;
  }
  const sk = skeletonFor(route.name);
  if (sk && changed){
    view.innerHTML = sk;
    refreshIcons();
    setTimeout(() => {
      if (token !== renderToken) return;
      view.innerHTML = routeHTML(route);
      afterRender(route);
      refreshIcons();
    }, 240);
  } else {
    view.innerHTML = routeHTML(route);
    afterRender(route);
    refreshIcons();
  }
  if (changed) window.scrollTo(0, 0);
  updateNotifBadge();
}

function setFieldError(field, msg){
  if (!field) return;
  const errEl = field.querySelector('.field-error');
  if (msg){
    field.classList.add('invalid');
    if (errEl){ errEl.textContent = msg; errEl.classList.add('show'); }
  } else {
    field.classList.remove('invalid');
    if (errEl){ errEl.textContent = ''; errEl.classList.remove('show'); }
  }
}

function getFFFieldError(field, form){
  const svcId = form.dataset.svcId;
  const svc = FF_SERVICES.find(s => s.id === svcId);
  if (!svc) return '';
  const key = field.dataset.field;
  const el = field.querySelector('input, select');
  const val = (el && el.value || '').trim();
  if (key === 'playerId'){
    if (!val) return 'Vui lòng nhập UID';
    if (!/^\d+$/.test(val)) return 'ID không phù hợp';
    if (val.length < 7 || val.length > 13) return 'ID không phù hợp';
    return '';
  }
  if (svc.type === 'rank'){
    if (key === 'currentRank') return val ? '' : 'Vui lòng chọn rank hiện tại';
    if (key === 'targetRank'){
      if (!val) return 'Vui lòng chọn rank muốn đạt';
      const curEl = form.querySelector('[data-field="currentRank"] select');
      const cur = (curEl && curEl.value || '').trim();
      if (!cur) return '';
      if (cur === val) return 'Rank muốn đạt phải khác rank hiện tại';
      const curIdx = FF_RANK_LIST.indexOf(cur);
      const tgtIdx = FF_RANK_LIST.indexOf(val);
      if (curIdx !== -1 && tgtIdx !== -1 && tgtIdx <= curIdx) return 'Rank muốn đạt phải cao hơn rank hiện tại';
      return '';
    }
  }
  if (svc.type === 'topsung'){
    if (key === 'topTarget') return val ? '' : 'Vui lòng chọn mốc top';
  }
  return '';
}
function calcFFPrice(form){
  const svcId = form.dataset.svcId;
  const svc = FF_SERVICES.find(s => s.id === svcId);
  if (!svc) return { price: 0, rows: [] };
  if (svc.type === 'rank'){
    const curEl = form.querySelector('[name="currentRank"]');
    const tgtEl = form.querySelector('[name="targetRank"]');
    const cur = curEl ? curEl.value : '';
    const tgt = tgtEl ? tgtEl.value : '';
    if (!cur || !tgt) return { price: 0, rows: [] };
    const curIdx = FF_RANK_LIST.indexOf(cur);
    const tgtIdx = FF_RANK_LIST.indexOf(tgt);
    if (curIdx === -1 || tgtIdx === -1 || tgtIdx <= curIdx) return { price: 0, rows: [] };
    const rows = [];
    let total = 0;
    for (let i = curIdx; i < tgtIdx; i++){
      const step = FF_RANK_STEP_PRICES[i];
      rows.push({ from: FF_RANK_LIST[i], to: FF_RANK_LIST[i+1], price: step });
      total += step;
    }
    return { price: total, rows };
  }
  if (svc.type === 'topsung'){
    const tgtEl = form.querySelector('[name="topTarget"]');
    const val = tgtEl ? tgtEl.value : '';
    if (!val) return { price: 0, rows: [] };
    const found = TOP_GUN_PRICES.find(t => t.value === val);
    if (!found) return { price: 0, rows: [] };
    return { price: found.price, rows: [{ label: 'Mốc ' + found.label, price: found.price }] };
  }
  return { price: 0, rows: [] };
}
function renderFFPriceSummary(form){
  const out = form.querySelector('[data-price-summary]');
  if (!out) return;
  const { price, rows } = calcFFPrice(form);
  if (!price || !rows.length){
    out.innerHTML = '<div class="price-row total" style="border-top:none;margin-top:0;padding-top:0"><span>Giá dịch vụ</span><span>—</span></div>';
    return;
  }
  const rowsHTML = rows.map(r => {
    const label = r.label || ('Bậc ' + r.from + ' → ' + r.to);
    return `<div class="price-row"><span>${esc(label)}</span><span>${Number(r.price).toLocaleString('vi-VN')}đ</span></div>`;
  }).join('');
  out.innerHTML = rowsHTML + `<div class="price-row total"><span>Tổng dự kiến</span><span>${Number(price).toLocaleString('vi-VN')}đ</span></div>`;
}
function validateFFForm(form, showAll){
  let allOk = true;
  form.querySelectorAll('.field[data-field]').forEach(field => {
    const err = getFFFieldError(field, form);
    if (err){
      allOk = false;
      if (showAll || field.dataset.touched === '1') setFieldError(field, err);
      else setFieldError(field, '');
    } else {
      setFieldError(field, '');
    }
  });
  const btn = form.querySelector('button[type="submit"]');
  if (btn) btn.disabled = !allOk;
  renderFFPriceSummary(form);
  return allOk;
}
function initFFForms(){
  document.querySelectorAll('form[data-form="ff-order"]').forEach(form => {
    if (form.dataset.ffInit) return;
    form.dataset.ffInit = '1';
    const revalidate = () => validateFFForm(form, false);
    form.querySelectorAll('.field[data-field]').forEach(field => {
      const el = field.querySelector('input, select');
      if (!el) return;
      const onTouch = () => { field.dataset.touched = '1'; revalidate(); };
      el.addEventListener('input', onTouch);
      el.addEventListener('change', onTouch);
      el.addEventListener('blur', onTouch);
    });
    validateFFForm(form, false);
  });
}
const BASIC_RULES = {

    confirm: (v, form) => {
      if (!v) return 'Vui lòng nhập lại mật khẩu mới';

      const next = nextEl ? nextEl.value : '';
      return v !== next ? 'Mật khẩu xác nhận không khớp' : '';
    }

      if (!v) return 'Vui lòng nhập tên hiển thị';
      if (v.length < 3) return 'Tên hiển thị phải có ít nhất 3 ký tự';
      return '';
    }
  }
};
function validateBasicForm(form, showAll){
  const type = form.dataset.form;
  const rules = BASIC_RULES[type];
  if (!rules) return true;
  let allOk = true;
  form.querySelectorAll('.field[data-field]').forEach(field => {
    const key = field.dataset.field;
    const rule = rules[key];
    if (!rule) return;
    let val = '';
    if (key === 'terms'){
      const cb = field.querySelector('input[type="checkbox"]');
      val = cb ? String(cb.checked) : '';
    } else {
      const el = field.querySelector('input, select, textarea');
      val = (el && el.value || '').trim();
    }
    const err = rule(val, form);
    if (err){
      allOk = false;
      if (showAll || field.dataset.touched === '1') setFieldError(field, err);
      else setFieldError(field, '');
    } else {
      setFieldError(field, '');
    }
  });
  return allOk;
}
function initFormValidation(root){
  (root || document).querySelectorAll('form[data-form]').forEach(form => {
    if (form.dataset.fvInit) return;
    form.dataset.fvInit = '1';
    const type = form.dataset.form;
    if (type === 'ff-order') return;
    if (!BASIC_RULES[type]) return;
    form.querySelectorAll('.field[data-field]').forEach(field => {
      const el = field.querySelector('input, select, textarea');
      if (!el) return;
      const onTouch = () => {
        field.dataset.touched = '1';
        validateBasicForm(form, false);
      };
      el.addEventListener('blur', onTouch);
      el.addEventListener('input', () => { if (field.dataset.touched === '1') validateBasicForm(form, false); });
      el.addEventListener('change', () => { field.dataset.touched = '1'; validateBasicForm(form, false); });
    });
  });
}

function initCustomSelects(root){
  root = root || document;
  root.querySelectorAll('[data-custom-select]').forEach(wrap => {
    if (wrap.dataset.csInit) return;
    wrap.dataset.csInit = '1';
    const sel = wrap.querySelector('.cd-select-native');
    const trigger = wrap.querySelector('.cd-select-trigger');
    const menu = wrap.querySelector('.cd-select-menu');
    const valueEl = wrap.querySelector('.cd-select-value');
    if (!sel || !trigger || !menu || !valueEl) return;
    const placeholder = wrap.dataset.placeholder || 'Chọn';
    menu.innerHTML = Array.from(sel.options).map(o =>
      `<button type="button" class="cd-select-option" role="option" data-value="${esc(o.value)}" ${o.disabled ? 'disabled' : ''}>${esc(o.textContent)}</button>`
    ).join('');
    const updateLabel = () => {
      const cur = sel.value;
      const found = Array.from(sel.options).find(o => o.value === cur);
      if (cur && found){ valueEl.textContent = found.textContent; valueEl.classList.remove('placeholder'); }
      else { valueEl.textContent = placeholder; valueEl.classList.add('placeholder'); }
      menu.querySelectorAll('.cd-select-option').forEach(b => b.classList.toggle('selected', b.dataset.value === cur));
    };
    updateLabel();
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('[data-custom-select].open').forEach(w => {
        if (w !== wrap){ w.classList.remove('open'); const t = w.querySelector('.cd-select-trigger'); if (t) t.setAttribute('aria-expanded','false'); }
      });
      const open = wrap.classList.toggle('open');
      trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    menu.addEventListener('click', (e) => {
      const b = e.target.closest('.cd-select-option');
      if (!b || b.disabled) return;
      e.stopPropagation();
      sel.value = b.dataset.value;
      sel.dispatchEvent(new Event('change', { bubbles: true }));
      sel.dispatchEvent(new Event('input', { bubbles: true }));
      wrap.classList.remove('open');
      trigger.setAttribute('aria-expanded','false');
      updateLabel();
    });
    sel.addEventListener('change', updateLabel);
  });
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('[data-custom-select]')){
    document.querySelectorAll('[data-custom-select].open').forEach(w => {
      w.classList.remove('open');
      const t = w.querySelector('.cd-select-trigger');
      if (t) t.setAttribute('aria-expanded','false');
    });
  }
});
document.addEventListener('keydown', (e) => {

    });
    closeAdminSearchResults();
  }
});

function copyToClipboard(text, okMsg){
  const t = String(text || '');
  if (!t) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(() => toast(okMsg || 'Đã sao chép', 'success'), () => fallbackCopy(t, okMsg));
    } else fallbackCopy(t, okMsg);
  } catch(err){ fallbackCopy(t, okMsg); }
}
function fallbackCopy(text, okMsg){
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast(okMsg || 'Đã sao chép', 'success');
  } catch(err){ toast('Không thể sao chép', 'info'); }
}

document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('modal-backdrop')){ closeModal(); return; }
  const t = e.target.closest('[data-action]');
  if (!t){
    if (!e.target.closest('.search-wrap')) closeSuggest();
    if (!e.target.closest('.notif-panel') && !e.target.closest('#notifBtn')) closeNotifPanel();
    if (!e.target.closest('.adm-search') ) closeAdminSearchResults();
    if (!e.target.closest('#admNotifPanel') && !e.target.closest('#adminNotifBtn')) closeAdminNotifPanel();
    return;
  }
  const a = t.dataset.action;
  switch (a){
    case 'fav': e.preventDefault(); toggleFav(t.dataset.type, t.dataset.id); break;
    case 'modal-close': closeModal(); break;
    case 'toggle-pw': {
      e.preventDefault();
      const wrap = t.closest('.pw-wrap');
      const input = wrap && wrap.querySelector('input');
      if (input){
        const isPw = input.type === 'password';
        input.type = isPw ? 'text' : 'password';
        t.innerHTML = isPw ? ic('eye-off') : ic('eye');
        refreshIcons();
      }
      break;
    }
    case 'avatar-upload': e.preventDefault(); ensureAvatarInput().click(); break;
    case 'avatar-delete': {
      e.preventDefault();
      if (!getCurrentUser()) return;
      if (!updateUser({ avatar: null })){ toast('Không thể xoá ảnh.', 'error'); return; }
      toast('Đã xoá ảnh đại diện', 'success');
      const wasOpen = !!document.querySelector('.modal [data-form="edit-profile"]');
      render();
      if (wasOpen) editProfileModal();
      break;
    }
    case 'copy-text': e.preventDefault(); copyToClipboard(t.dataset.text, 'Đã sao chép'); break;
    case 'open-pay': openPaymentModal(); break;
    case 'pay-tab': payTab = t.dataset.tab; refreshPaymentModal(); break;
    case 'pay-amount': payAmount = Number(t.dataset.amount); refreshPaymentModal(); break;
    case 'pay-copy-ref': copyToClipboard(payRefCode, 'Đã sao chép nội dung chuyển khoản'); break;
    case 'pay-confirm-qr': {
      if (payLocked) return;
      if (!payAmount || payAmount < 10000){ toast('Số tiền nạp tối thiểu là 10.000đ', 'error'); break; }
      payLocked = true;
      t.disabled = true; t.style.opacity = '.6'; t.style.pointerEvents = 'none';
      creditWallet(payAmount, 'Nạp tiền qua QR demo');
      break;
    }
    case 'logout': confirmLogoutModal(); break;
    case 'logout-confirm': {
      logoutUser(); closeModal();
      toast('Đã đăng xuất', 'success');
      go('#/home'); render(); break;
    }
    case 'google': toast('Đăng nhập Google không khả dụng', 'info'); break;
    case 'mark-read': {
      const d = getData();
      if (!d) break;
      d.notifications.forEach(n => n.read = true);
      saveData(d); updateNotifBadge(); render();
      break;
    }
    case 'orders-tab': ordersTab = t.dataset.tab; render(); break;
    case 'faq': {
      const item = t.closest('.faq-item');
      const open = item.classList.contains('open');
      $$('.faq-item').forEach(f => f.classList.remove('open'));
      if (!open) item.classList.add('open');
      break;
    }
    case 'scroll-tx': {
      const el = $('#txSection');
      if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      break;
    }
    case 'edit-profile': editProfileModal(); break;
    case 'change-password': changePasswordModal(); break;
    case 'toggle-setting': {
      const d = getData();
      if (!d) break;
      const key = t.dataset.key;
      d.settings[key] = !d.settings[key];
      if (!saveData(d)){ toast('Không thể lưu cài đặt', 'error'); break; }
      t.classList.toggle('on', d.settings[key]);
      toast('Đã cập nhật setting', 'success');
      break;
    }
    case 'cancel-order': cancelOrderConfirmModal(t.dataset.id); break;
    case 'cancel-order-confirm': performCancelOrder(t.dataset.id); break;
    case 'report': toast('Đang mở hỗ trợ cho đơn ' + fmtOrderId(t.dataset.id), 'info'); go('#/support'); break;
    case 'ff-toggle-service': {
      const sid = t.dataset.svc;
      ffExpandedService = ffExpandedService === sid ? null : sid;
      render();
      if (ffExpandedService){
        setTimeout(() => {
          const el = document.querySelector('.rank-row.expanded');
          if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
        }, 200);
      }
      break;
    }
    /* ========== ADMIN ACTIONS ========== */
    case 'admin-logout': adminLogoutModal(); break;
    case 'admin-logout-confirm': {
      setAdminSession(false);
      closeModal();
      toast('Đã đăng xuất', 'success');
      go('#/login');
      render();
      break;
    }
    case 'admin-user-detail':
      closeAdminSearchResults();
      adminUserDetailModal(t.dataset.id);
      break;
    case 'admin-order-detail':
      closeAdminSearchResults();
      adminOrderDetailModal(t.dataset.id);
      break;
    case 'admin-user-sort':
      adminUsersFilter.sort = t.dataset.sort;
      render();
      break;
    case 'admin-order-filter':
      adminOrdersFilter.status = t.dataset.status;
      render();
      break;
    case 'admin-tx-filter':
      adminTxFilter.type = t.dataset.type;
      render();
      break;
    case 'admin-goto': {
      go(t.dataset.href);
      break;
    }
    case 'admin-notif-close':
      closeAdminNotifPanel();
      break;
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'globalSearch'){ showSuggestions(el.value); }
  if (el.id === 'adminSearch'){ showAdminSearchResults(el.value); }
  if (el.matches && el.matches('[data-numeric]')){
    const v = el.value;
    let cleaned = v.replace(/\D/g, '');
    if (cleaned !== v){
      const start = el.selectionStart;
      const diff = v.length - cleaned.length;
      el.value = cleaned;
      try {
        const newPos = Math.max(0, (start || cleaned.length) - diff);
        el.setSelectionRange(newPos, newPos);
      } catch(err){}
    }
  }
  if (el.id === 'adminUserSearch'){
    adminUsersFilter.q = el.value;
    const pos = el.selectionStart;
    render();
    const nel = $('#adminUserSearch');
    if (nel){ nel.focus(); try { nel.setSelectionRange(pos, pos); } catch(err){} }
  }
  if (el.id === 'adminOrderSearch'){
    adminOrdersFilter.q = el.value;
    const pos = el.selectionStart;
    render();
    const nel = $('#adminOrderSearch');
    if (nel){ nel.focus(); try { nel.setSelectionRange(pos, pos); } catch(err){} }
  }
  if (el.id === 'adminTxSearch'){
    adminTxFilter.q = el.value;
    const pos = el.selectionStart;
    render();
    const nel = $('#adminTxSearch');
    if (nel){ nel.focus(); try { nel.setSelectionRange(pos, pos); } catch(err){} }
  }
});

document.addEventListener('paste', e => {
  const el = e.target;
  if (el && el.matches && el.matches('[data-numeric]')){
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text') || '';
    let cleaned = String(text).replace(/\D/g, '');
    const start = el.selectionStart || 0;
    const end = el.selectionEnd || 0;
    const v = el.value;
    const before = v.slice(0, start);
    const after = v.slice(end);
    el.value = before + cleaned + after;
    const newPos = start + cleaned.length;
    try { el.setSelectionRange(newPos, newPos); } catch(err){}
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
});

let isRegistering = false;

document.addEventListener('submit', e => {
  const form = e.target;
  const kind = form.dataset.form;
  if (!kind) return;
  e.preventDefault();

  if (kind === 'login'){
    if (!validateBasicForm(form, true)) return;
    const email = form.email.value.trim();
    const pass = form.password.value;
    const res = loginUser(email, pass);
    if (!res.ok){
      if (res.error.includes('email')) setFieldError(form.querySelector('[data-field="email"]'), res.error);
      else if (res.error.includes('Mật khẩu')) setFieldError(form.querySelector('[data-field="password"]'), res.error);
      else toast(res.error, 'error');
      return;
    }
    if (res.isAdmin){
      toast('Chào mừng quản trị viên', 'success');
      go('#/admin');
      render();
      return;
    }
    toast('Chào mừng trở lại, ' + res.user.username, 'success');
    go('#/home'); render();
    return;
  }

  if (kind === 'register'){
    if (isRegistering) return;
    if (!validateBasicForm(form, true)) return;
    const username = form.username.value.trim();
    const email = form.email.value.trim();
    const password = form.password.value;
    isRegistering = true;
    const submitBtn = form.querySelector('button[type="submit"]');
    if (submitBtn){ submitBtn.disabled = true; submitBtn.style.opacity = '.6'; submitBtn.style.pointerEvents = 'none'; submitBtn.textContent = 'Đang tạo tài khoản...'; }
    showLoadingOverlay('Đang tạo tài khoản...');
    setTimeout(() => {
      const res = registerUser({ username, email, password });
      hideLoadingOverlay();
      isRegistering = false;
      if (!res.ok){
        if (res.error.includes('Email')) setFieldError(form.querySelector('[data-field="email"]'), res.error);
        else if (res.error.includes('Tên hiển thị')) setFieldError(form.querySelector('[data-field="username"]'), res.error);
        else toast(res.error, 'error');
        if (submitBtn){ submitBtn.disabled = false; submitBtn.style.opacity = ''; submitBtn.style.pointerEvents = ''; submitBtn.textContent = 'Tạo tài khoản'; }
        return;
      }
      toast('Đã tạo tài khoản — chào mừng đến Webcuaquan', 'success');
      go('#/home'); render();
    }, 1500);
    return;
  }

  if (kind === 'ff-order'){
    const svcId = form.dataset.svcId;
    const svc = FF_SERVICES.find(s => s.id === svcId);
    if (!svc){ toast('Không tìm thấy dịch vụ', 'error'); return; }
    const u = getCurrentUser();
    if (!u){ toast('Vui lòng đăng nhập để đặt dịch vụ', 'info'); go('#/login'); return; }
    if (!validateFFForm(form, true)) return;
    const playerId = (form.playerId.value || '').trim();
    const { price } = calcFFPrice(form);
    if (!price || price <= 0){ toast('Vui lòng chọn đầy đủ để tính giá', 'error'); return; }
    let currentRank = '—', targetRank = '—';
    if (svc.type === 'rank'){
      currentRank = (form.currentRank.value || '').trim();
      targetRank = (form.targetRank.value || '').trim();
    } else if (svc.type === 'topsung'){
      const tgt = (form.topTarget.value || '').trim();
      const found = TOP_GUN_PRICES.find(x => x.value === tgt);
      currentRank = '—';
      targetRank = found ? found.label : tgt;
    }
    const checkData = getData();
    if (!checkData){ toast('Không thể đọc dữ liệu ví. Vui lòng thử lại.', 'error'); return; }
    const balance = checkData.wallet.balance || 0;
    if (balance < price){ showInsufficientBalanceModal(balance, price); return; }
    const submitBtn = form.querySelector('button[type="submit"]');
    if (submitBtn){ submitBtn.disabled = true; submitBtn.style.opacity = '.6'; submitBtn.style.pointerEvents = 'none'; submitBtn.textContent = 'Đang xử lý...'; }
    showLoadingOverlay('Đang tạo đơn hàng...');
    setTimeout(() => {
      const d2 = getData();
      if (!d2){
        hideLoadingOverlay();
        toast('Lỗi dữ liệu. Vui lòng thử lại.', 'error');
        if (submitBtn){ submitBtn.disabled = false; submitBtn.style.opacity = ''; submitBtn.style.pointerEvents = ''; submitBtn.textContent = 'ĐẶT DỊCH VỤ'; }
        return;
      }
      if (d2.wallet.balance < price){
        hideLoadingOverlay();
        showInsufficientBalanceModal(d2.wallet.balance, price);
        if (submitBtn){ submitBtn.disabled = false; submitBtn.style.opacity = ''; submitBtn.style.pointerEvents = ''; submitBtn.textContent = 'ĐẶT DỊCH VỤ'; }
        return;
      }
      const order = createFFOrder(svc, currentRank, targetRank, playerId, price);
      hideLoadingOverlay();
      if (!order){
        toast('Không thể tạo đơn. Bộ nhớ trình duyệt có thể đã đầy.', 'error');
        if (submitBtn){ submitBtn.disabled = false; submitBtn.style.opacity = ''; submitBtn.style.pointerEvents = ''; submitBtn.textContent = 'ĐẶT DỊCH VỤ'; }
        return;
      }
      ffExpandedService = null;
      render();
      updateNotifBadge();
      showOrderSuccessModal(order);
      toast('Đã thanh toán và tạo đơn ' + fmtOrderId(order.id), 'success');
    }, 1500);
    return;
  }

  if (kind === 'card-pay'){
    if (payLocked) return;
    if (!validateBasicForm(form, true)) return;
    const network = form.network.value;
    const denom = Number(form.denom.value);
    if (!CARD_DENOMS.includes(denom)){ toast('Mệnh giá không hợp lệ', 'error'); return; }
    payLocked = true;
    const btn = form.querySelector('button[type="submit"]');
    if (btn){ btn.disabled = true; btn.style.opacity = '.6'; btn.style.pointerEvents = 'none'; }
    creditWallet(denom, 'Nạp thẻ ' + network + ' demo');
    return;
  }

  if (kind === 'ticket'){
    if (!validateBasicForm(form, true)) return;
    const d = getData();
    if (d){
      d.tickets.push({ id: uid('tk'), subject: form.subject.value.trim(),
        orderId: form.orderId.value.trim(), message: form.message.value.trim(), time: Date.now() });
      saveData(d);
    }
    form.reset();
    form.querySelectorAll('.field[data-field]').forEach(f => { f.dataset.touched = ''; setFieldError(f, ''); });
    toast('Đã gửi yêu cầu — đội ngũ sẽ phản hồi sớm', 'success');
    return;
  }

  if (kind === 'edit-profile'){
    if (!validateBasicForm(form, true)) return;
    const u = getCurrentUser();
    if (!u) return;
    const newName = (form.username.value || '').trim();
    const updates = {};
    const nameInput = form.querySelector('input[name="username"]');
    if (nameInput && !nameInput.disabled){
      if (newName !== u.username){
        const check = canChangeName(u);
        if (!check.ok){
          setFieldError(form.querySelector('[data-field="username"]'),
            'Bạn chỉ có thể đổi tên hiển thị 1 lần mỗi 7 ngày. Còn lại: ' + fmtRemaining(check.remainingMs));
          return;
        }
        const users = getUsers();
        if (users.some(x => x.id !== u.id && String(x.username || '').toLowerCase() === newName.toLowerCase())){
          setFieldError(form.querySelector('[data-field="username"]'), 'Tên hiển thị này đã được sử dụng');
          return;
        }
        updates.username = newName;
        updates.lastNameChange = Date.now();
      }
    }
    if (Object.keys(updates).length === 0){ toast('Không có thay đổi nào để lưu', 'info'); closeModal(); return; }
    if (!updateUser(updates)){ toast('Không thể lưu thay đổi. Bộ nhớ trình duyệt đầy.', 'error'); return; }
    closeModal();
    toast('Đã cập nhật hồ sơ', 'success');
    render();
    return;
  }

  if (kind === 'change-password'){
    if (!validateBasicForm(form, true)) return;
    const u = getCurrentUser();
    if (!u) return;
    const current = form.current.value;
    const next = form.next.value;
    if (demoHash(current) !== u.pass){
      setFieldError(form.querySelector('[data-field="current"]'), 'Mật khẩu hiện tại không đúng');
      return;
    }
    if (next === current){
      setFieldError(form.querySelector('[data-field="next"]'), 'Mật khẩu mới phải khác mật khẩu hiện tại');
      return;
    }
    if (!updateUser({ pass: demoHash(next) })){ toast('Không thể cập nhật mật khẩu. Vui lòng thử lại.', 'error'); return; }
    closeModal();
    toast('Đã cập nhật mật khẩu', 'success');
    return;
  }
});

function toggleNotifPanel(){
